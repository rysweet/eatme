[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eatme-uvx"
version = "0.7.1"
description = "uvx entry point for running the eatme Rust CLI from a Git branch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
amplihack = "eatme_uvx.cli:main"
eatme = "eatme_uvx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eatme_uvx"]

[tool.hatch.build.targets.wheel.force-include]
"Cargo.toml" = "eatme_uvx/_source/Cargo.toml"
"Cargo.lock" = "eatme_uvx/_source/Cargo.lock"
"assets" = "eatme_uvx/_source/assets"
"crates" = "eatme_uvx/_source/crates"
