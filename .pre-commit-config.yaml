repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: module-size
        name: Rust module size
        entry: ./scripts/check-module-size.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: docs-build
        name: mkdocs build --strict
        entry: mkdocs build --strict
        language: system
        pass_filenames: false
        always_run: true
