schema_version: eatme.parity-journey-matrix/v1
id: rabbithole-lookingglass-journey-matrix
source_inventory: docs/eatme/alice-howto-coverage.md
purpose: >-
  Durable RabbitHole-vs-LookingGlass user journey parity matrix. A row is
  closed only when the RabbitHole behavior and LookingGlass behavior are both
  named and the listed closure command passes, or unsupported web behavior is
  explicitly declared with a reason.
rows:
  - scenario: setup-preflight-ready-to-create
    area: "Setup and first use"
    journey: "Instructor checks install readiness, confirms required tools, and prepares a classroom-ready create-project path."
    rabbit_hole:
      status: partial
      source_status: "Partial: editable scenario asset validates; missing instructor agentic acceptance output evidence"
      command: cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/setup-preflight-ready-to-create.yaml --json
      expected_behavior: "Instructor setup-readiness asset validates; real Alice launch readiness remains an input and agentic acceptance output is not claimed by this command."
    looking_glass:
      status: covered
      source_status: "Covered: web setup/readiness API evidence is covered; desktop setup checks are not claimed"
      reason: "LookingGlass covers web health, config, setup preflight, create-project readiness, and evidence handoff; desktop setup checks are not claimed."
      command: EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} EATME_SETUP_READINESS_SCENARIO=setup-preflight-ready-to-create ALICE_WEB_URL="${ALICE_WEB_URL:-http://localhost:3099}" cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
      expected_behavior: "Instructor checks LookingGlass web server health/config, confirms the web create-project path is ready, receives explicit desktop-only boundaries, and creates a setup-readiness evidence handoff."
    closure:
      required:
        - RabbitHole editable scenario asset validates; missing agentic acceptance output remains explicitly partial
        - LookingGlass command passes for the setup-preflight-ready-to-create web readiness path
        - behavior evidence names user-visible result, not implementation details
  - scenario: setup-support-lab-readiness
    area: "Setup and first use"
    journey: "Support helper reproduces setup guidance, diagnoses missing desktop prerequisites, and records repair guidance."
    rabbit_hole:
      status: covered
      source_status: "Covered"
      command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home ${ALICE_HOME} --scenario setup-support-lab-readiness --run-id parity-setup-support-lab-readiness --runs-dir runs --timeout 1800 --json
      expected_behavior: "Support helper reproduces setup guidance, diagnoses missing desktop prerequisites, and records repair guidance."
    looking_glass:
      status: covered
      source_status: "Covered: web setup/readiness API evidence is covered; desktop setup checks are not claimed"
      reason: "LookingGlass covers web lab-readiness signals and support handoff fields; desktop setup checks are not claimed."
      command: EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} EATME_SETUP_READINESS_SCENARIO=setup-support-lab-readiness ALICE_WEB_URL="${ALICE_WEB_URL:-http://localhost:3099}" cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
      expected_behavior: "Support helper verifies LookingGlass health/config, runs web setup preflight, creates a starter project, and receives blocker-owner-retest handoff guidance with desktop-only boundaries named."
    closure:
      required:
        - RabbitHole real Alice setup-support command passes with setup-support and lab-readiness evidence
