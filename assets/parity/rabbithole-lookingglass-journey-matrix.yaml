schema_version: eatme.parity-journey-matrix/v1
id: rabbithole-lookingglass-journey-matrix
source_inventory: docs/eatme/alice-howto-coverage.md
purpose: >-
  Durable RabbitHole-vs-LookingGlass user journey parity matrix. A row is
  closed only when the RabbitHole behavior and LookingGlass behavior are both
  named and the listed closure command passes, or unsupported web behavior is
  explicitly declared with a reason.
rows:
  - scenario: setup-preflight-ready-to-create
    area: "Setup and first use"
    journey: "Instructor checks install readiness, confirms required tools, and prepares a classroom-ready create-project path."
    rabbit_hole:
      status: covered
      source_status: "Covered"
      command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home ${ALICE_HOME} --scenario setup-preflight-ready-to-create --run-id parity-setup-preflight-ready-to-create --runs-dir runs --timeout 1800 --json
      expected_behavior: "Instructor checks install readiness, confirms required tools, and prepares a classroom-ready create-project path."
    looking_glass:
      status: not_supported
      source_status: "Not supported"
      reason: "Not supported"
    closure:
      required:
        - RabbitHole command passes with real Alice evidence
        - LookingGlass unsupported status remains explicit until implementation exists
        - behavior evidence names user-visible result, not implementation details
