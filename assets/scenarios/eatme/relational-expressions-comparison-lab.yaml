schema_version: eatme.scenario/v1
id: relational-expressions-comparison-lab
title: Relational Expressions Comparison Lab
kind: alice_lesson_smoke
owner: eatme
resource_basis:
- name: Alice.org Relational Expressions lesson
  url: https://www.alice.org/resources/lessons/relational-expressions/
- name: Alice.org Alice 3 lessons
  url: https://www.alice.org/resources/alice-3-lessons/
purpose: Cover the Relational Expressions alice.org lesson where students learn comparison operators and boolean logic within Alice conditional statements.
launcher:
  command: alice run-howto
  scenario: relational-expressions-comparison-lab
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
  - concept-cartographer
  - assessment-curator
  students:
  - systems-puzzle-solver
  - reflective-debugger
  - data-detective
capabilities:
  required:
  - rust-cli
  - java-21
  - maven
  - xvfb
  - xdpyinfo
  - wmctrl
  - screenshot-tool
  optional:
  - glxinfo
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
smoke_ready:
  evidence:
  - manifest_assertions
  - captured_logs
  - screenshot_or_window_evidence
  - scenario_id
acceptance_criteria:
- given: Alice launch smoke dependencies are available
  when: the variables-scorekeeper-timekeeper scenario is launched through eatme
  then: the manifest identifies scenario_id variables-scorekeeper-timekeeper
- given: students need state evidence
  when: agentic follow-on evaluates this scenario
  then: it judges visible state changes, data-type explanation, and score/timer rules rather than private code names
- given: gadugi needs to exercise the scenario
  when: the gadugi adapter runs commands for this scenario
  then: gadugi invokes eatme CLI and inspects manifest-level evidence only
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes this scenario asset
- id: check-dependencies
  command: cargo run -q -p eatme-cli -- deps check --json
  evidence:
  - stdout JSON has all_required_available=true
- id: launch-smoke
  command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home ${ALICE_HOME} --run-id ${RUN_ID} --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario relational-expressions-comparison-lab
  evidence:
  - manifest scenario_id equals relational-expressions-comparison-lab
  - manifest failure_category is null
  - manifest assertions include real_alice_execution_evidence passed=true
  - manifest assertions all pass
  - screenshot or window evidence exists and is non-empty
  - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#relational-expressions-comparison-lab
  deterministic_gate: Run this scenario before asking agents to assess whether a learner used variables, data types, and visible state changes in a scorekeeper or timer.
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/variables-scorekeeper-timekeeper/${RUN_ID}/manifest.json
  screenshot: runs/variables-scorekeeper-timekeeper/${RUN_ID}/screenshots/startup.png
  log: runs/variables-scorekeeper-timekeeper/${RUN_ID}/alice.log
  window_list: runs/variables-scorekeeper-timekeeper/${RUN_ID}/window-list.txt
unsupported_policy: If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit EATME_REAL_ALICE=1 gate are missing, fail loudly. Do not silently skip or substitute a mocked Alice runtime.
