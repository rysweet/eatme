schema_version: eatme.scenario/v1
id: model-texture-import-checkpoint
title: Model Texture Import Checkpoint
kind: alice_lesson_smoke
owner: eatme
resource_basis:
- name: Alice 3 resource categories
  url: https://www.alice.org/resources/alice-3/
  use: Use Alice 3 lessons, exercises, projects, and how-tos as the classroom context for import or fallback asset work.
- name: Alice.org Building A Scene lesson
  url: https://www.alice.org/resources/lessons/building-a-scene/
  use: Use object placement, orientation, camera, and saving objectives as the visible checks after an import or fallback choice.
purpose: Prove the model/texture import checkpoint has a real Alice launch gate before agents judge source, license, scale, orientation, texture visibility, and fallback evidence.
launcher:
  command: alice run-howto
  scenario: model-texture-import-checkpoint
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
  - setup-support-specialist
  - exercise-forger
  students:
  - model-texture-importer
  - reflective-debugger
  - creative-storyteller
capabilities:
  required:
  - rust-cli
  - java-21
  - maven
  - xvfb
  - xdpyinfo
  - wmctrl
  - screenshot-tool
  optional:
  - glxinfo
  - classroom-asset-library
  - external-model-source
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
smoke_ready:
  evidence:
  - manifest_assertions
  - captured_logs
  - screenshot_or_window_evidence
  - scenario_id
  - import_checkpoint
  - fallback_asset_evidence
acceptance_criteria:
- given: Alice launch smoke dependencies are available
  when: the model-texture-import-checkpoint scenario is launched through eatme
  then: the manifest identifies scenario_id model-texture-import-checkpoint
- given: an external model or texture is attempted
  when: the checkpoint is reviewed
  then: evidence records source, permission or license, scale, orientation, texture visibility, issue, and fallback choice
- given: import fails or is not classroom-appropriate
  when: the learner continues the activity
  then: a fallback asset keeps the Alice world runnable and preserves the programming goal
- given: gadugi needs to exercise the scenario
  when: the generated adapter runs commands for this scenario
  then: gadugi invokes eatme CLI and inspects manifest-level evidence only
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
- LookingGlass:test/model-texture-import-checkpoint-closure.contract.test.ts proves imported model bytes, texture bytes, assignment metadata, camera checkpoint state, export, and reopen persistence.
- LookingGlass:test/imported-project-assets-security.contract.test.ts proves imported model and texture resource identifiers reject traversal, encoded separators, absolute paths, unsupported extensions, and unsafe project scope.
- LookingGlass:test/model-texture-camera-joint-export-workflow.contract.test.ts proves the public workflow API exports resources and share fallback artifacts without native Web Share overclaims.
- LookingGlass:test/imported-asset-project-io.test.ts proves imported asset descriptors, resource bytes, and surface bindings round-trip through project IO.
- Import checklist includes provenance, visual verification, issue/fallback, and concept link.
- Learner can proceed even when a third-party asset fails.
- The checkpoint avoids requiring one specific external asset or spending the lesson asset hunting.
rubric:
- criterion: Responsible asset use
  evidence:
  - Source and permission or license are recorded before classroom use.
  - External media choices do not replace the programming concept.
- criterion: Visual and fallback evidence
  evidence:
  - Scale, orientation, and texture visibility are checked in the Alice world or notes.
  - Fallback asset behavior remains runnable and explainable.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes model-texture-import-checkpoint in the committed scenario set
- id: record-import-checkpoint
  command: bash -lc 'printf "import_fields=source,license,scale,orientation,texture-visibility,issue,fallback\nrequired_evidence=visual-check,runnable-world,concept-link,reflection\n"'
  evidence:
  - import output names source, license, scale, orientation, texture visibility, issue, and fallback fields
  - required evidence includes visual check, runnable world, concept link, and reflection
- id: launch-smoke
  command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home ${ALICE_HOME} --run-id ${RUN_ID} --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario model-texture-import-checkpoint
  evidence:
  - manifest scenario_id equals model-texture-import-checkpoint
  - manifest failure_category is null
  - manifest assertions include real_alice_execution_evidence passed=true
  - manifest assertions all pass
  - screenshot or window evidence exists and is non-empty
  - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#model-texture-import-checkpoint
  personality_assets:
  - debug-conference-card
  - creative-ownership-card
  deterministic_gate: Run this scenario before asking agents to judge import readiness, provenance, texture visibility, scale/orientation checks, or fallback quality.
  required_observables:
  - import checkpoint
  - fallback asset evidence
  - learner reflection connecting asset choice to concept
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/model-texture-import-checkpoint/${RUN_ID}/manifest.json
  screenshot: runs/model-texture-import-checkpoint/${RUN_ID}/screenshots/startup.png
  log: runs/model-texture-import-checkpoint/${RUN_ID}/alice.log
  window_list: runs/model-texture-import-checkpoint/${RUN_ID}/window-list.txt
  import_checkpoint: runs/model-texture-import-checkpoint/${RUN_ID}/import-checkpoint.md
unsupported_policy: If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit EATME_REAL_ALICE=1 gate are missing, fail loudly. If a third-party model or texture cannot be used, record the issue and require a fallback asset instead of blocking the learning goal or pretending import succeeded.
