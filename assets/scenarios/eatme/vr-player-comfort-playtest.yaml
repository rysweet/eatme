schema_version: eatme.scenario/v1
id: vr-player-comfort-playtest
title: VR Player Comfort Playtest
kind: alice_lesson_smoke
owner: eatme
resource_basis:
- name: Alice 3 Design Process Virtual Reality lesson
  url: https://www.alice.org/resources/lessons/design-process-virtual-reality/
  use: Use VR sickness, locomotion, object interaction, and common VR mechanic considerations as comfort and playtest grounding.
- name: Alice 3 Moving The Camera how-to
  url: https://www.alice.org/resources/how-tos/moving-the-camera/
  use: Use camera movement and one-shot viewpoints as non-VR fallback evidence.
purpose: Prove the VR/player comfort playtest scenario has a real Alice desktop launch gate and explicit VR availability evidence before agents judge comfort, discoverability, orientation, and fallback access.
launcher:
  command: alice run-howto
  scenario: vr-player-comfort-playtest
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
  - studio-facilitator
  - assessment-curator
  students:
  - vr-player-tester
  - accessibility-advocate
  - systems-puzzle-solver
capabilities:
  required:
  - rust-cli
  - java-21
  - maven
  - xvfb
  - xdpyinfo
  - wmctrl
  - screenshot-tool
  optional:
  - glxinfo
  - alice-player-vr
  - vr-headset
  - screen-recording
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
smoke_ready:
  evidence:
  - manifest_assertions
  - captured_logs
  - screenshot_or_window_evidence
  - scenario_id
  - vr_player_preflight_record
  - comfort_playtest_guidance_template
  - non_vr_fallback_evidence
acceptance_criteria:
- given: Alice launch smoke dependencies are available
  when: the vr-player-comfort-playtest scenario is launched through eatme
  then: the manifest identifies scenario_id vr-player-comfort-playtest
- given: real VR hardware is unavailable
  when: the playtest is evaluated outside-in
  then: evidence records real_vr_available=false plus desktop viewpoint, orientation, and fallback playtest guidance requirements
- given: a facilitator prepares a player interaction test
  when: guidance is generated before observation
  then: the guidance template asks for comfort signal, confusion point, discoverability cue, and one revision or justified non-change without claiming those observations already happened
- given: gadugi needs to exercise the scenario
  when: the generated adapter runs commands for this scenario
  then: gadugi invokes eatme CLI and inspects manifest-level evidence only
acceptance_probes:
- Guidance template prompts for comfort, orientation, discoverability, and fallback access.
- Follow-on creator evidence must link observed player feedback to a visible cue, rule, movement, or revision before any playtest claim is validated.
- The scenario never requires every learner to use VR hardware.
rubric:
- criterion: Player experience guidance
  evidence:
  - Template asks testers to record comfort, orientation, controls or cues, and confusion points.
  - Template requires observed feedback before tying a concrete visible revision or design decision to playtest evidence.
- criterion: Fallback integrity
  evidence:
  - Non-VR observers have a meaningful camera or screen-player path.
  - Claims distinguish real headset evidence from desktop fallback evidence.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes vr-player-comfort-playtest in the committed scenario set
- id: record-vr-player-preflight
  command: >-
    bash -lc 'set -e; run_dir="runs/vr-player-comfort-playtest/${RUN_ID}"; mkdir -p "$run_dir"; if [ "${EATME_REAL_VR:-0}" = "1" ] && [ "${VR_HEADSET_AVAILABLE:-0}" = "1" ]; then printf "%s\n" "real_vr_available=true" "required_evidence=headset-or-player-capture,comfort-notes,observer-log,revision-note" > "$run_dir/vr-player-preflight.txt"; else printf "%s\n" "real_vr_available=false" "required_evidence=desktop-camera-view,orientation-note,comfort-check,fallback-playtest-sheet" > "$run_dir/vr-player-preflight.txt"; fi; test -s "$run_dir/vr-player-preflight.txt"; grep -Eq "real_vr_available=(true|false)" "$run_dir/vr-player-preflight.txt"; printf "%s\n" "wrote=$run_dir/vr-player-preflight.txt"'
  evidence:
  - preflight file states whether real VR execution is available
  - if real_vr_available=false, required evidence names desktop viewpoint, orientation, comfort check, and fallback playtest sheet
  - if real_vr_available=true, required evidence names headset or player capture, comfort notes, observer log, and revision note
- id: record-comfort-playtest-guidance-template
  command: >-
    bash -lc 'set -e; run_dir="runs/vr-player-comfort-playtest/${RUN_ID}"; template="$run_dir/comfort-playtest-guidance-template.md"; mkdir -p "$run_dir"; printf "%s\n" "# Comfort playtest guidance template" "" "This is guidance only; it does not validate that a playtest observation has occurred." "" "- VR available: see vr-player-preflight.txt." "- Comfort check: record observed comfort, stop points, and motion concerns." "- Orientation note: record observed whether the player knows where to look and go." "- Player cue: record observed what helped or confused the player." "- Fallback path: record observed desktop camera or screen viewer notes when no headset is available." "- Revision decision: record the change made from observed feedback or why no change is needed." > "$template"; test -s "$template"; grep -q "guidance only" "$template"; grep -q "Revision decision" "$template"; printf "%s\n" "wrote=$template"'
  evidence:
  - comfort playtest guidance template file exists and is non-empty
  - template states it is guidance only and asks for observed comfort, orientation, player cue, fallback path, and revision decision
- id: launch-smoke
  command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home "${ALICE_HOME:?}" --run-id "${RUN_ID:?}" --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario vr-player-comfort-playtest
  evidence:
  - manifest scenario_id equals vr-player-comfort-playtest
  - manifest failure_category is null
  - manifest assertions include real_alice_execution_evidence passed=true
  - manifest assertions all pass
  - screenshot or window evidence exists and is non-empty
  - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#vr-player-comfort-playtest
  personality_assets:
  - studio-critique-card
  - debug-conference-card
  - creative-ownership-card
  deterministic_gate: Run this scenario and record VR availability before using the guidance template to collect observed comfort, orientation, player discoverability, or non-VR fallback evidence.
  required_observables:
  - VR availability record
  - comfort playtest guidance template
  - creator revision or justified non-change
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/vr-player-comfort-playtest/${RUN_ID}/manifest.json
  screenshot: runs/vr-player-comfort-playtest/${RUN_ID}/screenshots/startup.png
  log: runs/vr-player-comfort-playtest/${RUN_ID}/alice.log
  window_list: runs/vr-player-comfort-playtest/${RUN_ID}/window-list.txt
  vr_preflight: runs/vr-player-comfort-playtest/${RUN_ID}/vr-player-preflight.txt
  comfort_playtest_guidance_template: runs/vr-player-comfort-playtest/${RUN_ID}/comfort-playtest-guidance-template.md
unsupported_policy: If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit EATME_REAL_ALICE=1 gate are missing, fail loudly. If real VR hardware or Alice Player VR execution is unavailable, record real_vr_available=false and require observed desktop fallback playtest evidence before making playtest claims. The generated comfort file is guidance/template material only until a reviewer records non-placeholder observations. LookingGlass currently provides bounded /api/vr/camera-comfort evidence for browser camera comfort only; it must not be counted as true VR player comfort playtesting.
