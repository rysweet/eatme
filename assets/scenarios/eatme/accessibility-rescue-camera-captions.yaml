schema_version: eatme.scenario/v1
id: accessibility-rescue-camera-captions
title: "Accessibility Rescue \u2014 Camera and Captions"
kind: instructor_agentic_flow
owner: eatme
resource_basis:
- name: Alice.org Programming in Alice lesson family
  url: https://www.alice.org/resources/lessons/programming-in-alice/
  use: Use the camera, scene layout, and character animation concepts from this lesson family as the foundation for a lesson where students audit an Alice scene for accessibility gaps and rescue it by adjusting camera framing, adding text label captions to key dialogue or action moments, and noting where an audio cue could substitute for a visual-only signal.
- name: Alice.org Alice 3 lessons list
  url: https://www.alice.org/resources/alice-3-lessons
  use: 'Use the camera and scene topics from the Alice 3 lesson list to frame the rescue task: students review a starter scene, identify at least two accessibility gaps (for example a camera angle that hides important action, or spoken dialogue with no visible text), apply at least one camera fix and one caption fix, and record a brief explanation of what each fix improves for a viewer who cannot rely solely on sound or on fine visual detail.'
purpose: "Help an instructor design a short Alice lesson where students rescue an existing scene by adding accessibility features. Students audit a classmate-provided or instructor-supplied starter scene for at least two accessibility gaps \u2014 such as a camera angle that obscures key action, or dialogue that has no caption or text label \u2014 then apply a camera rescue (reframing or adding a second camera position) and a caption or text-label rescue (adding an on-screen label that conveys the essential message of a sound or spoken line). An optional extension asks students to identify where an audio cue could reinforce a visual event for viewers who cannot see the full screen. This scenario covers the accessibility-advocate, immersive-camera-director, and creative-storyteller student personas without claiming full user interface automation, automated creative assessment, learner-world grading, complete Alice coverage, or real Alice startup evidence."
personas:
  instructors:
  - studio-facilitator
  - assessment-curator
  students:
  - accessibility-advocate
  - immersive-camera-director
  - creative-storyteller
agentic_flow:
  focus: accessibility-rescue-camera-captions
  instructor_goal: 'Prepare an accessibility audit card, a camera rescue guide, and a caption and label template for an Alice accessibility rescue lesson: an audit card that prompts students to identify at least two accessibility gaps in a starter scene (camera framing gaps and caption or label gaps), a camera rescue guide that shows how to reframe or add a second camera position to make obscured action visible, a caption and label template that shows how to add an on-screen text label for a key sound or spoken line and what essential message the label should convey, and a reflection prompt asking what the rescue improved, who benefits most, and what still needs work. The optional extension shows how to identify a moment where an audio cue could reinforce a visual event without blocking learners who complete only the two-fix version.'
  prompt_source: assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml#agentic_test_prompt
  non_coder_editable:
  - resource_basis
  - purpose
  - agentic_test_prompt
  - acceptance_criteria
  - acceptance_probes
  - rubric
  - avoid
  expected_outputs:
  - accessibility_audit_card
  - camera_rescue_guide
  - caption_and_label_template
agentic_test_prompt: 'Act as an instructor acceptance agent preparing an accessibility rescue Alice lesson. Produce an accessibility audit card, a camera rescue guide, and a caption and label template grounded in the listed resources and this accessibility-rescue-camera-captions scenario. The accessibility audit card must prompt the student to review a starter scene and identify at least two accessibility gaps: at least one camera framing gap (such as an angle that hides key action from a viewer who cannot move closer) and at least one caption or label gap (such as spoken dialogue or an audio event with no visible text equivalent). The camera rescue guide must show one concrete example of reframing or adding a second camera position that makes obscured action visible, explain that any starter scene may replace the example, and state that the goal is to ensure a viewer who cannot rely on fine visual detail can follow the essential action. The caption and label template must prompt the student
  to add an on-screen text label for each identified caption gap, state what essential message the label conveys, and note that the label should match the pacing of the scene so it appears when the corresponding sound or action occurs. The reflection prompt must ask what each fix improved, which type of viewer benefits most from each fix, and what accessibility gap remains and why. Include a note that audio cues, high- contrast text, and simplified camera paths are all valid accessibility rescue strategies. Include an optional extension that shows how to identify a moment where an audio cue reinforces a visual event, and make clear that the extension does not block learners who complete only the two-fix version. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
acceptance_criteria:
- given: an instructor wants to teach camera framing and scene accessibility using a rescue-and-fix framing in Alice
  when: the accessibility audit card is prepared
  then: the card prompts identification of at least one camera framing gap and at least one caption or label gap, without requiring specific Alice assets or real personal data
- given: a student is auditing a starter scene for accessibility gaps
  when: the camera rescue guide is used
  then: the guide shows a concrete camera reframe or second-position example and explains who benefits from the fix before describing how to apply it
- given: an accessibility-advocate student or instructor is concerned about dialogue or audio events with no visible text
  when: applying the caption and label template
  then: the template prompts an on-screen text label for each caption gap, states the essential message to convey, and notes pacing so the label appears when the sound or action occurs
- given: an immersive-camera-director student wants to extend the rescue work
  when: the optional extension section is reached
  then: the extension identifies a moment where an audio cue reinforces a visual event without prescribing exact assets or blocking learners who skip it
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
- Accessibility audit card prompts identification of at least one camera framing gap.
- Accessibility audit card prompts identification of at least one caption or label gap.
- Camera rescue guide shows a concrete camera reframe or second-position example before the general framing.
- Caption and label template prompts an on-screen text label that states the essential message and pacing.
- Reflection prompt asks which viewer benefits most from each fix and what gap remains.
- Output notes that audio cues, high-contrast text, and simplified camera paths are valid accessibility rescue strategies.
- Optional audio cue extension is clearly optional and does not block learners who complete only the two-fix version.
- Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
rubric:
- criterion: Accessibility gap identification
  evidence:
  - Audit card distinguishes camera framing gaps from caption or label gaps.
  - Audit card requires at least one example of each gap type before the student proceeds.
- criterion: Camera rescue clarity
  evidence:
  - Camera rescue guide shows a concrete example before the general strategy.
  - Camera rescue guide names the viewer type who benefits from the fix.
- criterion: Caption and label completeness
  evidence:
  - Caption and label template prompts the essential message for each label, not only placement.
  - Template notes that label pacing should match the corresponding sound or action.
- criterion: Reflection on remaining gaps
  evidence:
  - Reflection prompt asks what accessibility gap remains and why, not only what was fixed.
  - Reflection prompt asks which viewer benefits most, connecting the fix to a real audience.
avoid:
- Requiring specific Alice asset models, named characters, or exact scene layouts.
- Skipping the camera rescue example before introducing the general strategy.
- Skipping the caption-gap identification step before the label template.
- Making the audio cue extension required rather than optional.
- Claims of full user interface automation, automated creative assessment, learner-world grading, or complete Alice coverage.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes accessibility-rescue-camera-captions
- id: agentic-instructor-review
  command: agentic instructor acceptance review using assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml
  evidence:
  - agent output addresses every acceptance_probe
  - agent output returns the expected_outputs listed in this YAML
timeouts:
  agentic_seconds: 900
artifacts:
  accessibility_audit_card: agentic://instructor/accessibility-audit-card
  camera_rescue_guide: agentic://instructor/camera-rescue-guide
  caption_and_label_template: agentic://student/caption-and-label-template
unsupported_policy: If the agent cannot read this editable YAML, the persona crew asset, or the cited Alice-facing resources, fail visibly and report the missing evidence. Do not replace instructor judgment with launch, screenshot, or export-preflight artifacts. Do not claim full user interface automation, automated creative assessment, learner-world grading, or complete Alice coverage.
adapter:
  targets:
  - lookingglass
