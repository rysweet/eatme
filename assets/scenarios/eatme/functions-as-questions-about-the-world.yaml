schema_version: eatme.scenario/v1
id: functions-as-questions-about-the-world
title: Functions as Questions About the World
kind: alice_lesson_smoke
owner: eatme
resource_basis:
  - name: Alice.org Alice 3 lessons list
    url: https://www.alice.org/resources/alice-3-lessons
  - name: Alice.org Alice 3 resource categories
    url: https://www.alice.org/resources/alice-3/
purpose: >-
  Prove that the functions lesson lane launches through the real Alice desktop harness before instructor/student agents judge state-question and decision evidence.
launcher:
  command: alice launch-smoke
  scenario: functions-as-questions-about-the-world
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors: [concept-cartographer, debug-coach]
  students: [curious-novice, systems-puzzle-solver]
capabilities:
  required:
    - rust-cli
    - java-21
    - maven
    - xvfb
    - xdpyinfo
    - wmctrl
    - screenshot-tool
  optional:
    - glxinfo
adapter:
  targets:
    - eatme-cli
    - gadugi-cli
smoke_ready:
  evidence:
    - manifest_assertions
    - captured_logs
    - screenshot_or_window_evidence
    - scenario_id
acceptance_criteria:
  - given: Alice launch smoke dependencies are available
    when: the functions-as-questions-about-the-world scenario is launched through eatme
    then: the manifest identifies scenario_id functions-as-questions-about-the-world
  - given: the real Alice fork starts under the existing Xvfb launch-smoke path
    when: instructor/student agents use this Alice.org-grounded lesson contract
    then: agentic judgment is gated on deterministic manifest evidence before lesson reasoning
  - given: gadugi needs to exercise the lane
    when: the gadugi adapter runs commands for this scenario
    then: gadugi invokes eatme CLI and inspects manifest-level evidence only
steps:
  - id: validate-assets
    command: cargo run -q -p eatme-cli -- assets validate --json
    evidence:
      - stdout JSON has passed=true
      - stdout JSON includes this scenario asset
  - id: check-dependencies
    command: cargo run -q -p eatme-cli -- deps check --json
    evidence:
      - stdout JSON has all_required_available=true
  - id: launch-smoke
    command: >-
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke
      --alice-home ${ALICE_HOME}
      --run-id ${RUN_ID}
      --runs-dir runs
      --timeout 900
      --json
      --no-memory
      --offline-package
      --scenario functions-as-questions-about-the-world
    evidence:
      - manifest scenario_id equals functions-as-questions-about-the-world
      - manifest failure_category is null
      - manifest assertions all pass
      - manifest assertions include real_alice_execution_evidence passed=true
      - screenshot or window evidence exists and is non-empty
      - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#functions-as-questions-about-the-world
  personality_assets:
    - socratic-scaffold-card
    - prediction-observation-reflection-card
  deterministic_gate: >-
    Run this smoke lane before asking instructor/student agents to judge whether
    a learner demonstrated functions, return values, and visible decisions through two world states producing different visible outcomes.
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/functions-as-questions-about-the-world/${RUN_ID}/manifest.json
  screenshot: runs/functions-as-questions-about-the-world/${RUN_ID}/screenshots/startup.png
  log: runs/functions-as-questions-about-the-world/${RUN_ID}/alice.log
  window_list: runs/functions-as-questions-about-the-world/${RUN_ID}/window-list.txt
unsupported_policy: >-
  If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit
  EATME_REAL_ALICE=1 gate are missing, fail loudly. Do not silently skip or
  substitute a mocked Alice runtime.
