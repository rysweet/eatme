schema_version: eatme.scenario/v1
id: arrays-collection-choreography
title: Arrays Collection Choreography
kind: alice_lesson_smoke
owner: eatme
resource_basis:
  - name: Alice.org Alice 3 lessons
    url: https://www.alice.org/resources/alice-3-lessons/
  - name: Alice.org Alice 3 resources
    url: https://www.alice.org/resources/alice-3/
purpose: >-
  Prove the arrays and collection choreography student flow launches through the real Alice smoke harness before agentic evaluation judges collection reasoning.
launcher:
  command: alice launch-smoke
  scenario: arrays-collection-choreography
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
    - concept-cartographer
    - exercise-forger
  students:
    - data-detective
    - playful-tinkerer
    - systems-puzzle-solver
capabilities:
  required:
    - rust-cli
    - java-21
    - maven
    - xvfb
    - xdpyinfo
    - wmctrl
    - screenshot-tool
  optional:
    - glxinfo
adapter:
  targets:
    - eatme-cli
    - gadugi-cli
smoke_ready:
  evidence:
    - manifest_assertions
    - captured_logs
    - screenshot_or_window_evidence
    - scenario_id
acceptance_criteria:
  - given: Alice launch smoke dependencies are available
    when: the arrays-collection-choreography scenario is launched through eatme
    then: the manifest identifies scenario_id arrays-collection-choreography
  - given: students need collection evidence
    when: agentic follow-on evaluates this scenario
    then: it judges visible list/array behavior, item order, and boundary tests rather than exact syntax
  - given: gadugi needs to exercise the scenario
    when: the gadugi adapter runs commands for this scenario
    then: gadugi invokes eatme CLI and inspects manifest-level evidence only
steps:
  - id: validate-assets
    command: cargo run -q -p eatme-cli -- assets validate --json
    evidence:
      - stdout JSON has passed=true
      - stdout JSON includes this scenario asset
  - id: check-dependencies
    command: cargo run -q -p eatme-cli -- deps check --json
    evidence:
      - stdout JSON has all_required_available=true
  - id: launch-smoke
    command: >-
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke
      --alice-home ${ALICE_HOME}
      --run-id ${RUN_ID}
      --runs-dir runs
      --timeout 900
      --json
      --no-memory
      --offline-package
      --scenario arrays-collection-choreography
    evidence:
      - manifest scenario_id equals arrays-collection-choreography
      - manifest failure_category is null
      - manifest assertions include real_alice_execution_evidence passed=true
      - manifest assertions all pass
      - screenshot or window evidence exists and is non-empty
      - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#arrays-collection-choreography
  deterministic_gate: >-
    Run this smoke scenario before asking agents to assess whether a learner made arrays, list items, and indexes visible in a collection-based world.
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/arrays-collection-choreography/${RUN_ID}/manifest.json
  screenshot: runs/arrays-collection-choreography/${RUN_ID}/screenshots/startup.png
  log: runs/arrays-collection-choreography/${RUN_ID}/alice.log
  window_list: runs/arrays-collection-choreography/${RUN_ID}/window-list.txt
unsupported_policy: >-
  If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit
  EATME_REAL_ALICE=1 gate are missing, fail loudly. Do not silently skip or
  substitute a mocked Alice runtime.
