schema_version: eatme.scenario/v1
id: workshop-facilitator-live-studio
title: Workshop Facilitator Live Studio
kind: instructor_agentic_flow
owner: eatme
resource_basis:
- name: Alice.org Hour of Code lesson
  url: https://www.alice.org/resources/lessons/hour-of-code/
  use: Use the short-session pattern for a first scene, first animation, visible evidence, and reflection.
- name: Alice.org Alice 3 resource categories
  url: https://www.alice.org/resources/alice-3/
  use: Use lessons, exercises, projects, how-tos, and shareable resources as workshop source material.
purpose: Prepare a short live-studio classroom flow where instructors can set up the room, pace participation, observe student progress, intervene without taking over, and gather reviewable workshop evidence. Students use prompt cards, student-owned Alice action evidence, help signals, peer feedback, revision behavior, reflection, and share-out artifacts to show participation within a limited session. A minimum action note asks each student pair to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice. This non-coder-editable scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
personas:
  instructors:
  - workshop-facilitator
  - studio-facilitator
  students:
  - creative-storyteller
  - collaborative-peer-mentor
  - reflective-debugger
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
agentic_flow:
  focus: facilitating-live-studio-workshops
  instructor_goal: Prepare a two-hour Alice live-studio workshop plan with a setup checklist, timing plan, observation points, intervention cues, checkpoint artifacts, share-out support, instructor-facing acceptance probes, student prompt cards, student-owned Alice action evidence, help signals, peer feedback, revision behavior, reflection, and share-out artifacts.
  prompt_source: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml#agentic_test_prompt
  non_coder_editable:
  - resource_basis
  - purpose
  - agentic_test_prompt
  - acceptance_criteria
  - acceptance_probes
  - rubric
  - avoid
  expected_outputs:
  - facilitation_plan
  - timing_plan
  - observation_intervention_guide
  - participant_checkpoint_board
  - student_prompt_cards
  - help_signal_board
  - peer_feedback_notes
  - revision_reflection_log
  - share_out_artifacts
  - real_alice_action_evidence_notes
  - instructor_acceptance_probe_notes
  - showcase_notes
agentic_test_prompt: Act as an instructor acceptance agent preparing an Alice live-studio workshop. Produce a two-hour facilitation plan, timing plan, observation-intervention guide, participant checkpoint board, student prompt cards, help signal board, peer feedback notes, revision-reflection log, share-out artifacts, real Alice action evidence notes, instructor acceptance probe notes, and showcase notes grounded in the listed resources and this workshop-facilitator-live-studio scenario. Include a setup checklist, observation points, intervention cues, checkpoint artifacts, share-out support, instructor-facing acceptance probes, help signals, peer feedback, revision behavior, reflection, student-facing prompt cards, and student-owned Alice action evidence that asks students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice. Keep language editable and workshop-facing. State explicitly that the scenario is not full Alice user interface
  automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
acceptance_criteria:
- given: participants arrive with mixed Alice experience, devices, and goals
  when: the agent prepares the live-studio workshop plan
  then: the output separates the setup checklist, timing plan, build checkpoints, helper roles, observation points, help signals, intervention cues, and share-out support
- given: setup or pacing goes sideways during the workshop
  when: the facilitator uses the recovery moves
  then: participants still have a productive way to use student prompt cards, request help, add or adjust one visible behavior in Alice, run it, record the observed result, exchange peer feedback, revise one small choice, reflect, or prepare share-out artifacts
- given: participants share their Alice artifacts
  when: the instructor-facing acceptance probes are applied to the plan, board, prompt cards, and notes
  then: the evidence checks visible participant progress, checkpoint artifacts, student-owned Alice action evidence, revision behavior, reflection, and share-out artifacts while stating the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage
acceptance_probes:
- Facilitation plan has a setup checklist, timing plan, make/run/revise checkpoints, helper roles, and share-out support.
- Observation-intervention guide names observation points, intervention cues, stuck patterns, and recovery moves for setup or pacing issues.
- Participant checkpoint board names checkpoint artifacts, help signals, optional extension choices, and student share-out artifacts.
- Student prompt cards ask for one visible behavior, one help signal, one peer feedback exchange, one revision behavior, and one reflection.
- Real Alice action evidence notes ask students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice.
- Instructor-facing acceptance probes check the facilitation plan, student prompt cards, checkpoint board, revision-reflection log, and showcase notes.
- Output explicitly connects workshop-facilitator and student personas to reviewable scenario evidence without taking ownership of learner artifacts.
- Output states the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
rubric:
- criterion: Workshop readiness
  evidence:
  - Facilitation plan states setup checklist items, timing plan checkpoints, helper roles, and fallback participation choices.
  - The plan can be edited as YAML without changing Rust or launcher code.
  - Instructor-facing acceptance probes are written for classroom facilitation evidence rather than desktop automation.
- criterion: Participant progress
  evidence:
  - Student prompt cards ask for one visible Alice behavior before optional extensions.
  - Real Alice action evidence notes record one student-owned Alice action, observed run result, and small revision.
  - Help signals, peer feedback, and intervention cues keep learners in control of their artifacts.
  - Participant checkpoint board records checkpoint artifacts, revision behavior, and reflection before the showcase.
- criterion: Evidence boundary
  evidence:
  - Review checks checkpoint artifacts, revision-reflection log entries, help signal notes, peer feedback notes, and share-out artifacts.
  - The scenario states it is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
avoid:
- Exact user interface coordinates, menu paths, or private implementation details.
- Presenter-only demos where participants do not build, run, revise, or share.
- Making final polish the only success signal.
- Full Alice user interface automation, creative assessment, learner-world grading, or complete Alice coverage claims.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes workshop-facilitator-live-studio
- id: agentic-instructor-review
  command: agentic instructor acceptance review using assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
  evidence:
  - agent output addresses every acceptance_probe
  - agent output returns the expected_outputs listed in this YAML
timeouts:
  agentic_seconds: 900
artifacts:
  facilitation_plan: agentic://instructor/facilitation-plan
  timing_plan: agentic://instructor/timing-plan
  observation_intervention_guide: agentic://instructor/observation-intervention-guide
  participant_checkpoint_board: agentic://instructor/participant-checkpoint-board
  student_prompt_cards: agentic://student/prompt-cards
  help_signal_board: agentic://student/help-signal-board
  peer_feedback_notes: agentic://student/peer-feedback-notes
  revision_reflection_log: agentic://student/revision-reflection-log
  share_out_artifacts: agentic://student/share-out-artifacts
  real_alice_action_evidence_notes: agentic://student/real-alice-action-evidence-notes
  instructor_acceptance_probe_notes: agentic://instructor/acceptance-probe-notes
  showcase_notes: agentic://instructor/showcase-notes
unsupported_policy: If the agent cannot read this editable YAML, the persona crew asset, or the cited Alice.org resource basis, fail visibly and report the missing evidence. Do not replace instructor judgment with brittle user interface assertions. Do not claim this scenario is full Alice user interface automation, creative assessment, learner-world grading, or complete Alice coverage.
