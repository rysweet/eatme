schema_version: eatme.scenario/v1
id: first-lessons-real-ui-actions
title: First Lessons Real UI Actions Contract
kind: alice_real_ui_action_contract
owner: eatme
resource_basis:
  - name: Alice 3 desktop first lessons
    url: https://www.alice.org/resources/alice-3-lessons/
  - name: Alice 3 starter project flow
    url: https://www.alice.org/get-alice/alice-3/
purpose: >-
  Move the first Alice lesson checks beyond manifest-only smoke by launching the
  real Alice desktop for original Alice and RabbitHole / modernized Alice,
  verifying a specific Alice window, executing safe window
  activation plus save-shortcut dispatch probes, consuming object-placement proof
  when Alice exposes it, consuming edit proof when Alice exposes it, and
  dispatching Alice's documented Run shortcut after edit proof exists. The
  contract still requires explicit evidence for object placement,
  procedure/code editing, world run, project save, and a captured contract
  artifact. Until deterministic desktop manipulation beyond safe window
  activation, shortcut dispatch, and backend proof hooks is wired,
  the harness must fail loudly with a preflight/action contract instead of
  reporting a silent pass.
  This instructor-editable asset records reusable preflight launch/action-contract
  readiness evidence only for setup, launch support, handoff artifacts, and
  classroom support preparation. It is not full UI automation, not creative
  assessment, not learner-world grading, not production readiness, not lesson
  completion, not complete end-to-end lesson execution, and not broad Alice
  compatibility.
launcher:
  command: alice launch-smoke
  scenario: first-lessons-real-ui-actions
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
    - concept-cartographer
    - debug-coach
  students:
    - curious-novice
    - creative-storyteller
capabilities:
  required:
    - rust-cli
    - java-21
    - maven
    - xvfb
    - xdpyinfo
    - wmctrl
    - xwininfo
    - xdotool
    - screenshot-tool
  optional:
    - glxinfo
adapter:
  targets:
    - eatme-cli
    - gadugi-cli
smoke_ready:
  evidence:
    - manifest_assertions
    - scenario_labeled_real_alice_launch_path
    - manifest_log_window_and_startup_screenshot_evidence
    - specific_alice_window_detected
    - activate_alice_window_ui_action
    - save_project_desktop_shortcut_dispatch
    - run_world_desktop_shortcut_dispatch
    - run_world_desktop_window_observed
    - place_object_precondition_no_go_probe
    - edit_procedure_precondition_no_go_probe
    - run_world_precondition_no_go_probe
    - ui_action_contract_artifact
    - action_contract_expectations_for_place_edit_run_and_save
    - explicit_failure_when_ui_actions_are_not_automated
acceptance_criteria:
  - given: Alice launch smoke dependencies are available
    when: the first-lessons-real-ui-actions scenario is launched through eatme
    then: the manifest identifies scenario_id first-lessons-real-ui-actions
  - given: Alice reaches a desktop session under Xvfb
    when: the harness inspects window evidence from wmctrl or xwininfo
    then: manifest assertions include specific_alice_window_detected passed=true for an Alice Stage IDE window
  - given: a specific Alice window id is present in wmctrl or xwininfo output
    when: the harness runs the first safe UI action probe
    then: manifest assertions include activate_alice_window_ui_action passed=true for wmctrl or xdotool focus against that window id
  - given: Alice window activation succeeds
    when: the harness dispatches Ctrl+S to the detected Alice window with xdotool
    then: manifest assertions include save_project_desktop_shortcut_dispatch passed=true while treating it as input dispatch only, not saved project proof
  - given: Alice window activation succeeds but no stable object placement affordance exists
    when: the harness reaches the next first-lesson action boundary
    then: manifest assertions include place_object_precondition_no_go_probe and ui-action-contract.json records a no_go decision for place-object with missing_affordance.id deterministic-alice-object-gallery-placement-affordance
  - given: object placement proof exists but no stable procedure/code editing affordance exists
    when: the harness reaches the edit procedure/code-block boundary
    then: manifest assertions include edit_procedure_precondition_no_go_probe and ui-action-contract.json records a no_go decision for edit-procedure-or-code-block with missing_affordance.id deterministic-alice-procedure-edit-affordance
  - given: procedure/code editing proof exists but no stable world-run affordance exists
    when: the harness reaches the world-run boundary
    then: manifest assertions include run_world_precondition_no_go_probe and ui-action-contract.json records a no_go decision for run-world with missing_affordance.id deterministic-alice-world-run-affordance
  - given: procedure/code editing proof exists and Alice window activation succeeded
    when: the harness dispatches the documented Run shortcut Ctrl+F5 to the detected Alice window with xdotool
    then: manifest assertions include run_world_desktop_shortcut_dispatch passed=true while treating it as input dispatch only, not world execution proof
  - given: documented Run shortcut dispatch succeeds
    when: the harness inspects windows after Ctrl+F5
    then: manifest assertions include run_world_desktop_window_observed, passing only when an Alice Run window is visible and otherwise recording the observed blocker
  - given: deterministic Alice desktop manipulation is not fully wired yet
    when: add/place object, edit procedure/code block, run world, or save project evidence cannot be produced
    then: the manifest fails loudly with ui_action_automation_unimplemented when object placement is missing, or ui_action_remaining_steps_unimplemented after object placement proof exists, and writes ui-action-contract.json
  - given: reviewers use this scenario as first-lesson evidence
    when: they inspect the manifest, Alice log, window list, startup screenshot, and ui-action-contract.json
    then: they treat the result as bounded original Alice versus RabbitHole / modernized Alice setup, launch, handoff, and classroom-support readiness evidence only, not full UI automation, not creative assessment, not learner-world grading, not complete end-to-end lesson execution, and not broad Alice compatibility
steps:
  - id: validate-assets
    command: cargo run -q -p eatme-cli -- assets validate --json
    evidence:
      - stdout JSON has passed=true
      - stdout JSON includes this scenario asset
  - id: check-dependencies
    command: cargo run -q -p eatme-cli -- deps check --json
    evidence:
      - stdout JSON has all_required_available=true
  - id: launch-real-ui-action-contract
    command: >-
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke
      --alice-home ${ALICE_HOME}
      --run-id ${RUN_ID}
      --runs-dir runs
      --timeout 900
      --json
      --no-memory
      --offline-package
      --scenario first-lessons-real-ui-actions
    evidence:
      - manifest scenario_id equals first-lessons-real-ui-actions
      - manifest log, window-list, and startup screenshot artifacts identify the real Alice launch path
      - manifest assertions.real_alice_execution_evidence is present
      - manifest assertions include specific_alice_window_detected
      - manifest assertions include activate_alice_window_ui_action
      - manifest assertions include save_project_desktop_shortcut_dispatch as input dispatch evidence only
      - manifest assertions include run_world_desktop_shortcut_dispatch as input dispatch evidence only when procedure edit proof exists
      - manifest assertions include run_world_desktop_window_observed as Run-window evidence or an explicit observed blocker
      - manifest assertions include place_object_precondition_no_go_probe
      - manifest assertions include edit_procedure_precondition_no_go_probe when object placement proof exists
      - manifest assertions include run_world_precondition_no_go_probe when procedure edit proof exists
      - manifest assertions include place_object_ui_action
      - manifest assertions include edit_procedure_ui_action
      - manifest assertions include run_world_ui_action
      - manifest assertions include save_project_ui_action
      - manifest assertions include ui_action_artifact_captured
      - manifest failure_category is a UI action blocker until actions are automated
      - ui-action-contract.json exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#building-a-scene-first-world
  deterministic_gate: >-
    Do not claim object placement, procedure editing, world run, or save coverage
    unless this scenario produces passing action assertions and a saved artifact.
    This is bounded readiness evidence for comparing original Alice against
    RabbitHole / modernized Alice on setup, launch, handoff, and classroom
    support preparation only. It is not full UI automation, not creative
    assessment, not learner-world grading, not complete end-to-end lesson
    execution, and not broad Alice compatibility.
  required_observables:
    - scenario-labeled real Alice launch path identifies first-lessons-real-ui-actions
    - manifest, Alice log, window list, and startup screenshot evidence are present
    - Alice window detection is explicit
    - ui-action-contract.json records the Alice window activation probe, records the save shortcut and Run shortcut dispatch probes as input dispatch evidence only when their preconditions pass, records Run-window observation when available, records the relevant no_go precondition probe for place object, edit procedure, or run world, names the missing affordance id, and names place object, edit procedure, run world, and save project expectations
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/first-lessons-real-ui-actions/${RUN_ID}/manifest.json
  screenshot: runs/first-lessons-real-ui-actions/${RUN_ID}/screenshots/startup.png
  log: runs/first-lessons-real-ui-actions/${RUN_ID}/alice.log
  window_list: runs/first-lessons-real-ui-actions/${RUN_ID}/window-list.txt
  ui_action_contract: runs/first-lessons-real-ui-actions/${RUN_ID}/ui-action-contract.json
unsupported_policy: >-
  If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit
  EATME_REAL_ALICE=1 gate are missing, fail loudly. If Alice launches but real
  actions are not automated, fail with ui_action_automation_unimplemented or
  ui_action_remaining_steps_unimplemented and capture ui-action-contract.json rather than silently passing. This is
  bounded setup, launch, handoff, and classroom-support readiness evidence only.
  It is not full UI automation, not creative assessment, not learner-world
  grading, not complete end-to-end lesson execution, and not broad Alice
  compatibility.
