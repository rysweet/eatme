schema_version: eatme.scenario/v1
id: code-editor-first-run
title: Code Editor First Run
kind: alice_lesson_smoke
owner: eatme
resource_basis:
- name: Alice.org Programming in Alice lesson family
  url: https://www.alice.org/resources/lessons/programming-in-alice/
- name: Alice.org Alice 3 lessons
  url: https://www.alice.org/resources/alice-3-lessons/
purpose: Prove that the first code-editing lesson scenario launches through the same real Alice desktop harness as the baseline smoke, then records deterministic manifest evidence before any agentic judgment evaluates procedure learning.
launcher:
  command: alice run-howto
  scenario: code-editor-first-run
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
  - concept-cartographer
  - debug-coach
  students:
  - curious-novice
  - reflective-debugger
capabilities:
  required:
  - rust-cli
  - java-21
  - maven
  - xvfb
  - xdpyinfo
  - wmctrl
  - screenshot-tool
  optional:
  - glxinfo
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
smoke_ready:
  evidence:
  - manifest_assertions
  - captured_logs
  - screenshot_or_window_evidence
  - scenario_id
acceptance_criteria:
- given: Alice launch smoke dependencies are available
  when: the code-editor-first-run scenario is launched through eatme
  then: the manifest identifies scenario_id code-editor-first-run
- given: the harness captures deterministic desktop evidence
  when: Alice starts under Xvfb for the first code-editing scenario
  then: the manifest records passing assertions plus screenshot or window evidence and log artifacts
- given: gadugi needs to exercise the scenario
  when: the gadugi adapter runs commands for this scenario
  then: gadugi invokes eatme CLI and inspects manifest-level evidence only
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes this scenario asset
- id: check-dependencies
  command: cargo run -q -p eatme-cli -- deps check --json
  evidence:
  - stdout JSON has all_required_available=true
- id: launch-smoke
  command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home "${ALICE_HOME:?}" --run-id "${RUN_ID:?}" --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario code-editor-first-run
  evidence:
  - manifest scenario_id equals code-editor-first-run
  - manifest failure_category is null
  - manifest assertions all pass
  - manifest assertions include real_alice_execution_evidence passed=true
  - screenshot or window evidence exists and is non-empty
  - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#code-editor-first-run
  deterministic_gate: Run this scenario before asking instructor/student agents to judge whether a learner connected code statements to visible Alice behavior.
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/code-editor-first-run/${RUN_ID}/manifest.json
  screenshot: runs/code-editor-first-run/${RUN_ID}/screenshots/startup.png
  log: runs/code-editor-first-run/${RUN_ID}/alice.log
  window_list: runs/code-editor-first-run/${RUN_ID}/window-list.txt
unsupported_policy: If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit EATME_REAL_ALICE=1 gate are missing, fail loudly. Do not silently skip or substitute a mocked Alice runtime.
