schema_version: eatme.scenario/v1
id: neighborhood-data-story
title: Neighborhood Data Story
kind: instructor_agentic_flow
owner: eatme
resource_basis:
- name: Alice.org Programming in Alice lesson family
  url: https://www.alice.org/resources/lessons/programming-in-alice/
  use: Use the variables, data types, and functions concepts from this lesson family as the coding backbone for a data story where objects in the scene change position, scale, or behavior based on stored values, showing students how a variable holds a meaningful number that drives visible world behavior.
- name: Alice.org Alice 3 lessons list
  url: https://www.alice.org/resources/alice-3-lessons
  use: Use the data and arrays topic from the Alice 3 lesson list to frame a neighborhood story in which at least two fictional data values (such as number of trees, park visit counts, or noise level) are mapped to visible changes in the scene, and an optional extension uses a small list or array to represent the same data for multiple neighborhood locations.
purpose: Help an instructor design a short Alice lesson where students build a neighborhood data story using fictional, classroom-safe data. Students choose at least two data values that represent something about a made-up neighborhood (such as number of trees on a block, park visit counts, or building heights), map each value to a visible change in the scene (such as object scale, position, color, or movement speed), write an explanation of what each mapping means and what it cannot prove, and record a reflection on interpretation limits. An optional extension asks students to use a small list or array to represent the same data value across multiple neighborhood locations. This scenario covers the accessibility-advocate, creative-storyteller, and systems-puzzle-solver student personas without claiming full user interface automation, automated creative assessment, learner-world grading, complete Alice coverage, or real Alice startup evidence.
personas:
  instructors:
  - assessment-curator
  - studio-facilitator
  students:
  - accessibility-advocate
  - creative-storyteller
  - systems-puzzle-solver
agentic_flow:
  focus: neighborhood-data-story
  instructor_goal: 'Prepare a lesson brief, a student data-mapping card, and a representation-limits reflection prompt for an Alice neighborhood data story lesson: a motivating framing that shows how a stored variable value drives a visible scene change, a data-mapping frame where the student assigns at least two fictional values to visible properties and labels what each mapping communicates, a privacy-safe data brief specifying that only fictional or classroom-approved data may be used, and a reflection prompt asking what the representation shows, what it hides, and what a viewer could misread. The optional extension shows how to use a small list or array to hold the same data value for multiple locations without blocking learners who complete only the two-value version.'
  prompt_source: assets/scenarios/eatme/neighborhood-data-story.yaml#agentic_test_prompt
  non_coder_editable:
  - resource_basis
  - purpose
  - agentic_test_prompt
  - acceptance_criteria
  - acceptance_probes
  - rubric
  - avoid
  expected_outputs:
  - lesson_brief
  - student_data_mapping_card
  - representation_limits_reflection
agentic_test_prompt: 'Act as an instructor acceptance agent preparing a neighborhood data story Alice lesson. Produce a lesson brief, student data-mapping card, and representation-limits reflection prompt grounded in the listed resources and this neighborhood-data-story scenario. The lesson brief must show a short motivating example of a variable value driving a visible scene change (such as a tree count variable controlling how many trees appear in a scene), explain that any fictional or classroom-approved data can replace the example, and state the privacy-safe constraint that sensitive real personal data must not be used. The student data-mapping card must prompt the student to: name at least two fictional data values about a made-up neighborhood, choose a visible scene property for each value (such as scale, position, or movement speed), label what each mapping communicates to a viewer, and write a sentence explaining one thing the representation cannot prove. The representation-limits
  reflection prompt must ask what a viewer might misread, why that misreading could happen, and how the design could be revised to reduce it. Include a note that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices. Include an optional extension that shows how a small list or array can hold the same data value for multiple neighborhood locations, and make clear that the extension does not block learners who complete only the two-value version. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
acceptance_criteria:
- given: an instructor wants to teach variables, data types, and representation using a neighborhood storytelling framing in Alice
  when: the lesson brief is prepared
  then: the brief shows a motivating variable-to-scene-change example, states the privacy-safe constraint, and does not require specific Alice assets or real personal data
- given: a student is building a neighborhood data story world
  when: the student data-mapping card is used
  then: the card prompts the student to name at least two fictional data values, map each to a visible scene property, label what each mapping communicates, and write an interpretation-limits sentence before finishing
- given: an accessibility-advocate student or instructor is concerned about data representation clarity
  when: reviewing the data-mapping card
  then: the card notes that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices
- given: a systems-puzzle-solver or creative-storyteller student wants to extend the data story
  when: the optional extension section is reached
  then: the extension suggests using a small list or array for multiple locations without prescribing exact assets or blocking learners who skip the extension
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
- Lesson brief shows a motivating variable-to-scene-change example before introducing the data-mapping card.
- Student data-mapping card prompts at least two fictional data values mapped to visible scene properties.
- Student data-mapping card prompts a written interpretation-limits sentence for each mapping.
- Representation-limits reflection prompt asks what a viewer might misread and how to revise the design.
- Output notes that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices.
- Optional array or list extension is clearly optional and does not block learners who complete only the two-value version.
- Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
rubric:
- criterion: Data-to-world mapping clarity
  evidence:
  - Lesson brief shows a concrete variable-to-scene-change example before the general framing.
  - Student data-mapping card labels what each mapping communicates, not only how to set a value.
- criterion: Interpretation limits reflection
  evidence:
  - Student data-mapping card includes an interpretation-limits sentence for each mapped value.
  - Representation-limits reflection prompt asks specifically what a viewer could misread and why.
- criterion: Privacy-safe data constraint
  evidence:
  - Lesson brief states that only fictional or classroom-approved data may be used.
  - Student data-mapping card does not require or encourage the use of real personal data.
- criterion: Accessibility awareness
  evidence:
  - Data-mapping card notes text labels, audio narration, or reduced-complexity layouts as valid choices.
  - Accessibility choices are described as equivalents, not as fallbacks for broken designs.
avoid:
- Requiring exact neighborhood names, real personal data, or specific Alice asset models.
- Skipping the variable-to-scene-change motivating example before the data-mapping card.
- Skipping the interpretation-limits reflection or treating representation as purely technical.
- Making the array or list extension required rather than optional.
- Claims of full user interface automation, automated creative assessment, learner-world grading, or complete Alice coverage.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes neighborhood-data-story
- id: agentic-instructor-review
  command: agentic instructor acceptance review using assets/scenarios/eatme/neighborhood-data-story.yaml
  evidence:
  - agent output addresses every acceptance_probe
  - agent output returns the expected_outputs listed in this YAML
timeouts:
  agentic_seconds: 900
artifacts:
  lesson_brief: agentic://instructor/lesson-brief
  student_data_mapping_card: agentic://student/data-mapping-card
  representation_limits_reflection: agentic://instructor/representation-limits-reflection
unsupported_policy: If the agent cannot read this editable YAML, the persona crew asset, or the cited Alice-facing resources, fail visibly and report the missing evidence. Do not replace instructor judgment with launch, screenshot, or export-preflight artifacts. Do not claim full user interface automation, automated creative assessment, learner-world grading, or complete Alice coverage.
adapter:
  targets:
  - lookingglass
