schema_version: eatme.scenario/v1
id: loops-and-conditionals-mini-challenge
title: Loops and Conditionals Mini Challenge
kind: alice_lesson_smoke
owner: eatme
resource_basis:
- name: Alice.org Alice 3 lessons list
  url: https://www.alice.org/resources/alice-3-lessons
- name: Alice.org Alice 3 resource categories
  url: https://www.alice.org/resources/alice-3/
purpose: Prove that the loops-and-conditionals lesson scenario launches through the real Alice desktop harness before instructor/student agents judge rule-based behavior.
launcher:
  command: alice run-howto
  scenario: loops-and-conditionals-mini-challenge
real_alice:
  gated_by: EATME_REAL_ALICE=1
personas:
  instructors:
  - exercise-forger
  - debug-coach
  students:
  - playful-tinkerer
  - systems-puzzle-solver
capabilities:
  required:
  - rust-cli
  - java-21
  - maven
  - xvfb
  - xdpyinfo
  - wmctrl
  - screenshot-tool
  optional:
  - glxinfo
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
smoke_ready:
  evidence:
  - manifest_assertions
  - captured_logs
  - screenshot_or_window_evidence
  - scenario_id
acceptance_criteria:
- given: Alice launch smoke dependencies are available
  when: the loops-and-conditionals-mini-challenge scenario is launched through eatme
  then: the manifest identifies scenario_id loops-and-conditionals-mini-challenge
- given: the real Alice fork starts under the existing Xvfb launch-smoke path
  when: instructor/student agents use this Alice.org-grounded lesson contract
  then: agentic judgment is gated on deterministic manifest evidence before lesson reasoning
- given: gadugi needs to exercise the scenario
  when: the gadugi adapter runs commands for this scenario
  then: gadugi invokes eatme CLI and inspects manifest-level evidence only
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes this scenario asset
- id: check-dependencies
  command: cargo run -q -p eatme-cli -- deps check --json
  evidence:
  - stdout JSON has all_required_available=true
- id: launch-smoke
  command: EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home "${ALICE_HOME:?}" --run-id "${RUN_ID:?}" --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario loops-and-conditionals-mini-challenge
  evidence:
  - manifest scenario_id equals loops-and-conditionals-mini-challenge
  - manifest failure_category is null
  - manifest assertions all pass
  - manifest assertions include real_alice_execution_evidence passed=true
  - screenshot or window evidence exists and is non-empty
  - log exists and is non-empty
agentic_follow_on:
  prompt_source: assets/personas/alice-user-crew.yaml#loops-and-conditionals-mini-challenge
  personality_assets:
  - socratic-scaffold-card
  - prediction-observation-reflection-card
  deterministic_gate: Run this scenario before asking instructor/student agents to judge whether a learner demonstrated loops, conditionals, and testable rules through repetition plus a visible branch based on a rule.
acceptance_probes:
- LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
- Expected visible result, behavior result, saved artifact, or review evidence is present after the Alice user steps run.
timeouts:
  scenario_seconds: 1800
  launch_seconds: 900
artifacts:
  manifest: runs/loops-and-conditionals-mini-challenge/${RUN_ID}/manifest.json
  screenshot: runs/loops-and-conditionals-mini-challenge/${RUN_ID}/screenshots/startup.png
  log: runs/loops-and-conditionals-mini-challenge/${RUN_ID}/alice.log
  window_list: runs/loops-and-conditionals-mini-challenge/${RUN_ID}/window-list.txt
unsupported_policy: If host graphics, DISPLAY, Java 21, Maven prerequisites, or the explicit EATME_REAL_ALICE=1 gate are missing, fail loudly. Do not silently skip or substitute a mocked Alice runtime.
