schema_version: eatme.scenario/v1
id: instructor-classroom-setup-readiness
title: Instructor Classroom Setup Readiness
kind: instructor_agentic_flow
owner: eatme
resource_basis:
- name: Alice 3 download/setup page
  url: https://www.alice.org/get-alice/alice-3/
  use: 'Use setup constraints: desktop/laptop, graphics, Java/OpenGL/Linux details, video-driver problems, and Chromebook caveats.'
- name: Alice resources overview
  url: https://www.alice.org/resources/
  use: Use resource hub and teacher community support as fallback planning context.
purpose: Prepare a classroom setup checklist and fallback plan before students depend on Alice desktop tooling.
personas:
  instructors:
  - classroom-orchestrator
  - debug-coach
  students:
  - collaborative-peer-mentor
  - accessibility-advocate
agentic_flow:
  focus: classroom-setup
  instructor_goal: Prepare a classroom setup checklist and fallback plan before students depend on Alice desktop tooling.
  prompt_source: assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml#agentic_test_prompt
  non_coder_editable:
  - resource_basis
  - purpose
  - agentic_test_prompt
  - acceptance_criteria
  - acceptance_probes
  - rubric
  - avoid
  expected_outputs:
  - setup_checklist
  - fallback_plan
  - student_setup_note
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
agentic_test_prompt: Act as an instructor acceptance agent preparing classroom setup. Produce a readiness checklist, student-facing setup note, and fallback plan. Include device/graphics constraints from Alice resources, offline/resource alternatives, what evidence confirms readiness, and what to do when launch fails. Keep the plan non-coder editable.
acceptance_criteria:
- given: an instructor is preparing a lab
  when: the agent reviews setup constraints
  then: the output lists readiness checks, failure signals, and fallback activities
- given: some devices may not support Alice
  when: the agent writes student guidance
  then: the plan separates environment failures from student code bugs
acceptance_probes:
- Checklist distinguishes required readiness evidence from nice-to-have tools.
- Fallback plan preserves the lesson concept when Alice cannot launch on a device.
- Student-facing note avoids blaming learners for graphics or install failures.
rubric:
- criterion: Readiness evidence
  evidence:
  - Instructor can verify install/launch/resource availability before class.
  - Evidence is observable without hidden implementation details.
- criterion: Fallback quality
  evidence:
  - Alternative activity still targets the same Alice concept or design habit.
  - Plan names when to escalate setup problems.
- criterion: Classroom communication
  evidence:
  - Student note is concise and non-blaming.
  - Peer support roles are safe and bounded.
avoid:
- Exact user interface coordinates, menu paths, or private implementation details.
- Single correct creative answer; preserve student ownership.
- Visual polish as a substitute for concept evidence.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes instructor-classroom-setup-readiness
- id: lookingglass-setup-readiness
  command: EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} EATME_SETUP_READINESS_SCENARIO=instructor-classroom-setup-readiness ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
  evidence:
  - LookingGlass /api/health and /api/config respond for the web runtime
  - LookingGlass /api/setup/preflight names instructor-classroom-setup-readiness and desktop-only boundaries
  - LookingGlass /api/project/templates and /api/project/new prove classroom create-project readiness
  - LookingGlass /api/setup/evidence-handoff writes a classroom readiness handoff
- id: agentic-instructor-review
  command: cargo run -q -p eatme-cli -- assets instructor-agentic-evidence --path assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml --json
  evidence:
  - stdout JSON has status=covered
  - stdout JSON includes setup_checklist output evidence
  - stdout JSON includes fallback_plan output evidence
  - stdout JSON includes student_setup_note output evidence
timeouts:
  agentic_seconds: 900
artifacts:
  setup_checklist: agentic://instructor/setup-checklist
  fallback_plan: agentic://instructor/fallback-plan
  student_setup_note: agentic://instructor/student-setup-note
unsupported_policy: If the agent cannot read this editable YAML, the persona crew asset, or the cited Alice.org resource basis, fail visibly and report the missing evidence. Do not replace instructor judgment with brittle user interface assertions.
