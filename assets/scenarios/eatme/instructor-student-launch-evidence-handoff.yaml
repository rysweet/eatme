schema_version: eatme.scenario/v1
id: instructor-student-launch-evidence-handoff
title: Instructor Student Launch Evidence Handoff
kind: instructor_agentic_flow
owner: eatme
resource_basis:
- name: Alice 3 download/setup guidance
  url: https://www.alice.org/get-alice/alice-3/
  use: Use setup and launch constraints to separate environment readiness from student project behavior.
- name: Real Alice launch startup-check scenario
  url: assets/scenarios/eatme/real-alice-launch-smoke.yaml
  use: Use manifest, log, window, and screenshot evidence as a classroom readiness input, not as proof of student learning.
- name: First Lessons Real UI Actions Contract
  url: assets/scenarios/eatme/first-lessons-real-ui-actions.yaml
  use: Use the action contract to name expected Alice actions and the current ui_action_automation_unimplemented boundary honestly.
purpose: Help an instructor turn real Alice launch evidence into a student-facing classroom handoff. The instructor-facing output names what the manifest, log, window list, screenshot, and action contract can prove; what still needs human observation; and how students should record one Alice action, the visible result, and one next revision. This is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
personas:
  instructors:
  - classroom-orchestrator
  - debug-coach
  students:
  - curious-novice
  - reflective-debugger
agentic_flow:
  focus: instructor-student-launch-evidence-handoff
  instructor_goal: Prepare a classroom handoff that uses real Alice launch evidence honestly, separates environment readiness from learner behavior, and asks students for one visible action/result/revision note without claiming automated grading or complete Alice coverage.
  prompt_source: assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml#agentic_test_prompt
  non_coder_editable:
  - resource_basis
  - purpose
  - agentic_test_prompt
  - acceptance_criteria
  - acceptance_probes
  - rubric
  - avoid
  expected_outputs:
  - real_alice_evidence_handoff_card
  - instructor_readiness_note
  - student_action_prompt
adapter:
  targets:
  - eatme-cli
  - gadugi-cli
  - lookingglass
agentic_test_prompt: Act as an instructor acceptance agent preparing a classroom handoff after eatme has collected real Alice launch evidence. Produce a real Alice evidence handoff card, instructor readiness note, and student action prompt grounded in the listed resources and this scenario. Name which evidence comes from the manifest, log, window list, screenshot, and ui-action-contract.json. Separate environment readiness from student project behavior. Ask students to record one Alice action, the visible result after running, and one next revision. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
acceptance_criteria:
- given: an instructor has manifest, log, window-list, screenshot, and action-contract evidence from a real Alice launch check
  when: the classroom handoff is prepared
  then: the handoff names what each evidence item can prove and what still requires human observation
- given: Alice launches but deterministic action automation is not implemented
  when: students begin first classroom work
  then: the student prompt asks for one Alice action, visible result after running, and one next revision instead of claiming automated action coverage
- given: a learner-visible problem appears during class
  when: the instructor readiness note is applied
  then: the note separates environment readiness signals from student project behavior and keeps debugging learner-owned
acceptance_probes:
- Handoff card names manifest, log, window-list, screenshot, and ui-action-contract.json as evidence inputs.
- Readiness note separates environment launch evidence from student project behavior.
- Student action prompt asks for one Alice action, visible run result, and one next revision.
- Output says this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
rubric:
- criterion: Evidence boundary
  evidence:
  - Output says launch evidence supports readiness, not proof of student learning.
  - Action-contract evidence is described as current boundary evidence, not automated action success.
- criterion: Classroom handoff clarity
  evidence:
  - Instructor note names what to inspect before class and what to observe during student work.
  - Student prompt is plain-language and editable without changing Rust.
- criterion: Learner-owned debugging
  evidence:
  - Student records expected behavior, observed result, and one next revision.
  - Instructor guidance separates environment problems from student project behavior.
avoid:
- Exact user interface coordinates, brittle selectors, private implementation details, or hidden log-only grading.
- Claims of full user interface automation, automated creative assessment, learner-world grading, complete Alice coverage, or deployed service status.
- Treating launch evidence as proof of student understanding.
steps:
- id: validate-assets
  command: cargo run -q -p eatme-cli -- assets validate --json
  evidence:
  - stdout JSON has passed=true
  - stdout JSON includes instructor-student-launch-evidence-handoff
- id: lookingglass-setup-readiness
  command: EATME_WEB_PLATFORM=1 ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_curriculum_e2e -- --test-threads=1
  evidence:
  - LookingGlass /api/health and /api/config respond for the web runtime
  - LookingGlass /api/setup/preflight names instructor-student-launch-evidence-handoff and desktop-only boundaries
  - LookingGlass /api/launch proves web launch readiness without claiming Java desktop launch evidence
  - LookingGlass /api/setup/evidence-handoff returns student next actions and evidence-review notes
- id: agentic-instructor-review
  command: agentic instructor acceptance review using assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml
  evidence:
  - agent output addresses every acceptance_probe
  - agent output returns the expected_outputs listed in this YAML
timeouts:
  agentic_seconds: 900
artifacts:
  real_alice_evidence_handoff_card: agentic://instructor/real-alice-evidence-handoff-card
  instructor_readiness_note: agentic://instructor/readiness-note
  student_action_prompt: agentic://student/action-prompt
unsupported_policy: If the agent cannot read this editable YAML, the persona crew asset, or the cited Alice-facing evidence assets, fail visibly and report the missing evidence. Do not replace instructor judgment with launch artifacts. Do not claim full user interface automation, automated creative assessment, learner-world grading, complete Alice coverage, or a deployed service.
