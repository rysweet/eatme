- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Camera-and-audio polish guide prompts the student to choose one camera marker or audio cue and write one sentence explaining why they chose it.
      Camera-and-audio polish guide includes a caption or text-label step that makes the cue meaningful for viewers who cannot rely solely on sound or visual detail.
      Student sharecase card names the artifact or screenshot reference and describes the one cue the student added.
      Student sharecase card asks one targeted peer-feedback question that addresses concept or communication rather than only aesthetics.
      Accessibility-aware sharing plan lists at least two delivery alternatives in case export fails.
      Accessibility-aware sharing plan includes one accessibility-aware communication choice described as a real design decision, not an optional add-on.
      Output explains that peer feedback must target concept and communication, not only aesthetics, and states why.
      Output notes that export format, LMS, and media pipeline choices vary by classroom policy.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a real Alice startup check.
    asset: assets/scenarios/eatme/audio-camera-and-export-sharecase.yaml
    prompt: Act as an instructor acceptance agent preparing an Alice sharecase lesson where students add camera or audio polish to an existing world and then share it with peers. Produce a camera-and-audio polish guide, a student sharecase card, and an accessibility-aware sharing plan grounded in the listed resources and this audio-camera-and-export-sharecase scenario. The camera-and-audio polish guide must prompt the student to choose one camera marker or audio cue that improves audience understanding, write one sentence explaining why they chose that cue over doing nothing, and add a caption or text label that makes the cue meaningful for viewers who cannot rely solely on sound or on fine visual detail. The student sharecase card must name the artifact or screenshot reference, describe the one cue the student added and how it changes audience experience, and ask one targeted peer-feedback question that addresses concept or communication rather than only aesthetics. The accessibility-aware sharing plan must list at least two delivery alternatives — for example a project file hand-off and a screen presentation — so that sharing can proceed even if export fails, explain what each alternative requires from the receiving peer or teacher, and include one accessibility-aware communication choice (such as adding a caption or label to a key sound or visual moment). The instructor note must state that the accessibility-aware communication choice is a real design decision, not an optional add-on, and that export format, LMS, and media pipeline choices vary by classroom policy. Include a note that peer feedback must target concept and communication, not only aesthetics, and explain why that distinction matters for the audience's ability to follow the work. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a real Alice startup check.
