name: Eatme Building a Scene First World
description: Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/building-a-scene-first-world.yaml. Alice desktop behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only.
version: 1.0.0
config:
  timeout: 1800000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  - EATME_REAL_ALICE
  optional:
  - RUN_ID
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 1800000
    capture_output: true
steps:
- name: Validate Assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-building-a-scene-first-world}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"scenario_asset_count": 115'
  timeout: 60000
- name: Check Dependencies
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-building-a-scene-first-world}"
      cargo run -q -p eatme-cli -- deps check --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"all_required_available": true'
  timeout: 60000
- name: Launch Smoke
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-building-a-scene-first-world}"
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice run-howto --alice-home "${ALICE_HOME:?}" --run-id "${RUN_ID:?}" --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario building-a-scene-first-world
  expect:
    exit_code: 0
    stdout_contains:
    - '"scenario_id": "building-a-scene-first-world"'
    - '"failure_category": null'
    - '"real_alice_execution_evidence": {'
    - '"startup_screenshot": {'
    - '"passed": true'
  timeout: 900000
- name: Lookingglass Transform Run Save
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-building-a-scene-first-world}"
      set -e
      EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} ALICE_WEB_URL="${ALICE_WEB_URL:-http://localhost:3099}" cargo test -q -p eatme-alice --test web_platform_curriculum_e2e live_building_a_scene_first_world -- --test-threads=1
      printf "%s\n" "cargo-test-ok=web_platform_curriculum_e2e"
  expect:
    exit_code: 0
    stdout_contains:
    - cargo-test-ok=web_platform_curriculum_e2e
    - 'test result: ok'
  timeout: 60000
