name: "Eatme Building a Scene First World Smoke"
description: |
  Gadugi-compatible CLI scenario for the Building a Scene First World lesson
  smoke lane. Alice desktop launch behavior remains owned by eatme; gadugi
  invokes eatme commands and checks manifest-level evidence only.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
  optional:
    - RUN_ID

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: "/home/azureuser/src/eatme"
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd /home/azureuser/src/eatme && cargo run -q -p eatme-cli -- assets validate --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"scenario_asset_count": 16'
    timeout: 60000

  - name: "Check desktop launch dependencies"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd /home/azureuser/src/eatme && cargo run -q -p eatme-cli -- deps check --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"all_required_available": true'
    timeout: 60000

  - name: "Launch Building a Scene lane under Xvfb"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd /home/azureuser/src/eatme
        export RUN_ID="${RUN_ID:-gadugi-building-a-scene-first-world}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario building-a-scene-first-world
    expect:
      exit_code: 0
      stdout_contains:
        - '"scenario_id": "building-a-scene-first-world"'
        - '"failure_category": null'
        - '"startup_screenshot": {'
        - '"passed": true'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Dependencies Available"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Check desktop launch dependencies"
      required_strings:
        - '"all_required_available": true'

  - name: "Building a Scene Launches"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Launch Building a Scene lane under Xvfb"

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "building-a-scene"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "launch-smoke"
