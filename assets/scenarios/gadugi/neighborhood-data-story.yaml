# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Neighborhood Data Story Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/neighborhood-data-story.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/neighborhood-data-story.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-neighborhood-data-story}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"neighborhood-data-story"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Lesson brief shows a motivating variable-to-scene-change example before introducing the data-mapping card.
      Student data-mapping card prompts at least two fictional data values mapped to visible scene properties.
      Student data-mapping card prompts a written interpretation-limits sentence for each mapping.
      Representation-limits reflection prompt asks what a viewer might misread and how to revise the design.
      Output notes that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices.
      Optional array or list extension is clearly optional and does not block learners who complete only the two-value version.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/neighborhood-data-story.yaml
    prompt: 'Act as an instructor acceptance agent preparing a neighborhood data story Alice lesson. Produce a lesson brief, student data-mapping card, and representation-limits reflection prompt grounded in the listed resources and this neighborhood-data-story scenario. The lesson brief must show a short motivating example of a variable value driving a visible scene change (such as a tree count variable controlling how many trees appear in a scene), explain that any fictional or classroom-approved data can replace the example, and state the privacy-safe constraint that sensitive real personal data must not be used. The student data-mapping card must prompt the student to: name at least two fictional data values about a made-up neighborhood, choose a visible scene property for each value (such as scale, position, or movement speed), label what each mapping communicates to a viewer, and write a sentence explaining one thing the representation cannot prove. The representation-limits reflection prompt must ask what a viewer might misread, why that misreading could happen, and how the design could be revised to reduce it. Include a note that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices. Include an optional extension that shows how a small list or array can hold the same data value for multiple neighborhood locations, and make clear that the extension does not block learners who complete only the two-value version. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - lesson_brief
    - student_data_mapping_card
    - representation_limits_reflection
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/neighborhood-data-story.yaml
    step: Run instructor agentic acceptance review
