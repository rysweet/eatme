# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Neighborhood Data Story Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/neighborhood-data-story.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-neighborhood-data-story}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/neighborhood-data-story.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "neighborhood-data-story"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-neighborhood-data-story}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/neighborhood-data-story.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/neighborhood-data-story.yaml'
      grep -F -- 'lesson_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_data_mapping_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'representation_limits_reflection' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Lesson brief shows a motivating variable-to-scene-change example before introducing the data-mapping card.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student data-mapping card prompts at least two fictional data values mapped to visible scene properties.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student data-mapping card prompts a written interpretation-limits sentence for each mapping.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Representation-limits reflection prompt asks what a viewer might misread and how to revise the design.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output notes that text labels, audio narration, or reduced-complexity layouts are valid accessibility choices.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Optional array or list extension is clearly optional and does not block learners who complete only the two-value version.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'lesson_brief'
      printf '%s\n' 'student_data_mapping_card'
      printf '%s\n' 'representation_limits_reflection'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - lesson_brief
    - student_data_mapping_card
    - representation_limits_reflection
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
