name: Eatme Mars Rover Proximity Mission Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/mars-rover-proximity-mission.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/mars-rover-proximity-mission.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-mars-rover-proximity-mission}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"mars-rover-proximity-mission"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Lesson brief shows the rover moving with no proximity handler before introducing the event-driven version.
      Proximity-range frame names the proximity threshold and avoidance action without referencing specific Alice assets.
      Student activity sheet prompts a written prediction of when the reaction fires before any test run.
      Student activity sheet includes an observation log comparing prediction to visible outcome after running.
      Output connects systems-puzzle-solver and playful-tinkerer student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/mars-rover-proximity-mission.yaml
    prompt: 'Act as an instructor acceptance agent preparing a Mars rover proximity mission Alice lesson. Produce a lesson brief, student activity sheet, and proximity-range frame grounded in the listed resources and this mars-rover-proximity-mission scenario. The lesson brief must show a short motivating example of a rover moving toward a rock hazard with no event handler first, explain what changes when a proximity event handler is added, and introduce a proximity-range frame the student sets before running. The student activity sheet must prompt: place a rover and at least one rock hazard in the scene (without naming specific Alice character files), write a proximity event handler that triggers an avoidance action when the rover is within a chosen range, choose a range value and write a prediction of whether the rover will react before or after reaching the hazard, run the world, and record what visible behavior changed compared to the prediction. The proximity-range frame must name the proximity threshold, the event name, and the avoidance action without requiring specific Alice assets or character models. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - lesson_brief
    - student_activity_sheet
    - proximity_range_frame
  timeout: 900000
assertions:
