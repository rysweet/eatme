    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-mars-rover-proximity-mission}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/mars-rover-proximity-mission.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "mars-rover-proximity-mission"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-mars-rover-proximity-mission}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/mars-rover-proximity-mission.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/mars-rover-proximity-mission.yaml'
      grep -F -- 'lesson_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_activity_sheet' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'proximity_range_frame' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Lesson brief shows the rover moving with no proximity handler before introducing the event-driven version.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Proximity-range frame names the proximity threshold and avoidance action without referencing specific Alice assets.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student activity sheet prompts a written prediction of when the reaction fires before any test run.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student activity sheet includes an observation log comparing prediction to visible outcome after running.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output connects systems-puzzle-solver and playful-tinkerer student personas to visible classroom evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'lesson_brief'
      printf '%s\n' 'student_activity_sheet'
      printf '%s\n' 'proximity_range_frame'
      printf '%s\n' instructor-acceptance-contract-ok
