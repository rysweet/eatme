name: Eatme First Lessons Real UI Actions Contract
description: 'Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/first-lessons-real-ui-actions.yaml. Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only. This adapter preserves the source boundary: not full UI automation, not creative assessment, and not learner-world grading.'
version: 1.0.0
config:
  timeout: 1800000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  - EATME_REAL_ALICE
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
