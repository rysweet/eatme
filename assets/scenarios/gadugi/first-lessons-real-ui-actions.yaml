  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-first-lessons-real-ui-actions}"
      cargo run -q -p eatme-cli -- deps check --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"all_required_available": true'
  timeout: 60000
- name: Launch Real Ui Action Contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-first-lessons-real-ui-actions}"
