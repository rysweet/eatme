name: "Eatme First Lessons Real UI Actions Contract"
description: |
  Gadugi-compatible CLI scenario for the first Alice real UI action contract.
  Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme
  commands and checks manifest-level evidence, including the expected explicit
  failure while UI actions are not automated.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
  optional:
    - RUN_ID
    - EATME_REPO

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: .
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cargo run -q -p eatme-cli -- assets validate --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"scenario_asset_count": 30'
    timeout: 60000

  - name: "Launch first lessons real UI action contract"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        export RUN_ID="${RUN_ID:-gadugi-first-lessons-real-ui-actions}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario first-lessons-real-ui-actions
    expect:
      exit_code: 1
      stdout_contains:
        - '"scenario_id": "first-lessons-real-ui-actions"'
        - '"failure_category": "ui_action_automation_unimplemented"'
        - '"specific_alice_window_detected": {'
        - '"place_object_ui_action": {'
        - '"edit_procedure_ui_action": {'
        - '"run_world_ui_action": {'
        - '"save_project_ui_action": {'
        - '"ui_action_contract": {'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Real UI Actions Fail Explicitly"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Launch first lessons real UI action contract"
      required_strings:
        - '"failure_category": "ui_action_automation_unimplemented"'
        - '"ui_action_contract": {'

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "real-ui-actions"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "ui-action-contract"
