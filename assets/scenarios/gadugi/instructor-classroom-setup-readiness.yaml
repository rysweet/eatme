name: Eatme Instructor Classroom Setup Readiness Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-classroom-setup-readiness}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-classroom-setup-readiness"'
  timeout: 60000
- name: Lookingglass Setup Readiness
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-classroom-setup-readiness}"
      EATME_WEB_PLATFORM=1 EATME_SETUP_READINESS_SCENARIO=instructor-classroom-setup-readiness ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
  expect:
    exit_code: 0
    stdout_contains: []
  timeout: 300000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Checklist distinguishes required readiness evidence from nice-to-have tools.
      Fallback plan preserves the lesson concept when Alice cannot launch on a device.
      Student-facing note avoids blaming learners for graphics or install failures.
    asset: assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml
    prompt: Act as an instructor acceptance agent preparing classroom setup. Produce a readiness checklist, student-facing setup note, and fallback plan. Include device/graphics constraints from Alice resources, offline/resource alternatives, what evidence confirms readiness, and what to do when launch fails. Keep the plan non-coder editable.
  expect:
    output_contains:
    - setup_checklist
    - fallback_plan
    - student_setup_note
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: lookingglass-setup-readiness succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Lookingglass Setup Readiness
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml
    step: Run instructor agentic acceptance review
