# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Instructor Classroom Setup Readiness Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-classroom-setup-readiness}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-classroom-setup-readiness"'
  timeout: 60000
- name: Lookingglass Setup Readiness
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-classroom-setup-readiness}"
      set -e
      EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} EATME_SETUP_READINESS_SCENARIO=instructor-classroom-setup-readiness ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
      printf "%s\n" "cargo-test-ok=web_platform_setup_readiness_e2e"
  expect:
    exit_code: 0
    stdout_contains:
    - cargo-test-ok=web_platform_setup_readiness_e2e
    - 'test result: ok'
  timeout: 300000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-classroom-setup-readiness}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing classroom setup. Produce a readiness checklist, student-facing setup note, and fallback plan. Include device/graphics constraints from Alice resources, offline/resource alternatives, what evidence confirms readiness, and what to do when launch fails. Keep the plan non-coder editable.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml'
      grep -F -- 'setup_checklist' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'fallback_plan' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_setup_note' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Checklist distinguishes required readiness evidence from nice-to-have tools.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Fallback plan preserves the lesson concept when Alice cannot launch on a device.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student-facing note avoids blaming learners for graphics or install failures.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'setup_checklist'
      printf '%s\n' 'fallback_plan'
      printf '%s\n' 'student_setup_note'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - setup_checklist
    - fallback_plan
    - student_setup_note
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: lookingglass-setup-readiness succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Lookingglass Setup Readiness
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
metadata:
  source_eatme_asset: assets/scenarios/eatme/instructor-classroom-setup-readiness.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - classroom-setup
  - instructor-classroom-setup-readiness
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
