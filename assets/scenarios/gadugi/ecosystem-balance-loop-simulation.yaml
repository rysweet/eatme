- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ecosystem-balance-loop-simulation}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing an ecosystem loop simulation Alice lesson. Produce a lesson brief, student activity sheet, and loop-round frame grounded in the listed resources and this ecosystem-balance-loop-simulation scenario. The lesson brief must show a short motivating example of duplicated per-round animal calls first, explain why a loop removes the duplication, and introduce a loop that runs for a chosen number of rounds where each round repeats the same animal behaviors. The student activity sheet must prompt: choose at least two kinds of animals (such as rabbits and foxes, or fish and sharks), write a single loop round containing one behavior per animal, choose a round count between 3 and 10, write a prediction of what the scene will look like after that many rounds before running, run the world, and record what visible behavior changed compared to the prediction. The loop-round frame must name the loop counter, name the round body, and list the two animal behaviors without requiring specific Alice assets or character models. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml'
      grep -F -- 'lesson_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_activity_sheet' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'loop_round_frame' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
