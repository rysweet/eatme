name: Eatme Ecosystem Balance Loop Simulation Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ecosystem-balance-loop-simulation}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"ecosystem-balance-loop-simulation"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Lesson brief shows duplicated per-round animal calls before introducing the loop.
      Loop-round frame names the loop counter and round body without referencing specific Alice assets.
      Student activity sheet prompts a written prediction of scene state after N rounds before any test run.
      Student activity sheet prompts recording of observed visible behavior after the run.
      Output connects systems-puzzle-solver and playful-tinkerer student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml
    prompt: 'Act as an instructor acceptance agent preparing an ecosystem loop simulation Alice lesson. Produce a lesson brief, student activity sheet, and loop-round frame grounded in the listed resources and this ecosystem-balance-loop-simulation scenario. The lesson brief must show a short motivating example of duplicated per-round animal calls first, explain why a loop removes the duplication, and introduce a loop that runs for a chosen number of rounds where each round repeats the same animal behaviors. The student activity sheet must prompt: choose at least two kinds of animals (such as rabbits and foxes, or fish and sharks), write a single loop round containing one behavior per animal, choose a round count between 3 and 10, write a prediction of what the scene will look like after that many rounds before running, run the world, and record what visible behavior changed compared to the prediction. The loop-round frame must name the loop counter, name the round body, and list the two animal behaviors without requiring specific Alice assets or character models. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - lesson_brief
    - student_activity_sheet
    - loop_round_frame
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/ecosystem-balance-loop-simulation.yaml
    step: Run instructor agentic acceptance review
