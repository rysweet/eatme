name: Eatme Design Process — Story or Game Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/design-process-story-or-game.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/design-process-story-or-game.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-design-process-story-or-game}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"design-process-story-or-game"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Design-process guide opens with a story-vs-game framing that explains the sequence-versus-event-loop structural difference.
      Student scene-sketch card prompts the student to choose story or game mode and state a reason.
      Student scene-sketch card prompts at least two scenes or game states with characters and key actions named.
      Student scene-sketch card includes a one-sentence design brief stating the project goal or message.
      Design-to-code bridge card prompts mapping each scene or state to at least one named Alice concept.
      Design-to-code bridge card asks the student to note any planned action without a concept match.
      Output notes that narrated text overlays, simplified layouts, or reduced character counts are valid accessibility choices.
      Optional revision note extension is clearly optional and does not block learners who complete only the brief and bridge card.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/design-process-story-or-game.yaml
    prompt: 'Act as an instructor acceptance agent preparing a design-process story-or-game Alice lesson. Produce a design-process guide, student scene-sketch card, and design-to-code bridge card grounded in the listed resources and this design-process-story-or-game scenario. The design-process guide must open with a story-vs-game framing: explain that a story project uses a sequence of Alice method calls to move characters through a beginning, middle, and end, while a game project uses an event loop with player-triggered actions and win or lose conditions, and state that students choose whichever type fits their creative goal. The student scene-sketch card must prompt the student to: choose story or game mode and write one sentence stating why, sketch or describe at least two scenes (for a story) or two game states (for a game), name at least one character and one key action per scene or state, and write a one-sentence design brief stating the project goal or message. The design-to-code bridge card must prompt the student to map each sketched scene or state to at least one Alice concept by name (such as a method, event handler, variable, or conditional), explain what that concept controls in the scene or state, and note whether any planned action does not yet have a corresponding Alice concept. The reflection prompt must ask what changed between the design sketch and the first playthrough, why the change happened, and whether the change improved the project or revealed a gap to address next. Include a note that narrated text overlays, simplified scene layouts, or reduced character counts are valid accessibility choices that do not weaken the design. Include an optional extension that asks students to write one revision note comparing plan to first playthrough, and make clear that the extension does not block learners who complete only the brief and bridge card. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - design_process_guide
    - student_scene_sketch_card
    - design_to_code_bridge_card
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/design-process-story-or-game.yaml
    step: Run instructor agentic acceptance review
