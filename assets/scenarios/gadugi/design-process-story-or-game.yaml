# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Design Process — Story or Game Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/design-process-story-or-game.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
  - ALICE_WEB_URL
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-design-process-story-or-game}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/design-process-story-or-game.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "design-process-story-or-game"'
  timeout: 60000
- name: Lookingglass Design Process Evidence
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-design-process-story-or-game}"
      set -e
      EATME_WEB_PLATFORM=1 ALICE_WEB_URL="${ALICE_WEB_URL:-http://localhost:3099}" cargo test -p eatme-alice --test web_platform_curriculum_e2e live_design_process_records_playtest_revision_and_review_evidence -- --test-threads=1
      printf "%s\n" "cargo-test-ok=web_platform_curriculum_e2e"
  expect:
    exit_code: 0
    stdout_contains:
    - cargo-test-ok=web_platform_curriculum_e2e
    - 'test result: ok'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-design-process-story-or-game}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/design-process-story-or-game.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing a design-process story-or-game Alice lesson. Produce a design-process guide, student scene-sketch card, and design-to-code bridge card grounded in the listed resources and this design-process-story-or-game scenario. The design-process guide must open with a story-vs-game framing: explain that a story project uses a sequence of Alice method calls to move characters through a beginning, middle, and end, while a game project uses an event loop with player-triggered actions and win or lose conditions, and state that students choose whichever type fits their creative goal. The student scene-sketch card must prompt the student to: choose story or game mode and write one sentence stating why, sketch or describe at least two scenes (for a story) or two game states (for a game), name at least one character and one key action per scene or state, and write a one-sentence design brief stating the project goal or message. The design-to-code bridge card must prompt the student to map each sketched scene or state to at least one Alice concept by name (such as a method, event handler, variable, or conditional), explain what that concept controls in the scene or state, and note whether any planned action does not yet have a corresponding Alice concept. The reflection prompt must ask what changed between the design sketch and the first playthrough, why the change happened, and whether the change improved the project or revealed a gap to address next. Include a note that narrated text overlays, simplified scene layouts, or reduced character counts are valid accessibility choices that do not weaken the design. Include an optional extension that asks students to write one revision note comparing plan to first playthrough, and make clear that the extension does not block learners who complete only the brief and bridge card. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/design-process-story-or-game.yaml'
      grep -F -- 'design_process_guide' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_scene_sketch_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'design_to_code_bridge_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation records bounded plan, build, playtest, revise, and review evidence through /api/design-process/story-or-game/evidence when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass revision-loop evidence includes an initial playtest run and a second run after a revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Design-process guide opens with a story-vs-game framing that explains the sequence-versus-event-loop structural difference.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student scene-sketch card prompts the student to choose story or game mode and state a reason.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student scene-sketch card prompts at least two scenes or game states with characters and key actions named.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student scene-sketch card includes a one-sentence design brief stating the project goal or message.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Design-to-code bridge card prompts mapping each scene or state to at least one named Alice concept.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Design-to-code bridge card asks the student to note any planned action without a concept match.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output notes that narrated text overlays, simplified layouts, or reduced character counts are valid accessibility choices.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Optional revision note extension is clearly optional and does not block learners who complete only the brief and bridge card.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'design_process_guide'
      printf '%s\n' 'student_scene_sketch_card'
      printf '%s\n' 'design_to_code_bridge_card'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - design_process_guide
    - student_scene_sketch_card
    - design_to_code_bridge_card
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: lookingglass-design-process-evidence succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Lookingglass Design Process Evidence
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
