name: Eatme VR Camera Locomotion Journey
description: Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/vr-camera-locomotion-journey.yaml. Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only.
version: 1.0.0
config:
  timeout: 1800000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  - EATME_REAL_ALICE
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 1800000
    capture_output: true
steps:
- name: Validate Assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"scenario_asset_count": 107'
  timeout: 60000
- name: Check Desktop Dependencies
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
      cargo run -q -p eatme-cli -- deps check --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"all_required_available": true'
  timeout: 60000
- name: Record Vr Preflight
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
      bash -lc 'if [ "${EATME_REAL_VR:-0}" = "1" ] && [ "${VR_HEADSET_AVAILABLE:-0}" = "1" ]; then printf "real_vr_available=true\nrequired_evidence=alice-player-or-headset-capture,comfort-notes,observer-log\n"; else printf "real_vr_available=false\nrequired_evidence=camera-marker-plan,viewpoint-choice,locomotion-comfort-check,desktop-launch-manifest\n"; fi'
  expect:
    exit_code: 0
    stdout_contains: []
  timeout: 60000
- name: Launch Smoke
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke --alice-home ${ALICE_HOME} --run-id ${RUN_ID} --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario vr-camera-locomotion-journey
  expect:
    exit_code: 0
    stdout_contains:
    - '"scenario_id": "vr-camera-locomotion-journey"'
    - '"failure_category": null'
    - '"real_alice_execution_evidence": {'
    - '"startup_window_or_screenshot": {'
    - '"passed": true'
  timeout: 900000
- name: Agentic Journey Evidence
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
      Review the launched Alice session and learner artifact using the persona prompt assets; do not require real VR hardware unless record-vr-preflight reports real_vr_available=true.
  expect:
    exit_code: 0
    stdout_contains: []
  timeout: 60000
assertions:
