name: "Eatme VR Camera Locomotion Journey Smoke"
description: |
  Gadugi-compatible CLI scenario for the VR camera locomotion outside-in lane.
  Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme
  commands, records VR availability expectations, and checks manifest-level
  evidence only.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
  optional:
    - RUN_ID
    - EATME_REAL_VR
    - ALICE_PLAYER_HOME
    - VR_HEADSET_AVAILABLE

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: "/home/azureuser/src/eatme"
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd /home/azureuser/src/eatme && cargo run -q -p eatme-cli -- assets validate --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"scenario_asset_count": 16'
    timeout: 60000

  - name: "Check desktop launch dependencies"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd /home/azureuser/src/eatme && cargo run -q -p eatme-cli -- deps check --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"all_required_available": true'
    timeout: 60000

  - name: "Record VR execution preflight expectations"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd /home/azureuser/src/eatme
        if [ "${EATME_REAL_VR:-0}" = "1" ] && [ "${VR_HEADSET_AVAILABLE:-0}" = "1" ]; then
          test -n "${ALICE_PLAYER_HOME:-}" || { echo "ALICE_PLAYER_HOME required when EATME_REAL_VR=1" >&2; exit 1; }
          printf 'real_vr_available=true\n'
          printf 'required_evidence=alice-player-or-headset-capture,comfort-notes,observer-log\n'
        else
          printf 'real_vr_available=false\n'
          printf 'required_evidence=camera-marker-plan,viewpoint-choice,locomotion-comfort-check,desktop-launch-manifest\n'
        fi
    expect:
      exit_code: 0
      stdout_contains:
        - 'real_vr_available='
        - 'required_evidence='
    timeout: 60000

  - name: "Launch VR Camera Locomotion lane under Xvfb"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd /home/azureuser/src/eatme
        export RUN_ID="${RUN_ID:-gadugi-vr-camera-locomotion-journey}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario vr-camera-locomotion-journey
    expect:
      exit_code: 0
      stdout_contains:
        - '"scenario_id": "vr-camera-locomotion-journey"'
        - '"failure_category": null'
        - '"startup_window_or_screenshot": {'
        - '"passed": true'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Dependencies Available"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Check desktop launch dependencies"
      required_strings:
        - '"all_required_available": true'

  - name: "VR Preflight Recorded"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Record VR execution preflight expectations"
      required_strings:
        - "real_vr_available="
        - "required_evidence="

  - name: "VR Camera Locomotion Launches"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Launch VR Camera Locomotion lane under Xvfb"

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "vr"
    - "camera"
    - "locomotion"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "launch-smoke"
