- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ide-accessibility-parity}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/ide-accessibility-parity.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing an IDE accessibility parity review. Produce an accessibility checklist, a keyboard coverage worksheet, and a zoom-and-contrast evidence card. The checklist must verify screen reader compatibility by asking whether all interactive elements have accessible labels. The worksheet must verify keyboard navigation by checking whether core IDE features are reachable by keyboard only. The evidence card must verify high contrast mode by asking whether the UI remains usable in high contrast, and verify zoom or magnification by checking that UI elements scale correctly at 200%. State explicitly that this is not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/ide-accessibility-parity.yaml'
      grep -F -- 'accessibility_checklist' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'keyboard_coverage_worksheet' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'zoom_and_contrast_evidence_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Checklist explicitly says all interactive elements have accessible labels.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Worksheet explicitly says all IDE features reachable via keyboard.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Worksheet asks reviewers to record where focus order or shortcut coverage breaks first.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Evidence card explicitly says UI remains usable in high contrast.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Evidence card explicitly says UI elements scale correctly at 200%.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states that the scenario is not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'accessibility_checklist'
      printf '%s\n' 'keyboard_coverage_worksheet'
      printf '%s\n' 'zoom_and_contrast_evidence_card'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
