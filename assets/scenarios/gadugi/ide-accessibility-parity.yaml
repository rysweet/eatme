name: Eatme IDE Accessibility Parity — Labels, Keyboard, Contrast, and Zoom Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/ide-accessibility-parity.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/ide-accessibility-parity.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ide-accessibility-parity}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"ide-accessibility-parity"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Checklist explicitly says all interactive elements have accessible labels.
      Worksheet explicitly says all IDE features reachable via keyboard.
      Worksheet asks reviewers to record where focus order or shortcut coverage breaks first.
      Evidence card explicitly says UI remains usable in high contrast.
      Evidence card explicitly says UI elements scale correctly at 200%.
      Output states that the scenario is not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/ide-accessibility-parity.yaml
    prompt: Act as an instructor acceptance agent preparing an IDE accessibility parity review. Produce an accessibility checklist, a keyboard coverage worksheet, and a zoom-and-contrast evidence card. The checklist must verify screen reader compatibility by asking whether all interactive elements have accessible labels. The worksheet must verify keyboard navigation by checking whether core IDE features are reachable by keyboard only. The evidence card must verify high contrast mode by asking whether the UI remains usable in high contrast, and verify zoom or magnification by checking that UI elements scale correctly at 200%. State explicitly that this is not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
  expect:
    output_contains:
    - accessibility_checklist
    - keyboard_coverage_worksheet
    - zoom_and_contrast_evidence_card
  timeout: 900000
assertions:
- name: Assets Validate
