    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ide-accessibility-parity}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/ide-accessibility-parity.yaml --json
  expect:
