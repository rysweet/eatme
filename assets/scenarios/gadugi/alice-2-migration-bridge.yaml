name: Eatme Alice 2 Migration Bridge
description: Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/alice-2-migration-bridge.yaml. Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only.
version: 1.0.0
config:
  timeout: 1800000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  - EATME_REAL_ALICE
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 1800000
    capture_output: true
steps:
- name: Validate Assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-alice-2-migration-bridge}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"scenario_asset_count": 57'
  timeout: 60000
- name: Record Migration Bridge
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-alice-2-migration-bridge}"
      bash -lc 'printf "migration_fields=alice2-intent,alice3-workflow,vocabulary-delta,visible-student-evidence\nrequired_evidence=keep-adapt-retire,current-artifact,student-reflection\n"'
  expect:
    exit_code: 0
    stdout_contains: []
  timeout: 60000
- name: Launch Smoke
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-alice-2-migration-bridge}"
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke --alice-home ${ALICE_HOME} --run-id ${RUN_ID} --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario alice-2-migration-bridge
  expect:
    exit_code: 0
    stdout_contains:
    - '"scenario_id": "alice-2-migration-bridge"'
    - '"failure_category": null'
    - '"real_alice_execution_evidence": {'
    - '"startup_window_or_screenshot": {'
    - '"passed": true'
  timeout: 900000
assertions:
- name: validate-assets succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate Assets
- name: record-migration-bridge succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Record Migration Bridge
- name: launch-smoke succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Launch Smoke
