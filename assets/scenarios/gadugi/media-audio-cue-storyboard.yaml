name: Eatme Media Audio Cue Storyboard Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/media-audio-cue-storyboard.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-media-audio-cue-storyboard}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/media-audio-cue-storyboard.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "media-audio-cue-storyboard"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-media-audio-cue-storyboard}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/media-audio-cue-storyboard.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing a student media/audio mission for Alice. Produce a media cue storyboard, student prediction prompt, accessibility fallback note, and revision reflection prompt grounded in the listed resources and this media-audio-cue-storyboard scenario. Require one sound, timing, camera, or caption cue; the intended audience meaning; a prediction before running; the visible or audible result after running; one student-owned revision; and a fallback when audio, captioning, or classroom hardware is unavailable. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed media pipeline.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/media-audio-cue-storyboard.yaml'
      grep -F -- 'media_cue_storyboard' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_prediction_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'accessibility_fallback_note' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'revision_reflection_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass native audio evidence is covered by LookingGlass:test/project-audio-native-authoring.contract.test.ts with Web Audio output and full audio authoring evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Media cue storyboard includes one sound, timing, camera, or caption cue plus intended audience meaning.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student prediction prompt asks for expected visible or audible behavior before running and observed evidence afterward.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Accessibility fallback note names a caption, visual cue, peer narration, or non-audio fallback.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Revision reflection prompt asks for one student-owned change based on run evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output connects media-audio-creator, creative-storyteller, and accessibility-advocate personas to reviewable classroom evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed media pipeline.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'media_cue_storyboard'
      printf '%s\n' 'student_prediction_prompt'
      printf '%s\n' 'accessibility_fallback_note'
      printf '%s\n' 'revision_reflection_prompt'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - media_cue_storyboard
    - student_prediction_prompt
    - accessibility_fallback_note
    - revision_reflection_prompt
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
