# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Media Audio Cue Storyboard Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/media-audio-cue-storyboard.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/media-audio-cue-storyboard.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-media-audio-cue-storyboard}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/media-audio-cue-storyboard.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "media-audio-cue-storyboard"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      LookingGlass bounded metadata/playback-bridge evidence is limited to LookingGlass:test/project-audio-bounded-evidence.contract.test.ts and does not claim native audio playback.
      Media cue storyboard includes one sound, timing, camera, or caption cue plus intended audience meaning.
      Student prediction prompt asks for expected visible or audible behavior before running and observed evidence afterward.
      Accessibility fallback note names a caption, visual cue, peer narration, or non-audio fallback.
      Revision reflection prompt asks for one student-owned change based on run evidence.
      Output connects media-audio-creator, creative-storyteller, and accessibility-advocate personas to reviewable classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed media pipeline.
    asset: assets/scenarios/eatme/media-audio-cue-storyboard.yaml
    prompt: Act as an instructor acceptance agent preparing a student media/audio mission for Alice. Produce a media cue storyboard, student prediction prompt, accessibility fallback note, and revision reflection prompt grounded in the listed resources and this media-audio-cue-storyboard scenario. Require one sound, timing, camera, or caption cue; the intended audience meaning; a prediction before running; the visible or audible result after running; one student-owned revision; and a fallback when audio, captioning, or classroom hardware is unavailable. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed media pipeline.
  expect:
    output_contains:
    - media_cue_storyboard
    - student_prediction_prompt
    - accessibility_fallback_note
    - revision_reflection_prompt
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/media-audio-cue-storyboard.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/media-audio-cue-storyboard.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - media-audio-cue-storyboard
  - media-audio-cue-storyboard
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
