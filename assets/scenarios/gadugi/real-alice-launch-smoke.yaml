  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-real-alice-launch-smoke}"
      cargo run -q -p eatme-cli -- deps check --json
  expect:
    exit_code: 0
