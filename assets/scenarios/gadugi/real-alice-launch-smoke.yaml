name: Eatme Real Alice launch smoke
description: 'Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/real-alice-launch-smoke.yaml. Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only. This adapter preserves the source boundary: not full UI automation, not creative assessment, and not learner-world grading.'
