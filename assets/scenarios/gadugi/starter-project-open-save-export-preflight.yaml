name: "Eatme Starter Project Open Save Export Preflight"
description: |
  Gadugi-compatible CLI scenario for the real Alice starter-project preflight.
  Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme
  commands and checks manifest-level evidence before save/reopen/export work.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
  optional:
    - RUN_ID
    - EATME_REPO

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: "."
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd \"${EATME_REPO:-.}\" && cargo run -q -p eatme-cli -- assets validate --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"scenario_asset_count": 16'
    timeout: 60000

  - name: "Check desktop launch dependencies"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: "cd \"${EATME_REPO:-.}\" && cargo run -q -p eatme-cli -- deps check --json"
    expect:
      exit_code: 0
      stdout_contains:
        - '"all_required_available": true'
    timeout: 60000

  - name: "Launch starter project preflight under Xvfb"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        export RUN_ID="${RUN_ID:-gadugi-starter-project-open-save-export-preflight}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario starter-project-open-save-export-preflight
    expect:
      exit_code: 0
      stdout_contains:
        - '"scenario_id": "starter-project-open-save-export-preflight"'
        - '"failure_category": null'
        - '"real_alice_execution_evidence": {'
        - '"startup_window_or_screenshot": {'
        - 'africa.a3p'
        - '"passed": true'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Dependencies Available"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Check desktop launch dependencies"
      required_strings:
        - '"all_required_available": true'

  - name: "Starter Project Preflight Launches"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Launch starter project preflight under Xvfb"

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "open-save-export"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "launch-smoke"
