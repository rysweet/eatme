name: Eatme Instructor Lesson Materials Remix Agentic Flow
description: Gadugi-compatible instructor QA adapter generated from assets/scenarios/eatme/instructor-lesson-materials-remix.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-qa-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-lesson-materials-remix.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-lesson-materials-remix}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-lesson-materials-remix"'
  timeout: 60000
- name: Run instructor agentic QA review
  agent: instructor-qa-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Teacher plan has a time-boxed launch, make/run/revise cycle, and share-out.
      Student handout names the Alice concept in learner-friendly language.
      Exit ticket checks concept understanding, not just completion.
    asset: assets/scenarios/eatme/instructor-lesson-materials-remix.yaml
    prompt: Act as an instructor QA agent preparing lesson materials. Produce a one-page teacher plan, student handout, and exit ticket for an Alice lesson grounded in the listed resources. Include setup assumptions, concept vocabulary, predicted visible world changes, run/revise checkpoints, and a reflection question. Keep language editable and classroom-facing.
  expect:
    output_contains:
    - teacher_plan
    - student_handout
    - exit_ticket
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Review Covers Probes
  type: agentic_acceptance
  agent: instructor-qa-agent
  params:
    asset: assets/scenarios/eatme/instructor-lesson-materials-remix.yaml
    step: Run instructor agentic QA review
