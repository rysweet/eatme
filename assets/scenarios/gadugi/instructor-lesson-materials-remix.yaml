name: Eatme Instructor Lesson Materials Remix Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-lesson-materials-remix.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-lesson-materials-remix}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/instructor-lesson-materials-remix.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-lesson-materials-remix"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-lesson-materials-remix}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-lesson-materials-remix.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing lesson materials. Produce a one-page teacher plan, student handout, and exit ticket for an Alice lesson grounded in the listed resources and this instructor-lesson-materials-remix scenario. Include setup assumptions, concept vocabulary, predicted visible world changes, run/revise checkpoints, an instructor review/remix note, and a reflection question. Keep language editable and classroom-facing. Do not claim automated creative grading or learner-world assessment.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-lesson-materials-remix.yaml'
      grep -F -- 'teacher_plan' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_handout' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'exit_ticket' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Teacher plan has a time-boxed launch, make/run/revise cycle, and share-out.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student handout names the Alice concept in learner-friendly language.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Exit ticket checks concept understanding, not just completion.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Instructor review/remix note names the scenario-labeled lesson-material path.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output avoids automated creative grading and learner-world assessment claims.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'teacher_plan'
      printf '%s\n' 'student_handout'
      printf '%s\n' 'exit_ticket'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - teacher_plan
    - student_handout
    - exit_ticket
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
