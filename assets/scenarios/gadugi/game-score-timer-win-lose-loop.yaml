name: "Eatme Game Score Timer Win Lose Loop Smoke"
description: |
  Gadugi-compatible CLI scenario for the Game Score Timer Win Lose Loop lane.
  Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme
  commands and checks manifest-level evidence before agentic score/timer/reflection judgment.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
  optional:
    - RUN_ID
    - EATME_REPO

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: .
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        cargo run -q -p eatme-cli -- assets validate --json
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"creative_scenario_count": 11'
        - '"scenario_asset_count": 32'
    timeout: 60000

  - name: "Check desktop launch dependencies"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        cargo run -q -p eatme-cli -- deps check --json
    expect:
      exit_code: 0
      stdout_contains:
        - '"all_required_available": true'
    timeout: 60000

  - name: "Launch Game Score Timer Win Lose Loop lane under Xvfb"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        export RUN_ID="${RUN_ID:-gadugi-game-score-timer-win-lose-loop}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario game-score-timer-win-lose-loop
    expect:
      exit_code: 0
      stdout_contains:
        - '"scenario_id": "game-score-timer-win-lose-loop"'
        - '"failure_category": null'
        - '"real_alice_execution_evidence": {'
        - '"startup_window_or_screenshot": {'
        - '"passed": true'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Dependencies Available"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Check desktop launch dependencies"
      required_strings:
        - '"all_required_available": true'

  - name: "Game Score Timer Win Lose Loop Launches"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Launch Game Score Timer Win Lose Loop lane under Xvfb"

  - name: "Agentic Score Timer Reflection Contract"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"
      required_strings:
        - '"passed": true'
        - '"creative_scenario_count": 11'

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "score-timer"
    - "win-lose"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "launch-smoke"
