name: Eatme Sharing Readiness Boundary QA Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/sharing-readiness-boundary-qa.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/sharing-readiness-boundary-qa.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-sharing-readiness-boundary-qa}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"sharing-readiness-boundary-qa"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Boundary violation report scans all five sharing evidence surfaces for overclaim patterns and reports violations or confirms none.
      Boundary preservation summary confirms that sharing evidence stays bounded to classroom review artifacts.
      Remediation guidance names the specific overclaim and suggests bounded replacement wording when violations are found.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, not hosted sharing, not deployed sharing, and not platform success.
      Readiness impact says the reviewer gets a boundary validation report for classroom review artifacts, not proof of deployment or platform operation.
    asset: assets/scenarios/eatme/sharing-readiness-boundary-qa.yaml
    prompt: Act as an instructor acceptance agent validating the sharing readiness boundary. Scan the five sharing evidence surfaces listed in resource_basis for any overclaim patterns from SHARING_SUCCESS_CLAIM_PATTERNS. Produce a boundary_violation_report listing any overclaim patterns found (empty when the boundary holds), a boundary_preservation_summary confirming which bounded terms were checked and that sharing evidence stays bounded to classroom review artifacts, and remediation_guidance suggesting replacement wording when violations are found. State explicitly that sharing readiness is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, not hosted sharing, not deployed sharing, and not platform success.
  expect:
    output_contains:
    - boundary_violation_report
    - boundary_preservation_summary
    - remediation_guidance
  timeout: 900000
assertions:
