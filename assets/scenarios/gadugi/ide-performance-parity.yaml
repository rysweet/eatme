      SOURCE_ASSET='assets/scenarios/eatme/ide-performance-parity.yaml'
      grep -F -- 'performance_checklist' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'execution_worksheet' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'evidence_summary_template' "$SOURCE_ASSET" >/dev/null
