  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/ide-performance-parity.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-ide-performance-parity}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"ide-performance-parity"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Large project scenario explicitly says 50+ entities.
      Large project scenario requires reviewers to record load time under threshold.
      Large project scenario asks whether the IDE remains usable after load.
      Complex animation scenario explicitly says 10 concurrent animations.
      Complex animation scenario requires reviewers to record frame rate.
      Complex animation scenario asks what interaction degrades first if the frame-rate target is missed.
      Output states that the scenario is not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/ide-performance-parity.yaml
    prompt: Act as an instructor acceptance agent preparing an IDE performance parity review. Produce a performance checklist, an execution worksheet, and an evidence summary template. The checklist must include a large project performance scenario with 50+ entities and a stated load-time threshold, plus a complex animation performance scenario with 10 concurrent animations and a stated frame-rate target. The worksheet must prompt reviewers to record the observed load time, whether the world remains navigable after loading, the observed frame rate during the 10 concurrent animations, and what interaction becomes unreliable first if the target is missed. The evidence summary must call out pass, borderline, and fail language while stating not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
  expect:
    output_contains:
    - performance_checklist
    - execution_worksheet
    - evidence_summary_template
  timeout: 900000
