      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/ide-performance-parity.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing an IDE performance parity review. Produce a performance checklist, an execution worksheet, and an evidence summary template. The checklist must include a large project performance scenario with 50+ entities and a stated load-time threshold, plus a complex animation performance scenario with 10 concurrent animations and a stated frame-rate target. The worksheet must prompt reviewers to record the observed load time, whether the world remains navigable after loading, the observed frame rate during the 10 concurrent animations, and what interaction becomes unreliable first if the target is missed. The evidence summary must call out pass, borderline, and fail language while stating not full user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.'
