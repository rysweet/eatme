# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Instructor Exercise Builder Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-exercise-builder.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-exercise-builder.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-exercise-builder}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-exercise-builder"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Exercise brief names exactly one primary Alice concept and one optional extension.
      Student success can be checked from visible world behavior and a short explanation.
      The artifact avoids brittle menu paths, exact coordinates, and hidden implementation details.
    asset: assets/scenarios/eatme/instructor-exercise-builder.yaml
    prompt: Act as an instructor acceptance agent. Using the resource_basis and persona goals in this YAML, draft a classroom-ready Alice exercise brief. The brief must name one target Alice concept, a starter world or code action, student choice points, hints, stretch options, and visible evidence students can submit. Keep all directions editable by a non-coder and avoid exact user interface coordinates.
  expect:
    output_contains:
    - exercise_brief
    - hint_ladder
    - student_evidence_checklist
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/instructor-exercise-builder.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/instructor-exercise-builder.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - creating-exercises
  - instructor-exercise-builder
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
