# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Instructor Exercise Builder Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-exercise-builder.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-exercise-builder}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/instructor-exercise-builder.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-exercise-builder"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-exercise-builder}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-exercise-builder.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent. Using the resource_basis and persona goals in this YAML, draft a classroom-ready Alice exercise brief. The brief must name one target Alice concept, a starter world or code action, student choice points, hints, stretch options, and visible evidence students can submit. Keep all directions editable by a non-coder and avoid exact user interface coordinates.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-exercise-builder.yaml'
      grep -F -- 'exercise_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'hint_ladder' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_evidence_checklist' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Exercise brief names exactly one primary Alice concept and one optional extension.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student success can be checked from visible world behavior and a short explanation.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'The artifact avoids brittle menu paths, exact coordinates, and hidden implementation details.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'exercise_brief'
      printf '%s\n' 'hint_ladder'
      printf '%s\n' 'student_evidence_checklist'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - exercise_brief
    - hint_ladder
    - student_evidence_checklist
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
metadata:
  source_eatme_asset: assets/scenarios/eatme/instructor-exercise-builder.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - creating-exercises
  - instructor-exercise-builder
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
