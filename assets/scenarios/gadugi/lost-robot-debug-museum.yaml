name: Eatme Lost Robot Debug Museum Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/lost-robot-debug-museum.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-lost-robot-debug-museum}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/lost-robot-debug-museum.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "lost-robot-debug-museum"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-lost-robot-debug-museum}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/lost-robot-debug-museum.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/lost-robot-debug-museum.yaml'
      grep -F -- 'debug_mystery_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_debug_journal' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'peer_question_checkpoint' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Debug mystery brief names expected tour stops and one observable wrong behavior without exposing hidden code details.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student debug journal prompts hypothesis before any edit and rerun evidence after the minimal change.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Peer question checkpoint asks the collaborative-peer-mentor to ask one question before the debugger concludes.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output connects reflective-debugger and collaborative-peer-mentor student personas to visible classroom evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'debug_mystery_brief'
      printf '%s\n' 'student_debug_journal'
      printf '%s\n' 'peer_question_checkpoint'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - debug_mystery_brief
    - student_debug_journal
    - peer_question_checkpoint
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
