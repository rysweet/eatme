# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Lost Robot Debug Museum Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/lost-robot-debug-museum.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/lost-robot-debug-museum.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-lost-robot-debug-museum}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"lost-robot-debug-museum"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Debug mystery brief names expected tour stops and one observable wrong behavior without exposing hidden code details.
      Student debug journal prompts hypothesis before any edit and rerun evidence after the minimal change.
      Peer question checkpoint asks the collaborative-peer-mentor to ask one question before the debugger concludes.
      Output connects reflective-debugger and collaborative-peer-mentor student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/lost-robot-debug-museum.yaml
    prompt: 'Act as an instructor acceptance agent preparing a debugging-mystery Alice mission. Produce a debug mystery brief, student debug journal, and peer question checkpoint grounded in the listed resources and this lost-robot-debug-museum scenario. The brief must describe expected tour stops and one observable wrong behavior discoverable from visible world output. The student debug journal must prompt: read the expected plan, run the world, record what went wrong, write one hypothesis, make one minimal change, rerun, and record what changed. The peer question checkpoint must ask a collaborative peer mentor to pose one clarifying question before the debugger shares a conclusion. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - debug_mystery_brief
    - student_debug_journal
    - peer_question_checkpoint
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/lost-robot-debug-museum.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/lost-robot-debug-museum.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - lost-robot-debug-museum
  - lost-robot-debug-museum
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
