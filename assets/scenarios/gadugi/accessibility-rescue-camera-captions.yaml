name: Eatme Accessibility Rescue — Camera and Captions Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires:
  - ALICE_HOME
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-accessibility-rescue-camera-captions}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"accessibility-rescue-camera-captions"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Accessibility audit card prompts identification of at least one camera framing gap.
      Accessibility audit card prompts identification of at least one caption or label gap.
      Camera rescue guide shows a concrete camera reframe or second-position example before the general framing.
      Caption and label template prompts an on-screen text label that states the essential message and pacing.
      Reflection prompt asks which viewer benefits most from each fix and what gap remains.
      Output notes that audio cues, high-contrast text, and simplified camera paths are valid accessibility rescue strategies.
      Optional audio cue extension is clearly optional and does not block learners who complete only the two-fix version.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml
    prompt: 'Act as an instructor acceptance agent preparing an accessibility rescue Alice lesson. Produce an accessibility audit card, a camera rescue guide, and a caption and label template grounded in the listed resources and this accessibility-rescue-camera-captions scenario. The accessibility audit card must prompt the student to review a starter scene and identify at least two accessibility gaps: at least one camera framing gap (such as an angle that hides key action from a viewer who cannot move closer) and at least one caption or label gap (such as spoken dialogue or an audio event with no visible text equivalent). The camera rescue guide must show one concrete example of reframing or adding a second camera position that makes obscured action visible, explain that any starter scene may replace the example, and state that the goal is to ensure a viewer who cannot rely on fine visual detail can follow the essential action. The caption and label template must prompt the student to add an on-screen text label for each identified caption gap, state what essential message the label conveys, and note that the label should match the pacing of the scene so it appears when the corresponding sound or action occurs. The reflection prompt must ask what each fix improved, which type of viewer benefits most from each fix, and what accessibility gap remains and why. Include a note that audio cues, high- contrast text, and simplified camera paths are all valid accessibility rescue strategies. Include an optional extension that shows how to identify a moment where an audio cue reinforces a visual event, and make clear that the extension does not block learners who complete only the two-fix version. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - accessibility_audit_card
    - camera_rescue_guide
    - caption_and_label_template
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml
    step: Run instructor agentic acceptance review
