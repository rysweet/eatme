name: Eatme Accessibility Rescue — Camera and Captions Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
  - ALICE_WEB_URL
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-accessibility-rescue-camera-captions}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "accessibility-rescue-camera-captions"'
  timeout: 60000
- name: Lookingglass Caption Evidence
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-accessibility-rescue-camera-captions}"
      set -e
      EATME_WEB_PLATFORM=1 ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_curriculum_e2e -- live_accessibility_rescue_camera_captions_exercises_caption_api --test-threads=1
      printf "%s\n" "cargo-test-ok=web_platform_curriculum_e2e"
  expect:
    exit_code: 0
    stdout_contains:
    - cargo-test-ok=web_platform_curriculum_e2e
    - 'test result: ok'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-accessibility-rescue-camera-captions}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/accessibility-rescue-camera-captions.yaml'
      grep -F -- 'accessibility_audit_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'camera_rescue_guide' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'caption_and_label_template' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'lookingglass_caption_api_evidence' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass /api/accessibility/rescue-camera-captions returns aria-live, camera, and scene-object caption checks for the web workflow.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Accessibility audit card prompts identification of at least one camera framing gap.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Accessibility audit card prompts identification of at least one caption or label gap.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Camera rescue guide shows a concrete camera reframe or second-position example before the general framing.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Caption and label template prompts an on-screen text label that states the essential message and pacing.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Reflection prompt asks which viewer benefits most from each fix and what gap remains.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output notes that audio cues, high-contrast text, and simplified camera paths are valid accessibility rescue strategies.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Optional audio cue extension is clearly optional and does not block learners who complete only the two-fix version.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'accessibility_audit_card'
      printf '%s\n' 'camera_rescue_guide'
      printf '%s\n' 'caption_and_label_template'
      printf '%s\n' 'lookingglass_caption_api_evidence'
      printf '%s\n' instructor-acceptance-contract-ok
