name: Eatme VR Player Comfort Playtest
description: Gadugi-compatible CLI scenario generated from assets/scenarios/eatme/vr-player-comfort-playtest.yaml. Alice desktop launch behavior remains owned by eatme; gadugi invokes eatme commands and checks manifest-level evidence only.
version: 1.0.0
config:
