    exit_code: 0
    stdout_contains: []
  timeout: 60000
- name: Launch Smoke
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-player-comfort-playtest}"
      EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke --alice-home ${ALICE_HOME} --run-id ${RUN_ID} --runs-dir runs --timeout 900 --json --no-memory --offline-package --scenario vr-player-comfort-playtest
  expect:
    exit_code: 0
    stdout_contains:
    - '"scenario_id": "vr-player-comfort-playtest"'
    - '"failure_category": null'
    - '"real_alice_execution_evidence": {'
    - '"startup_window_or_screenshot": {'
    - '"passed": true'
  timeout: 900000
assertions:
- name: validate-assets succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate Assets
- name: record-vr-player-preflight succeeds
