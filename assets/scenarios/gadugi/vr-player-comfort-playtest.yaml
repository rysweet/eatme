    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-player-comfort-playtest}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"scenario_asset_count": 61'
  timeout: 60000
- name: Record Vr Player Preflight
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-vr-player-comfort-playtest}"
      bash -lc 'if [ "${EATME_REAL_VR:-0}" = "1" ] && [ "${VR_HEADSET_AVAILABLE:-0}" = "1" ]; then printf "real_vr_available=true\nrequired_evidence=headset-or-player-capture,comfort-notes,observer-log,revision-note\n"; else printf "real_vr_available=false\nrequired_evidence=desktop-camera-view,orientation-note,comfort-check,fallback-playtest-sheet\n"; fi'
