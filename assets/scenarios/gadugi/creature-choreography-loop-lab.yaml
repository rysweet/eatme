name: Eatme Creature Choreography Loop Lab Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/creature-choreography-loop-lab.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/creature-choreography-loop-lab.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-creature-choreography-loop-lab}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"creature-choreography-loop-lab"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Lesson brief shows the no-loop motivating example before introducing the procedure-and-loop version.
      Loop-frame reference names the procedure, loop, and repeat count without referencing specific Alice character files.
      Student choreography card prompts a written prediction of the visible outcome before running.
      Student choreography card includes an observation log comparing prediction to what was seen after running.
      Output covers playful-tinkerer, creative-storyteller, and accessibility-advocate personas with visible classroom evidence.
      Optional extension is clearly optional and does not block novice success.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/creature-choreography-loop-lab.yaml
    prompt: Act as an instructor acceptance agent preparing a creature choreography loop lab Alice lesson. Produce a lesson brief, student choreography card, and loop-frame reference grounded in the listed resources and this creature-choreography-loop-lab scenario. The lesson brief must show a short motivating example of a creature performing a move step-by-step without a loop, explain what changes when a named procedure and loop are used instead, and introduce a loop-count frame the student sets before running. The student choreography card must prompt the student to name at least one dance move as a procedure, place that procedure inside a loop with a chosen repeat count, write a prediction of how the scene will look after the loop runs, run the world, and record what visible behavior matched or differed from the prediction. The loop-frame reference must name the procedure, the loop, and the repeat count without referencing specific Alice character files or exact asset names. Include a note that motion intensity and audio cues are adjustable for accessibility. Include an optional extension that shows how to apply the same procedure to a second creature or use a simple collection to drive the loop, and make clear that the extension does not block novice success. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
  expect:
    output_contains:
    - lesson_brief
    - student_choreography_card
    - loop_frame
  timeout: 900000
assertions:
