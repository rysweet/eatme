name: Eatme Creature Choreography Loop Lab Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/creature-choreography-loop-lab.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-creature-choreography-loop-lab}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/creature-choreography-loop-lab.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "creature-choreography-loop-lab"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-creature-choreography-loop-lab}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/creature-choreography-loop-lab.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/creature-choreography-loop-lab.yaml'
      grep -F -- 'lesson_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_choreography_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'loop_frame' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Lesson brief shows the no-loop motivating example before introducing the procedure-and-loop version.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Loop-frame reference names the procedure, loop, and repeat count without referencing specific Alice character files.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student choreography card prompts a written prediction of the visible outcome before running.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student choreography card includes an observation log comparing prediction to what was seen after running.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output covers playful-tinkerer, creative-storyteller, and accessibility-advocate personas with visible classroom evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Optional extension is clearly optional and does not block novice success.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'lesson_brief'
      printf '%s\n' 'student_choreography_card'
      printf '%s\n' 'loop_frame'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - lesson_brief
    - student_choreography_card
    - loop_frame
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
