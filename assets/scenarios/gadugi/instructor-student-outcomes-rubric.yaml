# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Instructor Student Outcomes Rubric Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-outcomes-rubric}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-student-outcomes-rubric"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Rubric has instructor-friendly levels and student-visible evidence.
      Feedback references visible Alice project behavior plus learner explanation.
      Outcome checks include creativity, debugging process, reflection, and accessibility/audience when relevant.
      Project discussion guide includes student evidence questions, an instructor boundary note, and a student-owned next revision.
      Output says the review is without claiming automated creative assessment, not learner-world grading, and not full user interface automation.
    asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
    prompt: Act as an instructor acceptance agent helping an instructor discuss a student Alice project. Produce a student outcomes rubric, feedback frame, revision next step, and project discussion guide. Include student evidence questions and an instructor boundary note. Ask for visible Alice project behavior, learner explanation, debugging/process evidence, reflection, and one student-owned next revision. Discuss creative communication as learner evidence without claiming automated creative assessment. State that this is not learner-world grading, not full user interface automation, not complete Alice coverage, and not a deployed service.
  expect:
    output_contains:
    - student_outcomes_rubric
    - feedback_frame
    - revision_next_step
    - project_discussion_guide
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - checking-student-outcomes-rubrics
  - instructor-student-outcomes-rubric
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
