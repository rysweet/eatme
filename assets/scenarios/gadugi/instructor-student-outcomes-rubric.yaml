      grep -F -- 'Feedback references visible Alice project behavior plus learner explanation.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Outcome checks include creativity, debugging process, reflection, and accessibility/audience when relevant.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Project discussion guide includes student evidence questions, an instructor boundary note, and a student-owned next revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output says the review is without claiming automated creative assessment, not learner-world grading, and not full user interface automation.' "$SOURCE_ASSET" >/dev/null
