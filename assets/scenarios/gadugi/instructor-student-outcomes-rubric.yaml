- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-outcomes-rubric}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent helping an instructor discuss a student Alice project. Produce a student outcomes rubric, feedback frame, revision next step, and project discussion guide. Include student evidence questions and an instructor boundary note. Ask for visible Alice project behavior, learner explanation, debugging/process evidence, reflection, and one student-owned next revision. Discuss creative communication as learner evidence without claiming automated creative assessment. State that this is not learner-world grading, not full user interface automation, not complete Alice coverage, and not a deployed service.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml'
      grep -F -- 'student_outcomes_rubric' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'feedback_frame' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'revision_next_step' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'project_discussion_guide' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
