name: Eatme Instructor Student Outcomes Rubric Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-outcomes-rubric}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-student-outcomes-rubric"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Rubric has instructor-friendly levels and student-visible evidence.
      Feedback references artifact behavior plus student explanation.
      Outcome checks include creativity, debugging process, reflection, and accessibility/audience when relevant.
    asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
    prompt: Act as an instructor acceptance agent reviewing student outcomes. Produce a simple rubric and feedback frame for an Alice artifact. Grade concept evidence, creative communication, debugging/process, and reflection. Ask for observable artifact behavior and student explanation; do not reward visual polish alone.
  expect:
    output_contains:
    - student_outcomes_rubric
    - feedback_frame
    - revision_next_step
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/instructor-student-outcomes-rubric.yaml
