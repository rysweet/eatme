# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Time Travel Recipe Sequencing Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/time-travel-recipe-sequencing.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/time-travel-recipe-sequencing.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-time-travel-recipe-sequencing}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"time-travel-recipe-sequencing"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Lesson brief shows at least three named procedure calls in a deliberate order before explaining sequencing.
      Step-sequence frame names each step as a procedure call without referencing specific Alice assets.
      Student activity sheet prompts a written prediction of scene state after each step before any test run.
      Student activity sheet includes a step-swap exercise that asks the student to predict and then record the changed outcome.
      Output connects curious-novice and systems-puzzle-solver student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/time-travel-recipe-sequencing.yaml
    prompt: Act as an instructor acceptance agent preparing a time-travel recipe sequencing Alice lesson. Produce a lesson brief, student activity sheet, and step-sequence frame grounded in the listed resources and this time-travel-recipe-sequencing scenario. The lesson brief must show a short motivating example of three named procedure calls running in order, explain why top-to-bottom sequence matters, and include a step-swap exercise that asks students to predict how swapping two calls changes the visible outcome. The student activity sheet must prompt the student to name at least three recipe steps, write the steps in a deliberate order, record a written prediction of what the scene will look like after each step, run the sequence, then swap two steps and record what changed. The step-sequence frame must name each step as a procedure call without referencing specific Alice assets or character models. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
  expect:
    output_contains:
    - lesson_brief
    - student_activity_sheet
    - step_sequence_frame
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/time-travel-recipe-sequencing.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/time-travel-recipe-sequencing.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - time-travel-recipe-sequencing
  - time-travel-recipe-sequencing
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
