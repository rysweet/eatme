name: "Eatme Modified Class Portability Smoke"
description: |
  Gadugi-compatible CLI scenario for the modified class portability lane. An
  instructor/student agent authors the export/import/share story, but Alice
  desktop launch behavior remains owned by eatme; gadugi invokes eatme commands
  and checks manifest plus portability evidence only.
version: "1.0.0"

config:
  timeout: 1800000
  retries: 0
  parallel: false

environment:
  requires:
    - ALICE_HOME
    - EATME_REAL_ALICE
    - EATME_REPO
  optional:
    - RUN_ID

agents:
  - name: "eatme-cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: .
      timeout: 1800000
      capture_output: true

steps:
  - name: "Validate editable Alice scenario assets"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: 'cd "${EATME_REPO:-.}" && cargo run -q -p eatme-cli -- assets validate --json'
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"scenario_asset_count": 16'
    timeout: 60000

  - name: "Validate modified class portability contract"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: 'cd "${EATME_REPO:-.}" && cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/modified-class-portability.yaml --json'
    expect:
      exit_code: 0
      stdout_contains:
        - '"passed": true'
        - '"id": "modified-class-portability"'
    timeout: 60000

  - name: "Launch modified class portability lane under Xvfb"
    agent: "eatme-cli-agent"
    action: "execute_command"
    params:
      command: |
        cd "${EATME_REPO:-.}"
        export RUN_ID="${RUN_ID:-gadugi-modified-class-portability}"
        EATME_REAL_ALICE=1 cargo run -q -p eatme-cli -- alice launch-smoke \
          --alice-home "${ALICE_HOME}" \
          --run-id "${RUN_ID}" \
          --runs-dir runs \
          --timeout 900 \
          --json \
          --no-memory \
          --offline-package \
          --scenario modified-class-portability
    expect:
      exit_code: 0
      stdout_contains:
        - '"scenario_id": "modified-class-portability"'
        - '"failure_category": null'
        - '"startup_window_or_screenshot": {'
        - '"passed": true'
    timeout: 1800000

assertions:
  - name: "Assets Validate"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Validate editable Alice scenario assets"

  - name: "Portability Contract Validates"
    type: "output_contains_all"
    agent: "eatme-cli-agent"
    params:
      step: "Validate modified class portability contract"
      required_strings:
        - '"id": "modified-class-portability"'
        - '"passed": true'

  - name: "Modified Class Portability Launches"
    type: "command_success"
    agent: "eatme-cli-agent"
    params:
      step: "Launch modified class portability lane under Xvfb"

metadata:
  tags:
    - "alice"
    - "eatme"
    - "desktop"
    - "xvfb"
    - "modified-class"
    - "export-import-share"
    - "outside-in"
  priority: "critical"
  author: "eatme"
  test_type: "launch-smoke"
