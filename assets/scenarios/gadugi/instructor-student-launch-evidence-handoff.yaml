# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Instructor Student Launch Evidence Handoff Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
  - ALICE_WEB_URL
  - ALICE_LOCAL_API_TOKEN
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-student-launch-evidence-handoff"'
  timeout: 60000
- name: Lookingglass Setup Readiness
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      set -e
      EATME_WEB_PLATFORM=1 ALICE_LOCAL_API_TOKEN=${ALICE_LOCAL_API_TOKEN:-gadugi-local-api-token} EATME_SETUP_READINESS_SCENARIO=instructor-student-launch-evidence-handoff ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
      printf "%s\n" "cargo-test-ok=web_platform_setup_readiness_e2e"
  expect:
    exit_code: 0
    stdout_contains:
    - cargo-test-ok=web_platform_setup_readiness_e2e
    - 'test result: ok'
  timeout: 300000
- name: Agentic Student Handoff Output
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      cargo run -q -p eatme-cli -- assets instructor-agentic-output --path assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-student-launch-evidence-handoff"'
    - real_alice_evidence_handoff_card
    - instructor_readiness_note
    - student_action_prompt
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing a classroom handoff after eatme has collected real Alice launch evidence. Produce a real Alice evidence handoff card, instructor readiness note, and student action prompt grounded in the listed resources and this scenario. Name which evidence comes from the manifest, log, window list, screenshot, and ui-action-contract.json. Separate environment readiness from student project behavior. Ask students to record one Alice action, the visible result after running, and one next revision. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml'
      grep -F -- 'real_alice_evidence_handoff_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'instructor_readiness_note' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_action_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Handoff card names manifest, log, window-list, screenshot, and ui-action-contract.json as evidence inputs.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Readiness note separates environment launch evidence from student project behavior.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student action prompt asks for one Alice action, visible run result, and one next revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output says this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'real_alice_evidence_handoff_card'
      printf '%s\n' 'instructor_readiness_note'
      printf '%s\n' 'student_action_prompt'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - real_alice_evidence_handoff_card
    - instructor_readiness_note
    - student_action_prompt
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: lookingglass-setup-readiness succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Lookingglass Setup Readiness
- name: agentic-student-handoff-output succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Agentic Student Handoff Output
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
metadata:
  source_eatme_asset: assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - instructor-student-launch-evidence-handoff
  - instructor-student-launch-evidence-handoff
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
