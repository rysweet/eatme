name: Eatme Instructor Student Launch Evidence Handoff Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-student-launch-evidence-handoff"'
  timeout: 60000
- name: Lookingglass Setup Readiness
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-student-launch-evidence-handoff}"
      EATME_WEB_PLATFORM=1 EATME_SETUP_READINESS_SCENARIO=instructor-student-launch-evidence-handoff ALICE_WEB_URL=${ALICE_WEB_URL:-http://localhost:3099} cargo test -p eatme-alice --test web_platform_setup_readiness_e2e -- --test-threads=1
  expect:
    exit_code: 0
    stdout_contains: []
  timeout: 300000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Handoff card names manifest, log, window-list, screenshot, and ui-action-contract.json as evidence inputs.
      Readiness note separates environment launch evidence from student project behavior.
      Student action prompt asks for one Alice action, visible run result, and one next revision.
      Output says this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
    asset: assets/scenarios/eatme/instructor-student-launch-evidence-handoff.yaml
    prompt: Act as an instructor acceptance agent preparing a classroom handoff after eatme has collected real Alice launch evidence. Produce a real Alice evidence handoff card, instructor readiness note, and student action prompt grounded in the listed resources and this scenario. Name which evidence comes from the manifest, log, window list, screenshot, and ui-action-contract.json. Separate environment readiness from student project behavior. Ask students to record one Alice action, the visible result after running, and one next revision. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
  expect:
    output_contains:
    - real_alice_evidence_handoff_card
    - instructor_readiness_note
    - student_action_prompt
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: lookingglass-setup-readiness succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
