name: Eatme Curriculum Sequence Remix Pack Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-curriculum-sequence-remix-pack}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "curriculum-sequence-remix-pack"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-curriculum-sequence-remix-pack}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing an Alice curriculum sequence remix pack. Produce a curriculum sequence map, lesson sequence remix pack, and student evidence plan grounded in the listed resources and this curriculum-sequence-remix-pack scenario. Reference at least three committed Alice scenario assets, name the prerequisite or concept progression between them, identify pacing and teacher swap points, and describe visible student evidence at each checkpoint. Include fallback or extension notes for uneven device readiness and prior knowledge. Keep language editable and classroom-facing. State explicitly that this is not full UI automation, not creative assessment, not learner-world grading, and not proof that a whole course has been delivered.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml'
      grep -F -- 'curriculum_sequence_map' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'lesson_sequence_remix_pack' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_evidence_plan' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Curriculum sequence map references at least three committed Alice scenario assets and explains concept progression between them.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Lesson sequence remix pack names prerequisites, pacing, teacher swap points, fallback notes, and extension choices.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student evidence plan names visible student evidence at each checkpoint, not just lesson titles, screenshots, or exact user interface steps.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output keeps the sequence editable by curriculum staff without requiring Rust changes or hidden implementation details.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full UI automation, not creative assessment, not learner-world grading, and not proof that a whole course has been delivered.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'curriculum_sequence_map'
      printf '%s\n' 'lesson_sequence_remix_pack'
      printf '%s\n' 'student_evidence_plan'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - curriculum_sequence_map
    - lesson_sequence_remix_pack
    - student_evidence_plan
    - instructor-acceptance-contract-ok
  timeout: 60000
