# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Curriculum Sequence Remix Pack Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-curriculum-sequence-remix-pack}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"curriculum-sequence-remix-pack"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Curriculum sequence map references at least three committed Alice scenario assets and explains concept progression between them.
      Lesson sequence remix pack names prerequisites, pacing, teacher swap points, fallback notes, and extension choices.
      Student evidence plan names visible student evidence at each checkpoint, not just lesson titles, screenshots, or exact user interface steps.
      Output keeps the sequence editable by curriculum staff without requiring Rust changes or hidden implementation details.
      Output states the scenario is not full UI automation, not creative assessment, not learner-world grading, and not proof that a whole course has been delivered.
    asset: assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml
    prompt: Act as an instructor acceptance agent preparing an Alice curriculum sequence remix pack. Produce a curriculum sequence map, lesson sequence remix pack, and student evidence plan grounded in the listed resources and this curriculum-sequence-remix-pack scenario. Reference at least three committed Alice scenario assets, name the prerequisite or concept progression between them, identify pacing and teacher swap points, and describe visible student evidence at each checkpoint. Include fallback or extension notes for uneven device readiness and prior knowledge. Keep language editable and classroom-facing. State explicitly that this is not full UI automation, not creative assessment, not learner-world grading, and not proof that a whole course has been delivered.
  expect:
    output_contains:
    - curriculum_sequence_map
    - lesson_sequence_remix_pack
    - student_evidence_plan
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/curriculum-sequence-remix-pack.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - curriculum-sequence-remix-pack
  - curriculum-sequence-remix-pack
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
