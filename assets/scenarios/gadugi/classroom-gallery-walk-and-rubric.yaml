description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/classroom-gallery-walk-and-rubric.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
