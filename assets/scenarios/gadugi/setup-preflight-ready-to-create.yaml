    - 'test result: ok'
  timeout: 300000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Setup readiness checklist names OS-level conditions, Java and OpenGL requirements, install permission considerations, and the Chromebook Linux access case.
      Student self-check card prompts each student to write one thing they can do now in Alice.
      Student self-check card prompts each student to write one specific blocker if setup fails, framed as an environment problem.
      Fallback path guide describes at least two no-install options including a pairing option.
      Handoff note instructs the instructor to address every reported blocker before the first creation task begins.
      Output notes that checklist requirements are based on the Alice download page and may need updating for new Alice versions.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/setup-preflight-ready-to-create.yaml
    prompt: 'Act as an instructor acceptance agent preparing a setup preflight Alice lesson. Produce a setup readiness checklist, student self-check card, and fallback path guide grounded in the listed resources and this setup-preflight-ready-to-create scenario. The setup readiness checklist must name the OS-level conditions Alice requires, identify the Java and OpenGL dependency versions or minimums cited on the Alice download page, note the install permission consideration for school-managed devices, and include the Chromebook Linux access case as a distinct item. The student self-check card must prompt each student to attempt an Alice launch or installation, write one sentence stating what they can do right now in Alice, and write one sentence naming one specific blocker if Alice did not launch — framing the blocker as an environment problem, not a student mistake. The fallback path guide must describe at least two no-install options: a pairing option where a student without a working device works alongside a partner who has one, and either an instructor-led demo option or a printed design-planning option that lets the student complete the creative thinking portion of the lesson without a working device. The handoff note must tell the instructor to collect every reported blocker and address each one before the first creation task begins. Include a note that the readiness checklist items are based on the Alice download page requirements and may need updating when a new Alice version changes system requirements. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
