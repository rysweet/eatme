# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Weather Wizard Conditional Theater Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/weather-wizard-conditional-theater.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/weather-wizard-conditional-theater.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-weather-wizard-conditional-theater}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"weather-wizard-conditional-theater"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Lesson brief frames each conditional as "If the world state is X, characters respond with Y."
      State-table frame covers at least two weather states with distinct visible character or camera behavior.
      Student activity sheet prompts a written prediction before any test run.
      Student activity sheet prompts recording of observed visible behavior after the run.
      Output connects creative-storyteller and playful-tinkerer student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/weather-wizard-conditional-theater.yaml
    prompt: 'Act as an instructor acceptance agent preparing a weather-reactive Alice lesson. Produce a lesson brief, student activity sheet, and starter state-table frame grounded in the listed resources and this weather-wizard-conditional-theater scenario. The lesson brief must frame each conditional as "If the world state is X, characters respond with Y" and provide a starter table of two or more weather states with corresponding character responses and audience clues. The student activity sheet must prompt: choose at least two weather states, write one conditional branch for each, predict which branch will run before testing, run the world, and record what visible behavior changed. The state-table frame must cover at least sunny and rainy states without requiring specific Alice assets. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - lesson_brief
    - student_activity_sheet
    - state_table_frame
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/weather-wizard-conditional-theater.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/weather-wizard-conditional-theater.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - weather-wizard-conditional-theater
  - weather-wizard-conditional-theater
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
