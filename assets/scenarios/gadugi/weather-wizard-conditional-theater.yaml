name: Eatme Weather Wizard Conditional Theater Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/weather-wizard-conditional-theater.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-weather-wizard-conditional-theater}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/weather-wizard-conditional-theater.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "weather-wizard-conditional-theater"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-weather-wizard-conditional-theater}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/weather-wizard-conditional-theater.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/weather-wizard-conditional-theater.yaml'
      grep -F -- 'lesson_brief' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_activity_sheet' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'state_table_frame' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Lesson brief frames each conditional as "If the world state is X, characters respond with Y."' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'State-table frame covers at least two weather states with distinct visible character or camera behavior.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student activity sheet prompts a written prediction before any test run.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student activity sheet prompts recording of observed visible behavior after the run.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output connects creative-storyteller and playful-tinkerer student personas to visible classroom evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'lesson_brief'
      printf '%s\n' 'student_activity_sheet'
      printf '%s\n' 'state_table_frame'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - lesson_brief
    - student_activity_sheet
    - state_table_frame
    - instructor-acceptance-contract-ok
  timeout: 60000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Acceptance Review Contract Is Runnable
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate instructor acceptance review contract
