name: Eatme Alien Linguist Parameter Dialogue Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/alien-linguist-parameter-dialogue.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
  - ALICE_WEB_URL
  - EATME_SETUP_READINESS_SCENARIO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/alien-linguist-parameter-dialogue.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-alien-linguist-parameter-dialogue}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"alien-linguist-parameter-dialogue"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.
      Lesson brief shows repeated greeting code before introducing the parameter.
      Greeting parameter frame names the parameter and at least two argument examples.
      Student activity sheet prompts a written prediction before each test run.
      Student activity sheet prompts recording of observed visible behavior after the run.
      Output connects curious-novice and creative-storyteller student personas to visible classroom evidence.
      Output states the scenario is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/alien-linguist-parameter-dialogue.yaml
    prompt: 'Act as an instructor acceptance agent preparing an alien-greeting Alice lesson. Produce a lesson brief, student activity sheet, and greeting parameter frame grounded in the listed resources and this alien-linguist-parameter-dialogue scenario. The lesson brief must show a short duplicated-greeting example first, then ask what should vary, then introduce a reusable procedure with one parameter such as alien name, direction, color, distance, or emotion. The student activity sheet must prompt: choose at least two alien visitors with invented names or traits, write one reusable greeting procedure with a named parameter, call the procedure at least twice with different arguments, predict what will be visible for each call before running, run the world, and record what visible behavior changed. The greeting parameter frame must name the parameter, name the caller, and list at least two argument examples without requiring specific Alice assets. State explicitly that this is not full user interface automation, not automated creative assessment, not learner-world grading, and not complete Alice coverage.'
  expect:
    output_contains:
    - lesson_brief
    - student_activity_sheet
    - greeting_parameter_frame
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/alien-linguist-parameter-dialogue.yaml
    step: Run instructor agentic acceptance review
