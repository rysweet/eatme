name: Eatme Student Reflection Artifact Review Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/student-reflection-artifact-review.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/student-reflection-artifact-review.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-student-reflection-artifact-review}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"student-reflection-artifact-review"'
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Reflection evidence card asks for one Alice action, visible artifact behavior, run result, and next revision.
      Instructor review note references artifact behavior and learner explanation before suggesting a revision.
      Student revision prompt keeps learner ownership and names one small change the student can test.
      Output states the scenario is not full user interface automation, not creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
    asset: assets/scenarios/eatme/student-reflection-artifact-review.yaml
    prompt: Act as an instructor acceptance agent reviewing one student learning artifact after the student used Alice. Produce a reflection evidence card, instructor review note, and student revision prompt grounded in the listed resources and this student-reflection-artifact-review scenario. Require the student to explain one Alice action, the visible artifact behavior it caused, what changed after running, and one learner-owned next revision. Review artifact behavior and learner explanation; do not use visual polish alone. State explicitly that this is not full user interface automation, not creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.
  expect:
    output_contains:
    - student_reflection_evidence_card
    - instructor_review_note
    - student_revision_prompt
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/student-reflection-artifact-review.yaml
    step: Run instructor agentic acceptance review
metadata:
  source_eatme_asset: assets/scenarios/eatme/student-reflection-artifact-review.yaml
