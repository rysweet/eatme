- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-student-reflection-artifact-review}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/student-reflection-artifact-review.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent reviewing one student learning artifact after the student used Alice. Produce a reflection evidence card, instructor review note, and student revision prompt grounded in the listed resources and this student-reflection-artifact-review scenario. Require the student to explain one Alice action, the visible artifact behavior it caused, what changed after running, and one learner-owned next revision. Review artifact behavior and learner explanation; do not use visual polish alone. State explicitly that this is not full user interface automation, not creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/student-reflection-artifact-review.yaml'
      grep -F -- 'student_reflection_evidence_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'instructor_review_note' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_revision_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Reflection evidence card asks for one Alice action, visible artifact behavior, run result, and next revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Instructor review note references artifact behavior and learner explanation before suggesting a revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student revision prompt keeps learner ownership and names one small change the student can test.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full user interface automation, not creative assessment, not learner-world grading, not complete Alice coverage, and not a deployed service.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'student_reflection_evidence_card'
      printf '%s\n' 'instructor_review_note'
      printf '%s\n' 'student_revision_prompt'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
