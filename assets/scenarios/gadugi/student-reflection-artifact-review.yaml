steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-student-reflection-artifact-review}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/student-reflection-artifact-review.yaml --json
  expect:
