description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/student-reflection-artifact-review.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
