steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-teacher-community-sharing-loop}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/teacher-community-sharing-loop.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "teacher-community-sharing-loop"'
  timeout: 60000
- name: Verify Lookingglass Teacher Share Package
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-teacher-community-sharing-loop}"
      cd "${LOOKINGGLASS_HOME:?}" && npm test -- test/project-export.test.ts test/server.test.ts
  expect:
    exit_code: 0
    stdout_contains:
    - test/project-export.test.ts
    - test/server.test.ts
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-teacher-community-sharing-loop}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/teacher-community-sharing-loop.yaml' --json
      SOURCE_ASSET='assets/scenarios/eatme/teacher-community-sharing-loop.yaml'
      grep -F -- 'teacher_community_share_card' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'classroom_handoff_note' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'remix_feedback_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Teacher-community share card includes audience, prerequisites, timing, classroom constraints, attribution, editable scenario and persona links, and student evidence.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Classroom handoff note tells the next teacher what to prepare, what learners produce, what support signals to watch, and what can be adapted.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Remix feedback prompt asks for classroom fit, learner evidence, accessibility notes, and one suggested revision.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output keeps the sharing artifact teacher-facing and editable without requiring Rust changes or hidden implementation details.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full UI automation, not creative assessment, not learner-world grading, not complete Alice coverage, and not an external cloud community platform.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass package evidence writes alice-web.teacher-share/v1 metadata to share.json and validates teacher-share-metadata without claiming an external cloud community platform.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass /api/project/export/web-package and /api/project/share preserve teacher-share metadata in the package/share artifacts.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass /api/community/shares validates a web package and records alice-web-local-community publication evidence with community-platform-recorded and teacher-share-metadata evidence.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'teacher_community_share_card'
      printf '%s\n' 'classroom_handoff_note'
      printf '%s\n' 'remix_feedback_prompt'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
