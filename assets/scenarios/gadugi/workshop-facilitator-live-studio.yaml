# DO NOT EDIT: generated by eatme-assets from canonical eatme scenario assets.
# Non-coders: edit the matching source YAML under assets/scenarios/eatme/, then ask a maintainer to run `eatme assets generate-gadugi`.
name: Eatme Workshop Facilitator Live Studio Agentic Flow
description: Gadugi-compatible instructor QA adapter generated from assets/scenarios/eatme/workshop-facilitator-live-studio.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-qa-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"workshop-facilitator-live-studio"'
  timeout: 60000
- name: Run instructor agentic QA review
  agent: instructor-qa-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Facilitation plan has launch/readiness, make/run/revise checkpoints, helper roles, and showcase timing.
      Workshop board names participant evidence, stuck signals, recovery moves, and optional extension choices.
      Share-out prompt asks for one visible behavior, one help or revision moment, and one next small change.
      Output explicitly connects workshop-facilitator and student personas to reviewable scenario evidence.
      Output avoids comprehensive interface automation, machine-scored creativity, automatic grading of student worlds, and exhaustive Alice coverage claims.
    asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
    prompt: Act as an instructor QA agent preparing an Alice live-studio workshop. Produce a two-hour facilitation plan, participant checkpoint board, and showcase notes grounded in the listed resources and this workshop-facilitator-live-studio scenario. Include launch/readiness checks, timeboxed milestones, helper roles, stuck signals, recovery moves for setup or pacing issues, a minimum runnable artifact, optional extension choices, peer feedback, showcase timing, and one reflection prompt. Keep language editable and workshop-facing. Do not claim comprehensive interface automation, machine-scored creativity, automatic grading of student worlds, or exhaustive Alice coverage.
  expect:
    output_contains:
    - facilitation_plan
    - participant_checkpoint_board
    - showcase_notes
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Review Covers Probes
  type: agentic_acceptance
  agent: instructor-qa-agent
  params:
    asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
    step: Run instructor agentic QA review
metadata:
  source_eatme_asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
  generated_by: eatme-assets gadugi adapter generator
  tags:
  - alice
  - eatme
  - gadugi
  - outside-in
  - instructor
  - agentic
  - facilitating-live-studio-workshops
  - workshop-facilitator-live-studio
  priority: high
  author: eatme
  test_type: instructor-agentic-flow
