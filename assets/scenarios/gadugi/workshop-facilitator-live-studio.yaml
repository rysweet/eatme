name: Eatme Workshop Facilitator Live Studio Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/workshop-facilitator-live-studio.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires:
  - LOOKINGGLASS_HOME
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-acceptance-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/workshop-facilitator-live-studio.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "workshop-facilitator-live-studio"'
  timeout: 60000
- name: Verify Lookingglass Live Studio Runtime
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      cd "${LOOKINGGLASS_HOME:?}" && npm test -- test/runtime-parity-evidence.test.ts test/server.test.ts
  expect:
    exit_code: 0
    stdout_contains:
    - test/runtime-parity-evidence.test.ts
    - test/server.test.ts
  timeout: 60000
- name: Run instructor agentic acceptance review
  agent: instructor-acceptance-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Facilitation plan has a setup checklist, timing plan, make/run/revise checkpoints, helper roles, and share-out support.
      Observation-intervention guide names observation points, intervention cues, stuck patterns, and recovery moves for setup or pacing issues.
      Participant checkpoint board names checkpoint artifacts, help signals, optional extension choices, and student share-out artifacts.
      Student prompt cards ask for one visible behavior, one help signal, one peer feedback exchange, one revision behavior, and one reflection.
      Real Alice action evidence notes ask students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice.
      Instructor-facing acceptance probes check the facilitation plan, student prompt cards, checkpoint board, revision-reflection log, and showcase notes.
      LookingGlass /api/workshops/live-studio/start creates a synchronized facilitator session, /participants updates the participant roster revision, /handoff creates a live workshop handoff packet, and /api/review/runtime-parity reports liveStudioSupported true.
      Output explicitly connects workshop-facilitator and student personas to reviewable scenario evidence without taking ownership of learner artifacts.
      Output states the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
    asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
    prompt: Act as an instructor acceptance agent preparing an Alice live-studio workshop. Produce a two-hour facilitation plan, timing plan, observation-intervention guide, participant checkpoint board, student prompt cards, help signal board, peer feedback notes, revision-reflection log, share-out artifacts, real Alice action evidence notes, instructor acceptance probe notes, and showcase notes grounded in the listed resources and this workshop-facilitator-live-studio scenario. Include a setup checklist, observation points, intervention cues, checkpoint artifacts, share-out support, instructor-facing acceptance probes, help signals, peer feedback, revision behavior, reflection, student-facing prompt cards, and student-owned Alice action evidence that asks students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice. Keep language editable and workshop-facing. State explicitly that the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.
  expect:
    output_contains:
    - facilitation_plan
    - timing_plan
    - observation_intervention_guide
    - participant_checkpoint_board
    - student_prompt_cards
    - help_signal_board
    - peer_feedback_notes
    - revision_reflection_log
    - share_out_artifacts
    - real_alice_action_evidence_notes
    - instructor_acceptance_probe_notes
    - showcase_notes
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: verify-lookingglass-live-studio-runtime succeeds
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Verify Lookingglass Live Studio Runtime
- name: Instructor Agentic Acceptance Review Covers Probes
  type: agentic_acceptance
  agent: instructor-acceptance-agent
  params:
    asset: assets/scenarios/eatme/workshop-facilitator-live-studio.yaml
    step: Run instructor agentic acceptance review
