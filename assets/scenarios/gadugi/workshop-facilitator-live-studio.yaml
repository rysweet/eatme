name: Eatme Workshop Facilitator Live Studio Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/workshop-facilitator-live-studio.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires:
  - LOOKINGGLASS_HOME
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/workshop-facilitator-live-studio.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "workshop-facilitator-live-studio"'
  timeout: 60000
- name: Verify Lookingglass Live Studio Runtime
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      cd "${LOOKINGGLASS_HOME:?}" && npm test -- test/runtime-parity-evidence.test.ts test/server.test.ts
  expect:
    exit_code: 0
    stdout_contains:
    - test/runtime-parity-evidence.test.ts
    - test/server.test.ts
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-workshop-facilitator-live-studio}"
      set -euo pipefail
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/workshop-facilitator-live-studio.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent preparing an Alice live-studio workshop. Produce a two-hour facilitation plan, timing plan, observation-intervention guide, participant checkpoint board, student prompt cards, help signal board, peer feedback notes, revision-reflection log, share-out artifacts, real Alice action evidence notes, instructor acceptance probe notes, and showcase notes grounded in the listed resources and this workshop-facilitator-live-studio scenario. Include a setup checklist, observation points, intervention cues, checkpoint artifacts, share-out support, instructor-facing acceptance probes, help signals, peer feedback, revision behavior, reflection, student-facing prompt cards, and student-owned Alice action evidence that asks students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice. Keep language editable and workshop-facing. State explicitly that the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/workshop-facilitator-live-studio.yaml'
      grep -F -- 'facilitation_plan' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'timing_plan' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'observation_intervention_guide' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'participant_checkpoint_board' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'student_prompt_cards' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'help_signal_board' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'peer_feedback_notes' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'revision_reflection_log' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'share_out_artifacts' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'real_alice_action_evidence_notes' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'instructor_acceptance_probe_notes' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'showcase_notes' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Facilitation plan has a setup checklist, timing plan, make/run/revise checkpoints, helper roles, and share-out support.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Observation-intervention guide names observation points, intervention cues, stuck patterns, and recovery moves for setup or pacing issues.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Participant checkpoint board names checkpoint artifacts, help signals, optional extension choices, and student share-out artifacts.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Student prompt cards ask for one visible behavior, one help signal, one peer feedback exchange, one revision behavior, and one reflection.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Real Alice action evidence notes ask students to add or adjust one visible behavior in Alice, run it, record the observed result, and revise one small choice.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Instructor-facing acceptance probes check the facilitation plan, student prompt cards, checkpoint board, revision-reflection log, and showcase notes.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass /api/workshops/live-studio/start creates a synchronized facilitator session, /participants updates the participant roster revision, /handoff creates a live workshop handoff packet, and /api/review/runtime-parity reports liveStudioSupported true.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output explicitly connects workshop-facilitator and student personas to reviewable scenario evidence without taking ownership of learner artifacts.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Output states the scenario is not full Alice user interface automation, not creative assessment, not learner-world grading, and not complete Alice coverage.' "$SOURCE_ASSET" >/dev/null
      grep -Fi -- 'instructor-facing acceptance probes' "$SOURCE_ASSET" >/dev/null
      grep -Fi -- 'student-owned Alice action evidence' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'facilitation_plan'
      printf '%s\n' 'timing_plan'
      printf '%s\n' 'observation_intervention_guide'
      printf '%s\n' 'participant_checkpoint_board'
      printf '%s\n' 'student_prompt_cards'
      printf '%s\n' 'help_signal_board'
      printf '%s\n' 'peer_feedback_notes'
      printf '%s\n' 'revision_reflection_log'
      printf '%s\n' 'share_out_artifacts'
      printf '%s\n' 'real_alice_action_evidence_notes'
      printf '%s\n' 'instructor_acceptance_probe_notes'
      printf '%s\n' 'showcase_notes'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - facilitation_plan
    - timing_plan
    - observation_intervention_guide
    - participant_checkpoint_board
    - student_prompt_cards
    - help_signal_board
    - peer_feedback_notes
    - revision_reflection_log
    - share_out_artifacts
