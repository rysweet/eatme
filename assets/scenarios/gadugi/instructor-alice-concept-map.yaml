name: Eatme Instructor Alice Concept Map Agentic Flow
description: Gadugi-compatible instructor acceptance adapter generated from assets/scenarios/eatme/instructor-alice-concept-map.yaml. It validates the editable scenario contract and runnable evidence steps so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - RUN_ID
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-alice-concept-map}"
      cargo run -q -p eatme-cli -- assets validate --path assets/scenarios/eatme/instructor-alice-concept-map.yaml --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"id": "instructor-alice-concept-map"'
  timeout: 60000
- name: Validate instructor acceptance review contract
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-alice-concept-map}"
      cargo run -q -p eatme-cli -- assets validate --path 'assets/scenarios/eatme/instructor-alice-concept-map.yaml' --json
      AGENTIC_TEST_PROMPT='Act as an instructor acceptance agent building a concept map. Given an Alice lesson idea, produce a concept ladder from visible world behavior to Alice vocabulary to transferable computer science vocabulary. Include misconception checks, one prediction question, one debugging question, and one transfer prompt. Prefer agent reasoning over code assertions.'
      printf '%s\n' "$AGENTIC_TEST_PROMPT" >/dev/null
      SOURCE_ASSET='assets/scenarios/eatme/instructor-alice-concept-map.yaml'
      grep -F -- 'concept_map' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'misconception_checks' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'transfer_prompt' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'LookingGlass validation uses ALICE_WEB_URL and /api/ responses when the web workflow is supported.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Concept map has visible behavior, Alice vocabulary, CS vocabulary, and misconception columns.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Prediction and debugging questions are answerable from the student artifact.' "$SOURCE_ASSET" >/dev/null
      grep -F -- 'Transfer prompt helps students bridge Alice to text-based programming.' "$SOURCE_ASSET" >/dev/null
      printf '%s\n' 'concept_map'
      printf '%s\n' 'misconception_checks'
      printf '%s\n' 'transfer_prompt'
      printf '%s\n' instructor-acceptance-contract-ok
  expect:
    exit_code: 0
    stdout_contains:
    - concept_map
    - misconception_checks
    - transfer_prompt
    - instructor-acceptance-contract-ok
