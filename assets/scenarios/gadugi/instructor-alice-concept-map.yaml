name: Eatme Instructor Alice Concept Map Agentic Flow
description: Gadugi-compatible instructor QA adapter generated from assets/scenarios/eatme/instructor-alice-concept-map.yaml. It keeps the scenario at the editable asset and agentic evidence boundary so non-coders can maintain prompts, probes, and rubrics without changing Rust.
version: 1.0.0
config:
  timeout: 900000
  retries: 0
  parallel: false
environment:
  requires: []
  optional:
  - EATME_REPO
agents:
- name: eatme-cli-agent
  type: system
  config:
    shell: bash
    cwd: .
    timeout: 60000
    capture_output: true
- name: instructor-qa-agent
  type: agentic
  config:
    timeout: 900000
    persona_asset: assets/personas/alice-user-crew.yaml
    scenario_asset: assets/scenarios/eatme/instructor-alice-concept-map.yaml
steps:
- name: Validate editable Alice instructor assets
  agent: eatme-cli-agent
  action: execute_command
  params:
    command: |-
      cd "${EATME_REPO:-.}"
      export RUN_ID="${RUN_ID:-gadugi-instructor-alice-concept-map}"
      cargo run -q -p eatme-cli -- assets validate --json
  expect:
    exit_code: 0
    stdout_contains:
    - '"passed": true'
    - '"instructor-alice-concept-map"'
  timeout: 60000
- name: Run instructor agentic QA review
  agent: instructor-qa-agent
  action: agentic_test
  params:
    acceptance_probes: |-
      Concept map has visible behavior, Alice vocabulary, CS vocabulary, and misconception columns.
      Prediction and debugging questions are answerable from the student artifact.
      Transfer prompt helps students bridge Alice to text-based programming.
    asset: assets/scenarios/eatme/instructor-alice-concept-map.yaml
    prompt: Act as an instructor QA agent building a concept map. Given an Alice lesson idea, produce a concept ladder from visible world behavior to Alice vocabulary to transferable CS vocabulary. Include misconception checks, one prediction question, one debugging question, and one transfer prompt. Prefer agent reasoning over code assertions.
  expect:
    output_contains:
    - concept_map
    - misconception_checks
    - transfer_prompt
  timeout: 900000
assertions:
- name: Assets Validate
  type: command_success
  agent: eatme-cli-agent
  params:
    step: Validate editable Alice instructor assets
- name: Instructor Agentic Review Covers Probes
  type: agentic_acceptance
  agent: instructor-qa-agent
  params:
    asset: assets/scenarios/eatme/instructor-alice-concept-map.yaml
