  - id: accessibility-rescue-camera-captions
    origin: creative-new
    coverage: [world-creation, export-share, classroom-use]
    user_story: As an accessibility-advocate, I want to revise a confusing world for different audiences, so that inclusive design becomes part of programming practice.
    personas:
      instructors: [studio-facilitator, assessment-curator]
      students: [accessibility-advocate, collaborative-peer-mentor, creative-storyteller]
    educational_intent:
      concepts: [audience, camera, text, audio alternatives, usability test]
      habits: [empathy, peer critique, revision]
    constraints:
      - Students should not be asked to disclose disabilities.
      - Accessibility choices should be concrete and testable.
    observable_behaviors:
      instructor:
        - Gives a world-improvement brief with multiple audience needs.
        - Structures peer testing around understandability.
      student:
        - 'Adds or revises at least one cue: caption, slower camera, visible label, non-audio signal, or clearer text.'
        - Explains who the change helps.
      system_or_artifact:
        - Revised world is easier for a peer to follow without relying on one sensory channel.
