  - id: mythic-choice-event-tree
    origin: creative-new
    coverage: [lessons, run-debug, export-share]
    user_story: As a creative-storyteller, I want viewers to choose a mythic path, so that events and conditionals create interactive narrative.
    personas:
      instructors: [concept-cartographer, assessment-curator]
      students: [creative-storyteller, systems-puzzle-solver, game-narrative-designer]
    educational_intent:
      concepts: [event, conditional, state, branch, narrative design]
      habits: [choice design, testing alternate paths, reflection]
    constraints:
      - Branching must be small enough to finish; two meaningful choices beat eight shallow ones.
      - Choices should have visible consequences.
    observable_behaviors:
      instructor:
        - Sets a two-choice branching limit and asks for test evidence of both paths.
        - Rubric values visible consequence and explanation.
      student:
        - Creates an interactive choice with at least two outcomes.
        - Tests and records both paths.
      system_or_artifact:
        - Viewer choice changes scene outcome, character response, or ending.
    agentic_test_prompt: >-
      Create an Alice interactive myth scenario using events and conditionals. Require two tested paths and a short explanation of how state or choice controls the story.
    acceptance_probes:
      - Both paths are testable and visibly distinct.
      - Student explains the branch condition or event trigger.
    avoid:
      - Oversized branching trees or hidden-only outcomes.
