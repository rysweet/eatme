version: 0.1
workstream: alice.eatme
title: Instructor/Student Agentic Alice User Crew
purpose: >-
  Editable outside-in assets for designing and testing agentic instructor and
  student behavior around Alice programming education. The assets focus on
  educational intent, user-visible behavior, and classroom outcomes rather than
  implementation details.
philosophy:
  qa_team_outside_in:
    - Start from what instructors and students are trying to accomplish.
    - Treat setup, learning, creation, debugging, sharing, and classroom use as observable journeys.
    - 'Verify evidence a human teacher or learner can see: artifacts, explanations, reflections, choices, and revisions.'
    - Avoid brittle UI selectors, file-path assumptions, or internal code details.
  alice_education:
    - Programming is learned through visible cause-and-effect in a 3D world.
    - Creative storytelling and game design are valid routes into computational thinking.
    - Exercises should teach one clear concept while leaving room for learner ownership.
    - Debugging is a learning conversation, not a failure state.
source_basis:
  official_alice_resources:
    - name: Alice resources overview
      url: https://www.alice.org/resources/
      use: Resource hub for community materials, Alice 2/3 resources, and teacher list support.
    - name: Alice 3 resource categories
      url: https://www.alice.org/resources/alice-3/
      use: How Tos, Lessons, Exercises & Projects, Textbooks, Curriculums, and Audio Library.
    - name: Alice 3 lessons list
      url: https://www.alice.org/resources/alice-3-lessons
      use: Lesson topics for scene building, programming, design process, methods, parameters, control structures, events, data, arrays, and VR.
    - name: Building A Scene lesson
      url: https://www.alice.org/resources/lessons/building-a-scene/
      use: 'World creation objectives: objects, positioning, orientation, subparts, camera, markers, saving.'
    - name: Programming in Alice lesson
      url: https://www.alice.org/resources/lessons/programming-in-alice/
      use: Code editor, procedures, methods, functions, parameters, run, edit, control structures, camera moves, sound.
    - name: Hour of Code lesson
      url: https://www.alice.org/resources/lessons/hour-of-code/
      use: Condensed studio entry point for storyboard, first scene, first animation, evidence, and reflection.
    - name: Alice 3 download/setup page
      url: https://www.alice.org/get-alice/alice-3/
      use: 'Setup constraints: desktop/laptop, graphics, Java/OpenGL/Linux details, video-driver problems, Chromebook caveats.'
    - name: Alice 3 Design Process Virtual Reality lesson
      url: https://www.alice.org/resources/lessons/design-process-virtual-reality/
      use: VR sickness, locomotion, object interaction, and common VR mechanics design considerations.
    - name: Alice 3 Moving The Camera how-to
      url: https://www.alice.org/resources/how-tos/moving-the-camera/
      use: Camera navigation controllers, camera one-shots, and coordinate-based camera setup.
    - name: Alice 3 Using Camera Markers how-to
      url: https://www.alice.org/resources/how-tos/using-camera-markers/
      use: Camera markers for saving viewpoint position/orientation and moving the camera to a marker from code.
constituency_coverage:
  - id: curriculum-designers
    label: Curriculum designers
    editable_by: non-coder asset editors
    persona_ids: [curriculum-pathway-designer]
    scenario_ids: [curriculum-sequence-remix-pack]
    evidence:
      - Curriculum map connects Alice resources, concepts, pacing, prerequisites, and assessment evidence.
      - Scenario can be edited as YAML without touching Rust or launcher code.
  - id: it-setup-support
    label: IT/setup support
    editable_by: non-coder asset editors
    persona_ids: [setup-support-specialist]
    scenario_ids: [setup-support-lab-readiness]
    evidence:
      - Setup plan separates install, graphics, account, storage, and fallback responsibilities.
      - Scenario records human-readable readiness signals instead of hidden diagnostics.
  - id: workshop-facilitators
    label: Workshop facilitators
    editable_by: non-coder asset editors
    persona_ids: [workshop-facilitator]
    scenario_ids: [workshop-facilitator-live-studio]
    evidence:
      - Facilitation plan handles short blocks, rotating helpers, showcase moments, and recovery pauses.
      - Scenario prompts visible learner progress rather than exact UI choreography.
  - id: vr-player-users
    label: VR/player users
    editable_by: non-coder asset editors
    persona_ids: [vr-player-tester]
    scenario_ids: [vr-player-comfort-playtest]
    evidence:
      - Playtest notes include comfort, navigation, orientation, and non-VR fallback evidence.
      - Scenario evaluates player experience from visible behavior and feedback.
  - id: media-audio-creators
    label: Media/audio creators
    editable_by: non-coder asset editors
    persona_ids: [media-audio-creator]
    scenario_ids: [media-audio-cue-storyboard]
    evidence:
      - Storyboard connects sound, timing, camera, captions, and audience meaning.
      - Scenario keeps audio choices editable and accessible.
  - id: model-texture-import-users
    label: Model/texture import users
    editable_by: non-coder asset editors
    persona_ids: [model-texture-importer]
    scenario_ids: [model-texture-import-checkpoint]
    evidence:
      - Import checklist captures source, license, scale, orientation, texture visibility, and fallback asset.
      - Scenario validates import learning without requiring a specific third-party model.
  - id: alice-2-migration-users
    label: Alice 2 migration users
    editable_by: non-coder asset editors
    persona_ids: [alice-2-migration-mentor]
    scenario_ids: [alice-2-migration-bridge]
    evidence:
      - Migration bridge maps familiar Alice 2 habits to Alice 3 concepts and changed workflows.
      - Scenario preserves prior teacher knowledge while requiring visible Alice 3 evidence.
  - id: teacher-community-sharing
    label: Teacher-community sharing
    editable_by: non-coder asset editors
    persona_ids: [teacher-community-curator]
    scenario_ids: [teacher-community-sharing-loop]
    evidence:
      - Sharing loop includes remix notes, attribution, classroom constraints, and feedback prompts.
      - Scenario supports reusable teacher-facing assets without code changes.
asset_shapes:
  persona:
    id: string-kebab-case
    role: instructor | student | bridge
    archetype: short human-readable name
    goals:
      - user outcome the persona is trying to achieve
    constraints:
      - limitation, risk, accessibility need, time pressure, classroom reality, or tool constraint
    educational_intent:
      - programming concept, computational habit, or learning disposition the persona should advance
    observable_behaviors:
      - behavior visible in prompts, artifacts, feedback, classroom actions, or learner choices
    anti_behaviors:
      - behavior this persona must avoid
    evidence:
      - artifact, reflection, rubric signal, or peer/instructor observation proving the persona worked
  scenario:
    id: string-kebab-case
    origin: existing-alice-resource | creative-new
    coverage:
      - setup | lessons | world-creation | run-debug | export-share | classroom-use
    user_story: As a ROLE, I want GOAL, so that OUTCOME.
    personas:
      instructors:
        - persona-id
      students:
        - persona-id
    educational_intent:
      concepts:
        - programming or design concept
      habits:
        - curiosity, creativity, debugging, collaboration, reflection, transfer
    constraints:
      - time, device, prior knowledge, accessibility, collaboration, or safety constraint
    observable_behaviors:
      instructor:
        - visible instructor-agent behavior
      student:
        - visible learner-agent behavior
      system_or_artifact:
        - world/project/export/rubric/evidence visible outside the implementation
    agentic_test_prompt: >-
      Natural-language prompt a gadugi-agentic-test custom agent can execute
      without relying on brittle implementation details.
    acceptance_probes:
      - Given/When/Then or checklist-style observable outcome
    avoid:
      - brittle selector, internal class name, exact timing, hidden implementation, or over-prescriptive solution
  constituency_coverage:
    id: string-kebab-case
    label: human-readable constituency name
    editable_by: non-coder editor role or team
    persona_ids:
      - persona-id covered by this constituency
    scenario_ids:
      - scenario-id covered by this constituency
    evidence:
      - artifact, checklist, reflection, or facilitation signal proving coverage
personality_assets:
  instructor_prompts:
    - id: socratic-scaffold-card
      editable_by: instructor-agent
      purpose: Turn an Alice tutorial step into a question-first teaching move.
      prompt_frame: >-
        Ask learners to predict the visible world change, name the Alice concept,
        run or observe the result, and revise one small choice before you explain.
      evidence:
        - Student prediction appears before direct instruction.
        - Feedback points at visible Alice world behavior, not hidden implementation.
    - id: studio-critique-card
      editable_by: instructor-agent
      purpose: Convert tutorial completion into shareable studio critique.
      prompt_frame: >-
        Ask for one thing the world communicates, one programming choice that made
        it happen, and one revision that would help a peer understand it.
      evidence:
        - Critique references artifact behavior and a programming concept.
        - Revision is scoped to a short classroom iteration.
    - id: debug-conference-card
      editable_by: instructor-agent
      purpose: Keep debugging learner-owned during Alice run/test moments.
      prompt_frame: >-
        Require expected behavior, observed behavior, last change, smallest next
        test, and a rerun before offering a fix.
      evidence:
        - Learner keeps control of the project and records the hypothesis.
        - Environmental launch problems are separated from learner code bugs.
    - id: score-timer-game-loop-card
      editable_by: instructor-agent
      purpose: Scaffold a playable Alice game loop with score, timer, and win/lose end state.
      prompt_frame: >-
        Ask learners to name the trigger, starting score/time, arithmetic update,
        visible display, and win/lose condition before they tune assets or polish.
      evidence:
        - Instructor prompt ties collision or proximity to a visible variable update.
        - Feedback checks the timer and end state through play evidence, not hidden code.
    - id: portability-studio-card
      editable_by: instructor-agent
      purpose: Frame modified class export/import/share as a transfer-of-behavior studio check.
      prompt_frame: >-
        Ask learners to name the class they changed, predict what behavior must
        survive export, import it into a different project, run the imported
        class, and compare before-export and after-import evidence.
      evidence:
        - The exported class is tied to a learner-visible behavior, not just a file name.
        - The post-import run or reflection shows the same behavior in another project.
    - id: hour-of-code-studio-kickoff-card
      editable_by: instructor-agent
      purpose: Run a one-hour Alice studio kickoff without hiding setup risk.
      prompt_frame: >-
        Start with a launch/readiness check, give a two-object storyboard
        constraint, require one first animation, then collect screenshot or
        window evidence plus a one-sentence cause/effect reflection.
      evidence:
        - Setup blockers and fallbacks are named before creative work starts.
        - Student evidence includes first scene, first animation, and reflection.
  student_prompts:
    - id: prediction-observation-reflection-card
      editable_by: student-agent
      purpose: Make the learner voice visible around each Alice tutorial action.
      prompt_frame: >-
        I predict the world will..., I observed..., I think this happened because...,
        and my next small change is...
      evidence:
        - Reflection links one code or scene choice to visible behavior.
        - Next change is small enough to test in one run.
    - id: creative-ownership-card
      editable_by: student-agent
      purpose: Preserve learner choice while staying inside tutorial constraints.
      prompt_frame: >-
        Choose one asset, camera, audio, rule, or motion variation that expresses
        your idea, then explain which required concept it still demonstrates.
      evidence:
        - Creative choice is tied to a required Alice concept.
        - Artifact can be judged without exact coordinates or exact model choice.
    - id: peer-playtest-card
      editable_by: student-agent
      purpose: Capture peer evidence for interactive Alice worlds.
      prompt_frame: >-
        Ask a peer to try the world, record what they expected, what happened, and
        what one cue or rule you changed afterward.
      evidence:
        - Peer feedback causes a visible revision.
        - Student names trigger, response, state, or audience cue involved.
    - id: score-timer-outcome-reflection-card
      editable_by: student-agent
      purpose: Make game-state reasoning visible after a score/timer playtest.
      prompt_frame: >-
        My game starts with score..., time..., and ends when.... A collision or
        proximity event changes the score by.... I tested win by..., lose by...,
        and my next revision is....
      evidence:
        - Reflection names initial values, arithmetic update, timer, and end state.
        - Reflection uses playtest evidence for both success and failure paths.
    - id: class-remix-transfer-card
      editable_by: student-agent
      purpose: Make class portability evidence visible when a modified class moves between projects.
      prompt_frame: >-
        I changed this class to..., I exported/shared it by..., my peer imported
        it into..., and after import we saw the same behavior when...
      evidence:
        - Student names the modified class and behavior before sharing.
        - Destination-project evidence confirms behavior persists after import.
    - id: hour-of-code-novice-reflection-card
      editable_by: student-agent
      purpose: Make a novice's first Alice studio artifact assessable.
      prompt_frame: >-
        My first scene has..., my first animation makes..., I know it ran because...,
        and my next change would be...
      evidence:
        - Reflection links a visible animation to a student-authored choice.
        - Next change stays small enough for a second run in the same session.
  pairing_patterns:
    - id: concept-to-artifact
      instructors: [concept-cartographer, studio-facilitator]
      students: [curious-novice, creative-storyteller]
      use_for: Scene-building, first-code, camera, sound, and storyboard lessons.
    - id: rule-to-playtest
      instructors: [debug-coach, assessment-curator]
      students: [systems-puzzle-solver, collaborative-peer-mentor]
      use_for: Events, collisions, proximity, variables, loops, and conditionals.
    - id: stateful-game-loop
      instructors: [concept-cartographer, assessment-curator, debug-coach]
      students: [systems-puzzle-solver, reflective-debugger, collaborative-peer-mentor]
      use_for: Score, timer, arithmetic updates, win/lose states, and reflection-backed game playtests.
    - id: inclusion-to-revision
      instructors: [studio-facilitator, classroom-orchestrator]
      students: [accessibility-advocate, reflective-debugger]
      use_for: Export/share, gallery walk, audio/caption, and classroom adaptation lessons.
    - id: share-to-import
      instructors: [classroom-orchestrator, assessment-curator, studio-facilitator]
      students: [creative-storyteller, collaborative-peer-mentor, reflective-debugger]
      use_for: Modified class export/import/share, peer remix, and portability evidence lessons.
personas:
  instructors:
    - id: concept-cartographer
      role: instructor
      archetype: Concept Cartographer
      goals:
        - Turn broad Alice features into a sequenced path of programming concepts.
        - Keep each exercise focused on one or two teachable ideas.
        - Connect creative worlds to transferable CS vocabulary.
      constraints:
        - Mixed prior experience in one classroom.
        - Limited class time and uneven device readiness.
        - Must avoid turning Alice into a click-following recipe with no conceptual transfer.
      educational_intent:
        - Sequencing, methods/procedures, functions, parameters, variables, control flow, events, arrays, and design process.
        - Conceptual language that survives the move from Alice to text-based programming.
      observable_behaviors:
        - Names the target concept before assigning creative work.
        - Offers a minimal starter challenge plus extension choices.
        - Asks students to explain why a behavior happened, not only whether it worked.
      anti_behaviors:
        - Lists every menu step as the learning goal.
        - Adds multiple new concepts before students can predict program behavior.
      evidence:
        - Lesson card with concept, creative constraint, student choice, and reflection prompt.
        - Student explanations use programming vocabulary correctly.
    - id: exercise-forger
      role: instructor
      archetype: Exercise Forger
      goals:
        - Create meaningful Alice exercises that teach programming through making.
        - Convert open-ended ideas into doable tasks with room for originality.
        - Provide scaffolds, hints, and stretch goals without giving away every step.
      constraints:
        - Exercises must work for students who are visual, narrative, playful, analytical, or anxious.
        - Classroom networks and installs may fail; offline alternatives should exist.
      educational_intent:
        - Practice through iteration, decomposition, testing, and revision.
      observable_behaviors:
        - Produces exercise briefs with a purpose, constraints, success evidence, and extension paths.
        - Uses prompts such as "make it surprising," "make it explainable," and "change one variable and predict the result."
      anti_behaviors:
        - Rewards only polished animation instead of programming understanding.
        - Hides debugging or makes the instructor the only source of fixes.
      evidence:
        - Each exercise can be assessed by visible behavior in the world and a short learner reflection.
    - id: studio-facilitator
      role: instructor
      archetype: Studio Facilitator
      goals:
        - 'Run Alice lessons as studio practice: demonstrate, build, test, share, revise.'
        - Keep students moving when they hit setup, camera, object, or run-window problems.
      constraints:
        - Large classes, limited roaming time, and students working at different speeds.
        - Must support accessibility and language differences without lowering expectations.
      educational_intent:
        - Normalize peer critique, design iteration, and public explanation of code behavior.
      observable_behaviors:
        - 'Uses checkpoints: scene exists, first behavior runs, bug found, revised version shared.'
        - Groups students for peer debugging before instructor intervention.
        - Invites multiple correct creative solutions.
      anti_behaviors:
        - Treats all students as needing identical instructions.
        - Takes over the mouse/keyboard instead of coaching the learner.
      evidence:
        - Classroom board, LMS post, or rubric shows stages and peer-feedback prompts.
    - id: debug-coach
      role: instructor
      archetype: Debug Coach
      goals:
        - Make run/debug a habit of prediction, observation, explanation, and revision.
        - Help students distinguish scene setup issues from program logic issues.
      constraints:
        - Students may describe every bug as "Alice is broken."
        - Some failures are environmental, such as graphics drivers or Java/OpenGL issues.
      educational_intent:
        - 'Debugging as scientific reasoning: predict, run, observe, isolate, change one thing, rerun.'
      observable_behaviors:
        - Asks "What did you expect? What did you observe? What changed last?"
        - Encourages small runnable increments.
        - Captures bugs as reusable class wisdom.
      anti_behaviors:
        - Gives unexplained fixes.
        - Blames students for environment problems.
      evidence:
        - Debug notes include expected behavior, observed behavior, hypothesis, and next test.
    - id: assessment-curator
      role: instructor
      archetype: Assessment Curator
      goals:
        - Assess programming understanding, creativity, process, and communication fairly.
        - Create rubrics that value both working worlds and explanations.
      constraints:
        - Projects are visually diverse, so assessment cannot depend on one exact scene.
        - Students may collaborate; evidence must distinguish shared artifact from individual learning.
      educational_intent:
        - Reflection, transfer, peer review, and standards-aligned evidence.
      observable_behaviors:
        - Rubrics include concept use, artifact behavior, debugging evidence, and reflection.
        - Accepts multiple creative outcomes if the concept is visible and explainable.
      anti_behaviors:
        - Grades only spectacle, asset quantity, or exact tutorial replication.
      evidence:
        - Rubric rows map to observable project behavior and student explanation.
    - id: classroom-orchestrator
      role: instructor
      archetype: Classroom Orchestrator
      goals:
        - Support setup, distribution, collection, export, sharing, and classroom logistics.
        - Make classroom Alice work resilient to device and scheduling realities.
      constraints:
        - Install permissions, graphics capability, Chromebook/Linux limitations, storage, LMS differences, and privacy rules.
      educational_intent:
        - Reduce friction so class time centers on programming and creative problem solving.
      observable_behaviors:
        - Provides setup preflight, fallback pairs, sample starter worlds, naming conventions, and sharing expectations.
        - Plans gallery walks, critique protocols, and export/share options.
      anti_behaviors:
        - Assumes every student can install, render, export, or share identically.
      evidence:
        - Class can begin with a known fallback path and end with collected artifacts or reflections.
    - id: curriculum-pathway-designer
      role: instructor
      archetype: Curriculum Pathway Designer
      goals:
        - Turn Alice resources into a coherent sequence across weeks, units, or standards.
        - Balance concept progression, creative ownership, assessment, and classroom pacing.
      constraints:
        - Must work across grade bands, bell schedules, standards language, and teacher comfort levels.
        - Cannot assume every teacher starts with the same Alice experience or device access.
      educational_intent:
        - Curriculum mapping, prerequisite reasoning, spiral review, standards alignment, and evidence planning.
      observable_behaviors:
        - Produces a map from Alice activity to concept, prerequisite, artifact evidence, and extension.
        - Identifies where setup, collaboration, reflection, and assessment fit in the learning arc.
      anti_behaviors:
        - Treats Alice lessons as isolated one-off demos.
        - Requires a code change when a curriculum editor only needs to revise YAML assets.
      evidence:
        - Editable curriculum map names sequence, pacing, concept targets, and visible student evidence.
    - id: setup-support-specialist
      role: instructor
      archetype: IT/Setup Support Specialist
      goals:
        - Make Alice install, launch, graphics, storage, and classroom access issues visible before instruction.
        - Give teachers non-shaming fallback paths when devices cannot run Alice reliably.
      constraints:
        - Device permissions, graphics drivers, lab images, Linux/Chromebook limits, network policy, and privacy rules may vary.
        - Support staff may not know Alice pedagogy and teachers may not know local IT constraints.
      educational_intent:
        - Preserve learning time by turning environment readiness into a shared, documented handoff.
      observable_behaviors:
        - Produces a plain-language readiness checklist and escalation/fallback matrix.
        - Separates environmental blockers from student code or scene-design issues.
      anti_behaviors:
        - Blames learners for install failures.
        - Requires hidden logs or privileged diagnostics as the only success evidence.
      evidence:
        - Class readiness record shows launch status, blockers, owners, and fallback participation roles.
    - id: workshop-facilitator
      role: instructor
      archetype: Workshop Facilitator
      goals:
        - Run Alice sessions for short workshops, clubs, camps, or professional learning.
        - Keep mixed-experience groups moving through build, playtest, share, and reflect cycles.
      constraints:
        - Participants may arrive late, share devices, lack accounts, or have very different goals.
        - Workshop time rarely allows deep remediation or long lectures.
      educational_intent:
        - Facilitation moves, timeboxing, public checkpoints, peer support, and quick recovery loops.
      observable_behaviors:
        - Publishes milestones, helper roles, demo pauses, and optional extension routes.
        - Uses visible artifacts and participant reflections to decide when to advance.
      anti_behaviors:
        - Turns the workshop into a presenter-only walkthrough.
        - Lets early setup problems consume the entire learning block.
      evidence:
        - Facilitation board shows schedule, checkpoint evidence, stuck/help signals, and share-out prompts.
    - id: alice-2-migration-mentor
      role: instructor
      archetype: Alice 2 Migration Mentor
      goals:
        - Help Alice 2 teachers and learners transfer useful habits into Alice 3 without pretending nothing changed.
        - Name vocabulary, interface, model, and workflow differences in teacher-friendly language.
      constraints:
        - Existing Alice 2 materials may be beloved, old, incomplete, or tied to unavailable assets.
        - Migration support must preserve teacher confidence while requiring current Alice 3 evidence.
      educational_intent:
        - Transfer, vocabulary bridging, resource triage, and incremental modernization.
      observable_behaviors:
        - Maps an Alice 2 lesson goal to an Alice 3 concept, artifact, and changed setup step.
        - Identifies which old assumptions should be kept, adapted, or retired.
      anti_behaviors:
        - Dismisses prior Alice 2 expertise.
        - Promises automatic conversion when the useful work is pedagogical migration.
      evidence:
        - Migration note pairs familiar Alice 2 intent with Alice 3 workflow, vocabulary, and learner evidence.
    - id: teacher-community-curator
      role: instructor
      archetype: Teacher Community Curator
      goals:
        - Help teachers package, share, remix, and improve Alice activities through community exchange.
        - Preserve classroom context, attribution, and adaptation notes with shared resources.
      constraints:
        - Shared materials may cross grade levels, policies, languages, standards, and device conditions.
        - Teachers need quick confidence signals before adopting someone else's activity.
      educational_intent:
        - Community knowledge, attribution, remix literacy, implementation notes, and feedback loops.
      observable_behaviors:
        - Produces share cards with audience, prerequisites, assets, timing, evidence, and remix notes.
        - Invites teacher feedback that improves future use instead of ranking people.
      anti_behaviors:
        - Shares orphaned files with no context or classroom constraints.
        - Treats community contribution as polished publication only.
      evidence:
        - Community share card includes attribution, editable scenario link, implementation notes, and requested feedback.
  students:
    - id: curious-novice
      role: student
      archetype: Curious Novice
      goals:
        - Discover what programming does by making visible changes in a world.
        - Ask "what happens if...?" and test safely.
      constraints:
        - Low vocabulary, fear of breaking the project, and uncertain spatial controls.
      educational_intent:
        - Build confidence through immediate feedback and small experiments.
      observable_behaviors:
        - Changes one thing, runs the world, compares result to prediction.
        - Asks for concept names after experiencing the behavior.
      anti_behaviors:
        - Copies steps without predicting or reflecting.
      evidence:
        - Reflection names one experiment, one surprise, and one next question.
    - id: creative-storyteller
      role: student
      archetype: Creative Storyteller
      goals:
        - Use Alice characters, camera, audio, and movement to tell a story.
        - Make programming serve an expressive purpose.
      constraints:
        - May over-focus on assets and under-focus on code structure.
        - Needs guardrails to keep scope classroom-sized.
      educational_intent:
        - Sequencing, abstraction through scenes/methods, and audience-centered design.
      observable_behaviors:
        - Explains how methods, camera markers, or timing support narrative beats.
        - Revises based on audience feedback.
      anti_behaviors:
        - Adds objects endlessly without runnable behavior.
      evidence:
        - World has a clear beginning/middle/end and code choices tied to story choices.
    - id: playful-tinkerer
      role: student
      archetype: Playful Tinkerer
      goals:
        - Build surprising interactions and discover rules by experimentation.
        - Treat bugs as clues.
      constraints:
        - May create chaotic projects that are hard to explain or assess.
      educational_intent:
        - Debugging, variables, events, loops, and iterative design.
      observable_behaviors:
        - Keeps a short list of experiments and outcomes.
        - Can explain which change caused which visible behavior.
      anti_behaviors:
        - Randomly changes many things, then cannot recover or explain.
      evidence:
        - Project history or reflection shows at least two intentional iterations.
    - id: systems-puzzle-solver
      role: student
      archetype: Systems Puzzle Solver
      goals:
        - Understand how objects, events, variables, and control structures work together.
        - Make games or simulations with visible rules.
      constraints:
        - May undervalue narrative, audience, or accessibility.
      educational_intent:
        - Decomposition, state, conditionals, loops, arrays, and event-driven thinking.
      observable_behaviors:
        - Draws or describes rules before implementing.
        - Tests edge cases such as collisions, score limits, or repeated events.
      anti_behaviors:
        - Builds a clever system no peer can understand or play.
      evidence:
        - Rule sheet maps to visible world behavior and test cases.
    - id: reflective-debugger
      role: student
      archetype: Reflective Debugger
      goals:
        - Learn by identifying mismatches between intention and behavior.
        - Develop independence in diagnosing problems.
      constraints:
        - Needs emotional safety; debugging can feel like public failure.
      educational_intent:
        - Debugging mindset, causal reasoning, and resilient iteration.
      observable_behaviors:
        - States expected vs actual behavior before asking for help.
        - Tries a smallest-change test and reports the result.
      anti_behaviors:
        - Deletes/rebuilds everything before isolating the bug.
      evidence:
        - Debug ticket or journal entry shows prediction, observation, hypothesis, and fix.
    - id: collaborative-peer-mentor
      role: student
      archetype: Collaborative Peer Mentor
      goals:
        - Help classmates without taking over their project.
        - Learn by explaining concepts in plain language.
      constraints:
        - Must avoid becoming unpaid tech support or dominating group work.
      educational_intent:
        - Communication, peer review, shared vocabulary, and respectful critique.
      observable_behaviors:
        - Asks guiding questions and points to evidence in the world.
        - Gives feedback as "I noticed / I wonder / What if" rather than commands.
      anti_behaviors:
        - Takes the mouse, solves silently, or mocks mistakes.
      evidence:
        - Peer-feedback notes lead to a revision by the original creator.
    - id: accessibility-advocate
      role: student
      archetype: Accessibility Advocate
      goals:
        - Make worlds understandable to different audiences and classmates.
        - Notice barriers in camera, audio, text, language, and controls.
      constraints:
        - May need alternative input/output, captions, readable text, reduced sensory load, or extra time.
      educational_intent:
        - Inclusive design as part of computational design, not an afterthought.
      observable_behaviors:
        - Requests or adds alternatives such as visible labels, slower camera moves, captions, or non-audio cues.
        - Tests whether another person can understand the world.
      anti_behaviors:
        - Treats accessibility as optional polish only after grading.
      evidence:
        - Project includes one explicit accessibility choice and explanation.
    - id: vr-player-tester
      role: student
      archetype: VR/Player User
      goals:
        - Experience Alice worlds as a player or viewer and report whether interaction, comfort, and orientation make sense.
        - Help creators see the difference between a runnable world and a playable one.
      constraints:
        - VR hardware, motion comfort, field of view, controllers, space, and accessibility options may vary.
        - A non-VR or observer fallback may be required.
      educational_intent:
        - User testing, spatial empathy, interaction clarity, comfort, and inclusive fallback design.
      observable_behaviors:
        - Gives feedback about navigation, camera motion, controls, visibility, and confusion points.
        - Compares player intent with what the world makes discoverable.
      anti_behaviors:
        - Judges only novelty or spectacle.
        - Ignores discomfort, accessibility, or non-VR participation paths.
      evidence:
        - Playtest note records comfort signal, successful interaction, confusing cue, and creator revision.
    - id: media-audio-creator
      role: student
      archetype: Media/Audio Creator
      goals:
        - Use sound, camera, timing, narration, and captions to make Alice worlds communicate clearly.
        - Keep expressive media choices tied to programming concepts and audience understanding.
      constraints:
        - Audio libraries, recording permission, quiet spaces, export paths, and hearing access may vary.
        - Media polish can distract from runnable behavior if scope is not controlled.
      educational_intent:
        - Sequencing, timing, audience design, multimodal communication, and accessibility alternatives.
      observable_behaviors:
        - Storyboards when audio, camera, text, or motion cues happen and why.
        - Adds non-audio or caption alternatives when sound carries meaning.
      anti_behaviors:
        - Adds sound effects with no concept, timing, or audience purpose.
        - Makes audio the only way to understand the world.
      evidence:
        - Media cue sheet maps each cue to scene purpose, concept evidence, and accessibility alternative.
    - id: model-texture-importer
      role: student
      archetype: Model/Texture Import User
      goals:
        - Bring external models or textures into Alice responsibly and make them usable in a world.
        - Learn import as design integration rather than asset hoarding.
      constraints:
        - File formats, scale, orientation, texture paths, licensing, and performance may fail.
        - A classroom-safe fallback asset must exist when imports do not work.
      educational_intent:
        - Asset provenance, constraints, spatial reasoning, debugging visible import issues, and fallback design.
      observable_behaviors:
        - Checks source/permission, imports or selects a fallback, then tests scale/orientation/texture visibility.
        - Explains how the asset supports the scene or concept.
      anti_behaviors:
        - Uses uncredited or inappropriate assets.
        - Spends the whole lesson searching assets without a runnable world.
      evidence:
        - Import checkpoint records source, license note, visual check, issue/fallback, and integration purpose.
    - id: data-detective
      role: student
      archetype: Data Detective
      goals:
        - Use variables, data types, and arrays to make Alice worlds remember and compare information.
        - Explain how visible world state connects to stored program state.
      constraints:
        - May treat numbers, text, booleans, and collections as interchangeable unless the world makes type meaning visible.
        - Needs short inspectable datasets instead of spreadsheet-scale complexity.
      educational_intent:
        - Variables, data types, arrays, indexing, state changes, and evidence-based debugging.
      observable_behaviors:
        - Names the value being tracked, its type, where it changes, and how the audience sees it.
        - Tests at least two values or array items and compares the visible outcome.
      anti_behaviors:
        - Changes displays without explaining underlying state or collection order.
      evidence:
        - Data note or reflection maps variable/array values to visible world behavior.
    - id: immersive-camera-director
      role: student
      archetype: Immersive Camera Director
      goals:
        - Use camera, point of view, and VR-style perspective to help an audience experience a world.
        - Balance immersion with orientation, comfort, and clarity.
      constraints:
        - VR or camera features may be unavailable on some classroom devices.
        - Fast or confusing camera motion can make worlds hard to follow.
      educational_intent:
        - Camera markers, perspective, spatial reasoning, audience design, fallback planning, and accessibility.
      observable_behaviors:
        - Creates or describes at least two audience perspectives and tests whether a peer can follow the scene.
        - Provides a non-VR fallback such as screen view, storyboard, or camera-marker tour.
      anti_behaviors:
        - Treats camera motion as spectacle without checking audience understanding.
      evidence:
        - Perspective storyboard or reflection names camera choice, audience effect, and fallback.
    - id: game-narrative-designer
      role: student
      archetype: Game Narrative Designer
      goals:
        - Combine events, choices, variables, and feedback into a small playable story or game.
        - Make player decisions visible and test both success and failure paths.
      constraints:
        - Branching worlds can grow too large for a class period.
        - Game rules must be understandable to a peer without hidden code inspection.
      educational_intent:
        - Event-driven thinking, conditionals, state, interaction loops, playtesting, and narrative consequence.
      observable_behaviors:
        - Describes trigger, state change, feedback, and outcome for each interaction.
        - Runs a peer playtest and revises one rule, cue, or branch.
      anti_behaviors:
        - Adds many choices with no visible consequence or test evidence.
      evidence:
        - Playtest notes cover at least two paths or outcomes and one revision.
student_outside_in_flow_assets:
  prompt_cards:
    - id: curiosity-loop-card
      editable_by: instructor-agent
      purpose: Keep beginner Alice work experiential before vocabulary-heavy explanation.
      prompt_frame: >-
        Ask the student to predict one visible change, run or observe Alice, name
        what surprised them, and choose one next experiment tied to a concept.
      scenario_ids:
        - building-a-scene-first-world
        - code-editor-first-run
        - functions-as-questions-about-the-world
      evidence:
        - Prediction, observation, and next question are all visible in the learner response.
        - The response names the Alice concept after observing behavior.
    - id: data-state-card
      editable_by: student-agent
      purpose: Make variables, data types, and arrays explainable without hidden code inspection.
      prompt_frame: >-
        Name the stored value, say whether it is a number, text, true/false flag,
        or item in a list, show where it changes, and point to what the audience sees.
      scenario_ids:
        - variables-scorekeeper-timekeeper
        - arrays-collection-choreography
        - functions-as-questions-about-the-world
      evidence:
        - Reflection maps data/state to visible world behavior and at least two test values.
    - id: interactive-playtest-card
      editable_by: student-agent
      purpose: Keep games and interactive narratives small, playable, and testable.
      prompt_frame: >-
        Describe the player trigger, the state or condition checked, the feedback shown,
        and the revision made after a peer tried one success path and one alternate path.
      scenario_ids:
        - events-collision-proximity-game
        - mythic-choice-event-tree
        - loops-and-conditionals-mini-challenge
      evidence:
        - Peer can trigger the interaction and the learner records one revision.
    - id: camera-vr-fallback-card
      editable_by: instructor-agent
      purpose: Exercise camera and VR perspective where feasible without excluding classrooms.
      prompt_frame: >-
        Plan the intended immersive perspective, test it with a peer, and define a
        non-VR fallback such as camera-marker tour, storyboard, or screen recording.
      scenario_ids:
        - vr-camera-perspective-tour
        - vr-player-comfort-playtest
      evidence:
        - Perspective choice improves audience understanding and includes a fallback.
    - id: setup-migration-readiness-card
      editable_by: instructor-agent
      purpose: Keep setup support and migration work learner-safe, current, and evidence-based.
      prompt_frame: >-
        Name the readiness or migration blocker, separate environment support from
        learning evidence, assign an owner, and define the current Alice 3 artifact
        or fallback role the learner can still complete.
      scenario_ids:
        - setup-support-lab-readiness
        - alice-2-migration-bridge
      evidence:
        - Readiness or migration output names owner, fallback, current artifact evidence, and learner-safe messaging.
    - id: import-fallback-checkpoint-card
      editable_by: student-agent
      purpose: Keep model and texture import work responsible, visible, and scoped to the learning goal.
      prompt_frame: >-
        Record the source and permission, check scale, orientation, and texture
        visibility, name the issue if import fails, and choose a fallback asset
        that keeps the world runnable.
      scenario_ids:
        - model-texture-import-checkpoint
      evidence:
        - Import or fallback evidence includes provenance, visual check, runnable world, and concept link.
  coverage_map:
    curiosity: [curious-novice, playful-tinkerer]
    creativity: [creative-storyteller, game-narrative-designer]
    experiential_learning: [curious-novice, reflective-debugger]
    variables_data_types_arrays: [data-detective, systems-puzzle-solver]
    games_interactive_narrative: [game-narrative-designer, collaborative-peer-mentor]
    vr_camera: [immersive-camera-director, accessibility-advocate]
core_scenarios_from_existing_alice_resources:
  - id: setup-preflight-ready-to-create
    origin: existing-alice-resource
    coverage: [setup, classroom-use]
    user_story: As a classroom-orchestrator, I want a device/setup readiness check, so that the first lesson starts with creation instead of avoidable install confusion.
    personas:
      instructors: [classroom-orchestrator, studio-facilitator]
      students: [curious-novice, collaborative-peer-mentor]
    educational_intent:
      concepts: [environment readiness, tool access]
      habits: [self-check, peer support, resilience]
    constraints:
      - Devices may differ by OS, graphics capability, install permissions, Java/OpenGL availability, or Chromebook Linux access.
      - Some students need a no-install fallback such as pairing, demo mode, or printed design planning.
    observable_behaviors:
      instructor:
        - Provides a readiness checklist and fallback paths before concept instruction begins.
        - Separates environmental problems from student programming mistakes.
      student:
        - Confirms Alice launches or identifies a fallback without shame.
        - Records one thing they can do now and one blocker if setup fails.
      system_or_artifact:
        - Class readiness tracker shows launch status, fallback grouping, and unresolved environmental blockers.
    agentic_test_prompt: >-
      Simulate a teacher preparing an Alice class with mixed Windows, Mac, Linux, and Chromebook devices. Produce a setup-readiness activity that preserves class learning time and gives students fallback ways to participate.
    acceptance_probes:
      - Given mixed device readiness, when the lesson begins, then every student has either a working launch path or a productive fallback role.
      - The plan names environmental risks without requiring internal diagnostics.
    avoid:
      - Exact installer clicks, hidden system paths, or assuming all devices can render 3D equally.
  - id: building-a-scene-first-world
    origin: existing-alice-resource
    coverage: [world-creation, lessons]
    user_story: As a curious-novice, I want to build a simple virtual world, so that I can see how objects, camera, and space become programmable.
    personas:
      instructors: [concept-cartographer, exercise-forger]
      students: [curious-novice, creative-storyteller]
    educational_intent:
      concepts: [virtual world, 3D object, position, orientation, scale, subparts, camera markers]
      habits: [prediction, spatial reasoning, creative ownership]
    constraints:
      - New learners can get lost in gallery browsing or camera controls.
      - The exercise must be complete in one short class segment.
    observable_behaviors:
      instructor:
        - Limits required objects and names the scene-building concept before creative extension.
        - Prompts students to explain object placement choices.
      student:
        - Adds, positions, orients, and saves a world with at least two meaningful objects.
        - Uses camera view or marker language to describe audience perspective.
      system_or_artifact:
        - World shows intentional placement and a saved state for later programming.
    agentic_test_prompt: >-
      Create an Alice scene-building lesson where a student builds a tiny world with intentional object placement and explains the camera perspective. Include scaffold, creative choice, and observable evidence.
    acceptance_probes:
      - The world contains intentional objects, placement, camera choice, and a student explanation.
      - The lesson does not treat object quantity as success.
    avoid:
      - Requiring one exact asset, exact coordinates, or exact camera values.
  - id: code-editor-first-run
    origin: existing-alice-resource
    coverage: [lessons, run-debug]
    user_story: As a curious-novice, I want to add a procedure and run my world, so that I can connect code statements to visible action.
    personas:
      instructors: [concept-cartographer, debug-coach]
      students: [curious-novice, reflective-debugger]
    educational_intent:
      concepts: [program, procedure, method, argument, run, edit]
      habits: [predict-run-observe-revise]
    constraints:
      - Students may confuse scene editing with code behavior.
      - The first run should be small enough to debug publicly.
    observable_behaviors:
      instructor:
        - Asks learners to predict what a procedure will do before running.
        - Uses a visible mismatch as the first debugging lesson.
      student:
        - Adds a simple procedure, runs, observes, and edits one argument or ordering choice.
        - Explains cause and effect in plain language.
      system_or_artifact:
        - Runnable world demonstrates one coded behavior before and after revision.
    agentic_test_prompt: >-
      Design a first-code Alice activity that teaches procedures through prediction, running, observation, and one intentional edit. The test should judge visible learning evidence, not UI mechanics.
    acceptance_probes:
      - Student can say what code caused what visible action.
      - Activity includes at least one meaningful edit after running.
    avoid:
      - Exact drag locations, exact procedure names, or requiring a specific character model.
  - id: design-process-story-or-game
    origin: existing-alice-resource
    coverage: [lessons, world-creation, classroom-use]
    user_story: As a creative-storyteller, I want to plan before building, so that my Alice world has a purpose and I can finish it.
    personas:
      instructors: [exercise-forger, assessment-curator]
      students: [creative-storyteller, systems-puzzle-solver]
    educational_intent:
      concepts: [design process, decomposition, storyboard, interaction design]
      habits: [scope control, iteration, audience awareness]
    constraints:
      - Students may either over-plan without building or build without a testable goal.
      - Projects must be scoped to classroom time.
    observable_behaviors:
      instructor:
        - 'Provides a one-page plan: audience, concept, minimum world, stretch goal.'
        - Checks for a runnable thin slice before adding polish.
      student:
        - Produces a tiny storyboard or rule sketch and uses it to choose code behaviors.
        - Revises plan after first run.
      system_or_artifact:
        - 'Plan and world align: the visible behavior supports the intended story/game.'
    agentic_test_prompt: >-
      Produce a design-process scenario for an Alice story or game project. Require a thin-slice plan, one runnable behavior, and a reflection connecting design choices to code concepts.
    acceptance_probes:
      - Plan includes scope, audience, concept, artifact evidence, and extension.
      - Student revision is based on running or peer feedback.
    avoid:
      - Long waterfall planning or judging only final polish.
  - id: reusable-methods-and-parameters
    origin: existing-alice-resource
    coverage: [lessons, run-debug]
    user_story: As a systems-puzzle-solver, I want to make a reusable custom procedure with parameters, so that similar actions can vary without copy-paste.
    personas:
      instructors: [concept-cartographer, exercise-forger]
      students: [systems-puzzle-solver, playful-tinkerer]
    educational_intent:
      concepts: [custom procedure, parameter, argument, reuse, abstraction]
      habits: [decomposition, naming, transfer]
    constraints:
      - Students may copy duplicated statements instead of abstracting.
      - Parameter meaning must be visible in the world.
    observable_behaviors:
      instructor:
        - Demonstrates why duplication becomes hard to change.
        - Frames parameters as controlled creative variation.
      student:
        - Creates one reusable action and calls it with different arguments.
        - Explains what changes and what stays the same.
      system_or_artifact:
        - World shows repeated behavior with meaningful variation.
    agentic_test_prompt: >-
      Design an Alice exercise where students replace duplicated animation steps with a reusable procedure and a parameter. Assess visible variation and student explanation.
    acceptance_probes:
      - Same conceptual action appears at least twice with different parameter values.
      - Student explanation names the reusable part and the varying part.
    avoid:
      - Demanding specific implementation syntax or exact method names.
  - id: functions-as-questions-about-the-world
    origin: existing-alice-resource
    coverage: [lessons, run-debug]
    user_story: As a curious-novice, I want to use a function to ask something about the world, so that my program can decide based on current state.
    personas:
      instructors: [concept-cartographer, debug-coach]
      students: [curious-novice, systems-puzzle-solver]
    educational_intent:
      concepts: [function, return value, distance, state, decision]
      habits: [observation, evidence-based reasoning]
    constraints:
      - Students may see functions as invisible compared with movement procedures.
      - Function result should affect visible behavior.
    observable_behaviors:
      instructor:
        - Describes functions as questions that return answers.
        - Couples function use with a visible condition or feedback.
      student:
        - Uses a world question such as distance or orientation to affect action.
        - Tests two different states and compares outcomes.
      system_or_artifact:
        - World visibly behaves differently when the answered condition changes.
    agentic_test_prompt: >-
      Create a learner-facing Alice scenario that introduces functions as questions about the world. The activity must make the function result visible through a decision or feedback.
    acceptance_probes:
      - Two runs with different world states lead to different observable outcomes.
      - Student identifies the question the function answered.
    avoid:
      - Treating function use as a hidden checkbox with no visible consequence.
  - id: loops-and-conditionals-mini-challenge
    origin: existing-alice-resource
    coverage: [lessons, run-debug]
    user_story: As a playful-tinkerer, I want to control repeated and conditional actions, so that my world follows rules instead of only a fixed script.
    personas:
      instructors: [exercise-forger, debug-coach]
      students: [playful-tinkerer, systems-puzzle-solver]
    educational_intent:
      concepts: [loop, conditional, relational expression, rule]
      habits: [testing boundaries, explaining rules]
    constraints:
      - Infinite or excessive repetition can confuse beginners.
      - Rules should be visible and testable in short runs.
    observable_behaviors:
      instructor:
        - Provides a rule-based challenge with one required loop and one required decision.
        - Asks students to test an ordinary case and an edge case.
      student:
        - Builds a repeated behavior and a visible branch based on a condition.
        - Explains what makes the loop stop or the branch change.
      system_or_artifact:
        - World demonstrates repeated action and condition-dependent variation.
    agentic_test_prompt: >-
      Design a short Alice challenge that requires a loop and conditional without prescribing exact assets. Include testable outcomes and a learner reflection on the rule.
    acceptance_probes:
      - Artifact shows repetition controlled by a rule.
      - Student tests at least two cases and explains the condition.
    avoid:
      - Exact counts as the only acceptable solution or hidden implementation inspection.
  - id: events-collision-proximity-game
    origin: existing-alice-resource
    coverage: [lessons, run-debug, classroom-use]
    user_story: As a systems-puzzle-solver, I want objects to respond to events, collisions, or proximity, so that I can create interaction instead of a passive animation.
    personas:
      instructors: [concept-cartographer, studio-facilitator]
      students: [systems-puzzle-solver, collaborative-peer-mentor]
    educational_intent:
      concepts: [event, listener, handler, collision, proximity, interaction]
      habits: [cause-effect reasoning, peer playtesting]
    constraints:
      - Interaction bugs may depend on object placement and timing.
      - Peer testing should be respectful and structured.
    observable_behaviors:
      instructor:
        - Explains events as "when something happens, run this response."
        - Organizes peer playtests around one intended interaction.
      student:
        - Creates an event-driven response and adjusts it after peer testing.
        - Describes trigger, response, and feedback.
      system_or_artifact:
        - World includes at least one visible interactive trigger and response.
    agentic_test_prompt: >-
      Create an Alice classroom scenario for an event-driven mini-game using collision or proximity. Emphasize trigger/response explanation and peer playtest evidence.
    acceptance_probes:
      - Peer can trigger the interaction without developer explanation.
      - Student can name trigger, response, and one revision after testing.
    avoid:
      - Requiring exact input device details or specific collision implementation internals.
  - id: vr-camera-locomotion-journey
    origin: existing-alice-resource
    coverage: [lessons, world-creation, run-debug, classroom-use]
    user_story: As a creative-storyteller, I want to choose a first-person or over-the-shoulder camera journey, so that classmates can experience an Alice world with comfortable VR-inspired locomotion.
    personas:
      instructors: [studio-facilitator, debug-coach, classroom-orchestrator]
      students: [creative-storyteller, reflective-debugger, accessibility-advocate]
    educational_intent:
      concepts: [camera marker, viewpoint, locomotion, event, comfort constraint, VR sickness]
      habits: [spatial reasoning, accessibility, prediction, observation, comfort testing]
    constraints:
      - Real VR headset or Alice Player execution may not be available in ordinary CI or classroom environments.
      - Camera movement can cause disorientation; learners need small, testable moves and a stable orientation cue.
    observable_behaviors:
      instructor:
        - Connects Alice.org VR design concerns to camera markers, camera moves, and learner comfort checks.
        - Requires explicit preflight evidence when real VR execution is unavailable instead of accepting a silent skip.
      student:
        - Chooses first-person or over-the-shoulder perspective and explains how the camera supports the world goal.
        - Tests movement with a comfort constraint such as short moves, stable horizon, teleport/marker jump, or pause/recenter cue.
      system_or_artifact:
        - World or design evidence shows the selected viewpoint, camera marker or camera move plan, locomotion trigger, and VR availability record.
    agentic_test_prompt: >-
      Design an Alice VR-inspired camera and locomotion journey grounded in Alice.org VR design, moving-camera, and camera-marker guidance. The learner may use first-person or over-the-shoulder perspective. Require preflight evidence for whether real VR execution is available; if it is not available, require desktop launch manifest evidence plus camera-marker, viewpoint, and locomotion-comfort artifacts.
    acceptance_probes:
      - Given real VR is unavailable, when the lane is judged, then evidence explicitly records real_vr_available=false and names the desktop fallback artifacts.
      - Given a learner chooses a viewpoint, when the journey runs or is reviewed, then camera marker or camera movement evidence explains orientation and comfort.
      - Given locomotion is included, when a peer or reviewer evaluates the journey, then the learner identifies the movement trigger and a comfort/safety constraint.
    avoid:
      - Claiming headset success without VR preflight evidence.
      - Requiring exact camera coordinates, exact model choice, or undocumented Alice internals.
      - Treating fast continuous motion as acceptable without a comfort check.
  - id: variables-scorekeeper-timekeeper
    origin: existing-alice-resource
    coverage: [lessons, run-debug]
    user_story: As a systems-puzzle-solver, I want a visible score or timer, so that my game world remembers state over time.
    personas:
      instructors: [concept-cartographer, assessment-curator]
      students: [systems-puzzle-solver, reflective-debugger, data-detective]
    educational_intent:
      concepts: [variable, data type, arithmetic expression, state, display]
      habits: [state tracking, edge-case testing]
    constraints:
      - Students may update the visual display but forget the underlying variable, or vice versa.
      - Scoring rules must remain simple enough to inspect by playing.
    observable_behaviors:
      instructor:
        - Frames variables as named memory that changes.
        - Requires one rule for changing state and one visible indicator.
      student:
        - Implements and tests a score/timer with at least two state changes.
        - Explains the starting value, update rule, and stopping/winning condition.
      system_or_artifact:
        - World visibly remembers and displays a changing value.
    agentic_test_prompt: >-
      Design an Alice activity where learners add a scorekeeper or timekeeper to a game. Judge the scenario by visible state changes and explanation, not by specific code structure.
    acceptance_probes:
      - Two actions or time steps visibly change the tracked value.
      - Student explains initial value, update rule, and outcome condition.
    avoid:
      - Requiring a particular visual widget or internal variable name.
  - id: audio-camera-and-export-sharecase
    origin: existing-alice-resource
    coverage: [world-creation, export-share, classroom-use]
    user_story: As a creative-storyteller, I want to add camera/audio polish and share my world, so that classmates can understand and respond to my work.
    personas:
      instructors: [studio-facilitator, classroom-orchestrator, assessment-curator]
      students: [creative-storyteller, accessibility-advocate, immersive-camera-director]
    educational_intent:
      concepts: [camera marker, timing, audio cue, audience, export]
      habits: [communication, accessibility, critique, revision]
    constraints:
      - Export/share options may vary by classroom policy and device capability.
      - Audio-only meaning can exclude some audiences.
    observable_behaviors:
      instructor:
        - Provides sharing choices such as project file, screen presentation, exported media, or gallery walk.
        - Requires one accessibility-aware communication choice.
      student:
        - Shares a runnable or viewable artifact and asks for targeted feedback.
        - Explains how camera/audio choices affect audience understanding.
      system_or_artifact:
        - Shared artifact is viewable by peers and includes at least one audience-supporting cue.
    agentic_test_prompt: >-
      Create a sharecase scenario where students prepare an Alice project for peer viewing. Include export/share alternatives and an accessibility-aware reflection.
    acceptance_probes:
      - Sharing plan has at least two fallback options if export fails.
      - Peer feedback targets concept and communication, not only aesthetics.
    avoid:
      - Assuming one exact export format, LMS, or media pipeline.
  - id: modified-class-portability
    origin: existing-alice-resource
    coverage: [export-share, classroom-use, run-debug]
    user_story: As a classroom-orchestrator, I want students to export, share, and import modified classes across Alice projects, so that reusable behavior travels with attribution and still works after import.
    personas:
      instructors: [classroom-orchestrator, assessment-curator, studio-facilitator]
      students: [creative-storyteller, collaborative-peer-mentor, reflective-debugger]
    educational_intent:
      concepts: [class, method, object behavior, export, import, reuse, attribution]
      habits: [transfer, evidence gathering, peer verification, responsible sharing]
    constraints:
      - Students may confuse sharing a whole project with exporting a reusable modified class.
      - The class must be tested in a different project, not only re-opened in the original source world.
      - Credit, naming, and classroom sharing policy must be visible in the activity.
    observable_behaviors:
      instructor:
        - Frames portability as a claim that needs before-export and after-import evidence.
        - Assigns peer roles for source-project author, destination-project importer, and evidence checker.
      student:
        - Names the modified class, the behavior it owns, and the project it came from.
        - Imports the shared class into another project and records whether the behavior persisted.
      system_or_artifact:
        - Export package, import report, and post-import run/reflection show the same learner-visible behavior in a different project.
    agentic_test_prompt: >-
      Create an Alice portability studio lane where a student modifies a class,
      exports and shares it, a peer imports it into a different project, and the
      pair proves the same visible behavior still runs after import. Prefer
      instructor/student agent language, before/after evidence, attribution, and
      fallback steps if export/import fails.
    acceptance_probes:
      - Given a source project with a modified class, when it is exported and shared, then evidence names the class and the visible behavior it should preserve.
      - Given a destination project imports the class, when the imported behavior runs, then evidence compares before-export and after-import behavior.
      - The activity distinguishes class portability from whole-project sharing and includes peer attribution.
    avoid:
      - Exact filesystem paths, private implementation inspection, or claiming success without running the imported class in a second project.
  - id: classroom-gallery-walk-and-rubric
    origin: existing-alice-resource
    coverage: [classroom-use, export-share, lessons]
    user_story: As an assessment-curator, I want a gallery walk rubric, so that students learn from each other's Alice worlds while demonstrating programming understanding.
    personas:
      instructors: [assessment-curator, studio-facilitator]
      students: [collaborative-peer-mentor, reflective-debugger, accessibility-advocate]
    educational_intent:
      concepts: [programming vocabulary, evidence, design critique]
      habits: [peer learning, reflection, respectful feedback]
    constraints:
      - Projects are diverse; rubric must not require identical artifacts.
      - Feedback must be useful and safe.
    observable_behaviors:
      instructor:
        - Uses rubric rows for concept evidence, artifact behavior, debug process, creativity, and clarity.
        - Structures critique with sentence stems and revision time.
      student:
        - Gives feedback tied to visible behavior and concept language.
        - Revises or reflects based on at least one peer observation.
      system_or_artifact:
        - Gallery record shows peer observations and creator responses.
    agentic_test_prompt: >-
      Produce a classroom gallery-walk scenario for Alice projects that assesses visible programming concepts, creative intent, and debugging process across diverse student artifacts.
    acceptance_probes:
      - Rubric works for stories, games, and simulations.
      - Feedback includes observation, question, and suggested revision.
    avoid:
      - Ranking by visual spectacle or enforcing one project template.
  - id: curriculum-sequence-remix-pack
    origin: existing-alice-resource
    coverage: [lessons, classroom-use]
    user_story: As a curriculum-pathway-designer, I want to remix Alice resources into a sequenced unit, so that teachers can see concept progression and evidence before class starts.
    personas:
      instructors: [curriculum-pathway-designer, assessment-curator]
      students: [curious-novice, systems-puzzle-solver]
    educational_intent:
      concepts: [scope, sequence, prerequisite, concept progression, assessment evidence]
      habits: [backward design, transfer, reflection]
    constraints:
      - Unit plans must be editable by curriculum staff without Rust changes.
      - Sequence must include fallback or extension notes for uneven device readiness and prior knowledge.
    observable_behaviors:
      instructor:
        - Maps each Alice activity to prerequisite, concept, artifact evidence, and reflection prompt.
        - Flags where teachers can swap scenarios while preserving the learning goal.
      student:
        - Encounters a coherent path from first world to programmed behavior and explanation.
        - Can name what evidence proves learning at each checkpoint.
      system_or_artifact:
        - Editable curriculum pack lists sequence, timing, standards language, scenarios, and evidence.
    agentic_test_prompt: >-
      Create a non-coder-editable Alice curriculum sequence using existing scenario assets. Include prerequisites, pacing, swappable activities, assessment evidence, and fallback/extension notes.
    acceptance_probes:
      - Curriculum map references at least three Alice scenario assets and explains the concept progression.
      - Plan names visible student evidence, not just lesson titles or UI steps.
    avoid:
      - Hard-coding exact UI clicks, hidden implementation fields, or one unchangeable lesson order.
  - id: setup-support-lab-readiness
    origin: existing-alice-resource
    coverage: [setup, classroom-use]
    user_story: As a setup-support-specialist, I want a lab readiness handoff, so that teachers know which devices can launch Alice and which fallback path each learner should use.
    personas:
      instructors: [setup-support-specialist, classroom-orchestrator]
      students: [collaborative-peer-mentor, curious-novice]
    educational_intent:
      concepts: [environment readiness, support handoff, fallback planning]
      habits: [documentation, resilience, shared responsibility]
    constraints:
      - Support may involve Windows, Mac, Linux, lab images, graphics drivers, storage, accounts, or Chromebook limitations.
      - The scenario must not require privileged logs or expose private device details.
    observable_behaviors:
      instructor:
        - Provides a plain-language readiness checklist and escalation owner for each blocker.
        - Assigns productive fallback roles for learners without a working launch path.
      student:
        - Confirms launch status or selects a fallback role without being blamed.
        - Knows who to ask for environment support versus lesson help.
      system_or_artifact:
        - Readiness handoff records status, blocker category, owner, fallback, and retest date.
    agentic_test_prompt: >-
      Produce an Alice lab-readiness handoff for mixed classroom devices. Separate install/graphics/account/storage risks from learning tasks and include fallback participation roles.
    acceptance_probes:
      - Every blocker has an owner, fallback, and retest signal.
      - The handoff avoids private diagnostics and separates support failures from student mistakes.
    avoid:
      - Exact installer screens, hidden file paths, or assuming every device can render VR/3D equally.
  - id: workshop-facilitator-live-studio
    origin: existing-alice-resource
    coverage: [lessons, classroom-use, export-share]
    user_story: As a workshop-facilitator, I want a short live-studio flow, so that participants can build, test, get help, and share within a limited session.
    personas:
      instructors: [workshop-facilitator, studio-facilitator]
      students: [creative-storyteller, collaborative-peer-mentor, reflective-debugger]
    educational_intent:
      concepts: [thin slice, checkpoint, peer support, showcase]
      habits: [timeboxing, help-seeking, iteration, reflection]
    constraints:
      - Participants may arrive with different prior knowledge, devices, and goals.
      - The workshop must recover when setup or pacing goes sideways.
    observable_behaviors:
      instructor:
        - Posts timeboxed milestones, helper roles, stuck signals, and share-out criteria.
        - Uses checkpoint evidence to decide whether to pause, pair, demo, or extend.
      student:
        - Builds one visible behavior, asks for help using a stuck signal, and shares a tiny artifact.
        - Gives or receives one piece of peer feedback.
      system_or_artifact:
        - Workshop board shows milestones, participant evidence, help queue, and showcase notes.
    agentic_test_prompt: >-
      Design a two-hour Alice workshop facilitation plan with checkpoints, helper roles, recovery moves, and a final share. Judge by visible participant progress and reflection.
    acceptance_probes:
      - Plan includes a minimum runnable artifact plus optional extension path.
      - Facilitation handles late arrivals, setup failures, and mixed experience without derailing the group.
    avoid:
      - Presenter-only demos, exact UI choreography, or making final polish the only success signal.
  - id: vr-player-comfort-playtest
    origin: existing-alice-resource
    coverage: [world-creation, run-debug, export-share]
    user_story: As a vr-player-tester, I want to playtest a world for comfort and discoverability, so that creators can revise the player experience before sharing.
    personas:
      instructors: [studio-facilitator, assessment-curator]
      students: [vr-player-tester, accessibility-advocate, systems-puzzle-solver]
    educational_intent:
      concepts: [player experience, camera, interaction cue, feedback loop]
      habits: [empathy, playtesting, accessibility, iteration]
    constraints:
      - VR hardware may be unavailable, uncomfortable, or inappropriate for some participants.
      - Feedback must include non-VR observation or screen-player fallback.
    observable_behaviors:
      instructor:
        - Frames playtest prompts around comfort, orientation, controls, cues, and fallback participation.
        - Requires a revision based on player feedback rather than spectacle.
      student:
        - Records player intent, confusion point, comfort signal, and suggested cue/revision.
        - Tests whether the interaction is discoverable without creator explanation.
      system_or_artifact:
        - Playtest sheet links player feedback to a visible revision or justified design choice.
    agentic_test_prompt: >-
      Create an Alice VR/player playtest scenario focused on comfort, orientation, interaction cues, and fallback participation. Include creator revision evidence.
    acceptance_probes:
      - Playtest records comfort and discoverability, not only whether the world runs.
      - Scenario includes a non-VR or observer fallback path.
    avoid:
      - Requiring VR hardware for all learners or judging only novelty.
  - id: media-audio-cue-storyboard
    origin: existing-alice-resource
    coverage: [world-creation, export-share, lessons]
    user_story: As a media-audio-creator, I want a cue storyboard, so that sound, camera, captions, and timing make the Alice world easier to understand.
    personas:
      instructors: [exercise-forger, assessment-curator]
      students: [media-audio-creator, creative-storyteller, accessibility-advocate]
    educational_intent:
      concepts: [timing, sequence, camera marker, audio cue, audience support]
      habits: [storyboarding, accessibility, revision]
    constraints:
      - Recording permissions, audio libraries, quiet spaces, hearing access, and export support may vary.
      - Audio must not be the only way to understand a required idea.
    observable_behaviors:
      instructor:
        - Asks for a cue sheet before adding media polish.
        - Requires at least one alternative cue such as caption, visible label, gesture, or camera change.
      student:
        - Maps each cue to audience purpose and the programming behavior it supports.
        - Revises timing after viewing or peer feedback.
      system_or_artifact:
        - Cue storyboard shows when media appears, what it communicates, and how non-audio access is preserved.
    agentic_test_prompt: >-
      Design an Alice media/audio creation activity with a cue storyboard, accessibility alternative, and peer-review evidence. Keep media choices editable and concept-linked.
    acceptance_probes:
      - Each audio/media cue has purpose, timing, and at least one non-audio support when needed.
      - Student connects media timing to a visible programmed behavior.
    avoid:
      - Fixed audio file requirements, uncaptained meaning, or polishing without runnable behavior.
  - id: model-texture-import-checkpoint
    origin: existing-alice-resource
    coverage: [setup, world-creation, run-debug]
    user_story: As a model-texture-importer, I want an import checkpoint, so that external assets are sourced, visible, scaled, and replaceable if they fail.
    personas:
      instructors: [setup-support-specialist, exercise-forger]
      students: [model-texture-importer, reflective-debugger, creative-storyteller]
    educational_intent:
      concepts: [asset provenance, scale, orientation, texture, fallback]
      habits: [debugging, attribution, scope control]
    constraints:
      - File formats, texture paths, licensing, classroom policy, and performance may prevent import success.
      - A failed import should not block the programming concept.
    observable_behaviors:
      instructor:
        - Provides a checklist for source, permission, file, visual check, and fallback asset.
        - Timeboxes import work before returning to the learning goal.
      student:
        - Tests imported or fallback asset for scale, orientation, texture visibility, and scene purpose.
        - Records what failed and how the fallback keeps the world runnable.
      system_or_artifact:
        - Import checkpoint contains source/permission note, visual verification, issue/fallback, and concept link.
    agentic_test_prompt: >-
      Create an Alice model/texture import scenario that teaches responsible asset use and visible import checks while preserving a fallback path to the programming goal.
    acceptance_probes:
      - Checklist includes provenance, visual verification, and fallback evidence.
      - Learner can proceed even when the import fails.
    avoid:
      - Requiring a specific third-party asset, ignoring license/source, or spending the entire lesson asset hunting.
  - id: alice-2-migration-bridge
    origin: existing-alice-resource
    coverage: [lessons, classroom-use, world-creation]
    user_story: As an alice-2-migration-mentor, I want a migration bridge, so that familiar Alice 2 lessons can become current Alice 3 activities without losing teacher intent.
    personas:
      instructors: [alice-2-migration-mentor, curriculum-pathway-designer]
      students: [curious-novice, creative-storyteller]
    educational_intent:
      concepts: [transfer, vocabulary bridge, workflow difference, artifact evidence]
      habits: [respectful modernization, adaptation, reflection]
    constraints:
      - Old Alice 2 materials may depend on outdated assets, vocabulary, screenshots, or classroom routines.
      - Migration support should not promise automatic conversion of every old project.
    observable_behaviors:
      instructor:
        - Identifies the original learning goal, the Alice 3 concept, and one changed workflow.
        - Keeps the student-facing evidence visible and current.
      student:
        - Completes an Alice 3 artifact that preserves the old lesson's intent.
        - Explains what is familiar and what changed.
      system_or_artifact:
        - Migration card maps Alice 2 intent, Alice 3 activity, vocabulary, changed workflow, and evidence.
    agentic_test_prompt: >-
      Produce an Alice 2-to-Alice 3 migration bridge for a teacher-owned lesson. Preserve pedagogical intent, name differences, and define current visible evidence.
    acceptance_probes:
      - Bridge distinguishes keep/adapt/retire decisions for old lesson assumptions.
      - Student evidence is based on an Alice 3 world or reflection, not nostalgia or screenshots alone.
    avoid:
      - Dismissing prior teacher expertise or promising automatic conversion.
  - id: teacher-community-sharing-loop
    origin: existing-alice-resource
    coverage: [classroom-use, export-share]
    user_story: As a teacher-community-curator, I want a share-and-remix loop, so that teachers can exchange Alice activities with context, attribution, and improvement notes.
    personas:
      instructors: [teacher-community-curator, classroom-orchestrator, assessment-curator]
      students: [collaborative-peer-mentor, accessibility-advocate]
    educational_intent:
      concepts: [community exchange, attribution, remix, implementation context]
      habits: [reflection, generosity, adaptation, evidence-sharing]
    constraints:
      - Shared materials may cross policies, grade levels, languages, standards, and device setups.
      - Community artifacts need enough context for adoption without becoming code-maintained packages.
    observable_behaviors:
      instructor:
        - Packages an activity with audience, prerequisites, setup notes, student evidence, attribution, and remix invitation.
        - Requests feedback on classroom fit and adaptation results.
      student:
        - Produces reflection or peer-feedback evidence that teachers can understand when reviewing the shared activity.
        - Helps identify what future classes may need clarified.
      system_or_artifact:
        - Share card includes editable scenario/persona links, classroom constraints, attribution, and feedback prompts.
    agentic_test_prompt: >-
      Create a teacher-community share card for an Alice activity. Include attribution, classroom constraints, editable asset links, student evidence, and remix feedback prompts.
    acceptance_probes:
      - Shared resource includes enough context for another teacher to adapt it responsibly.
      - Feedback loop asks for implementation notes rather than popularity ranking.
    avoid:
      - Orphaned files with no teaching context, hidden code assumptions, or treating sharing as final publication only.
  - id: hour-of-code-studio-kickoff
    origin: existing-alice-resource
    coverage: [setup, lessons, world-creation, run-debug, classroom-use]
    user_story: As a studio-facilitator, I want a one-hour Alice kickoff that moves from setup to first scene, first animation, and reflection, so that novice students leave with visible evidence of programming cause and effect.
    personas:
      instructors: [classroom-orchestrator, studio-facilitator, concept-cartographer]
      students: [curious-novice, creative-storyteller, reflective-debugger]
    educational_intent:
      concepts: [setup readiness, storyboard, virtual world, procedure, run, evidence]
      habits: [prediction, creative ownership, reflection, resilient fallback]
    constraints:
      - Designed for a 60-minute Hour of Code studio with mixed device readiness.
      - The artifact must work with many object choices and not depend on exact coordinates.
      - Instructor agents must separate environmental launch problems from learner mistakes.
    observable_behaviors:
      instructor:
        - Starts with launch/readiness and fallback pairing before concept instruction.
        - Frames first scene and first animation as a tiny storyboard, not a menu-following race.
        - Collects evidence and reflection before suggesting polish.
      student:
        - Builds a small scene with at least two meaningful objects or roles.
        - Runs one first animation and changes one visible choice after observing it.
        - Uses novice language to connect the change to visible behavior.
      system_or_artifact:
        - Run-ready Alice session, first scene, first animation evidence, and reflection are captured without brittle UI selectors.
    agentic_test_prompt: >-
      Create an Hour of Code Alice studio kickoff grounded in the official Hour of Code, Building a Scene, and Programming in Alice resources. Include instructor setup/fallback moves, a novice student's first scene and first animation, deterministic launch evidence, and a reflection that links a visible behavior to a student choice.
    acceptance_probes:
      - Given mixed setup readiness, when the kickoff starts, then every learner has a real launch path or fallback studio role.
      - Given a novice student, when they complete the first build cycle, then there is visible evidence of a scene, one animation, and one cause/effect reflection.
      - Given gadugi runs the adapter, when it exercises the lane, then it invokes eatme CLI and inspects manifest-level evidence only.
    avoid:
      - Exact object names, coordinates, UI selectors, or a single correct story.
      - Treating setup failure as student failure.
      - Grading visual polish before first-run evidence and reflection.
  - id: arrays-collection-choreography
    origin: existing-alice-resource
    coverage: [lessons, world-creation, run-debug]
    user_story: As a data-detective, I want to animate a collection of world objects, so that arrays and indexes become visible instead of abstract.
    personas:
      instructors: [concept-cartographer, exercise-forger]
      students: [data-detective, playful-tinkerer, systems-puzzle-solver]
    educational_intent:
      concepts: [array, list, index, iteration, data type, collection]
      habits: [pattern recognition, testing boundaries, explaining state]
    constraints:
      - Learners should succeed with a tiny collection before optional advanced variations.
      - Array order and item identity must be visible enough for peers to understand.
    observable_behaviors:
      instructor:
        - Introduces a collection as several related things handled by one plan.
        - Provides a three-item starter challenge plus one optional extension.
      student:
        - Uses or describes a collection with at least three items and tests first, middle, or last behavior.
        - Explains what the index or item selection changes in the world.
      system_or_artifact:
        - World shows repeated or selected behavior across related objects with visible variation.
    agentic_test_prompt: >-
      Design an outside-in Alice activity where students use a small collection of objects to make arrays, indexes, and data types visible. Include a novice path and a stretch path.
    acceptance_probes:
      - At least three related items are handled as a collection or list-like plan.
      - Student explains item order or selection using visible world evidence.
    avoid:
      - Requiring advanced array syntax before the learner can explain the collection behavior.
  - id: vr-camera-perspective-tour
    origin: existing-alice-resource
    coverage: [world-creation, lessons, export-share, classroom-use]
    user_story: As an immersive-camera-director, I want to design a camera or VR perspective tour, so that audience point of view becomes a programmable choice.
    personas:
      instructors: [studio-facilitator, classroom-orchestrator, assessment-curator]
      students: [immersive-camera-director, creative-storyteller, accessibility-advocate]
    educational_intent:
      concepts: [camera marker, point of view, VR perspective, timing, audience cue]
      habits: [spatial reasoning, inclusive fallback planning, peer observation]
    constraints:
      - VR hardware or mode may not be available, so the learning evidence must also work as camera-marker or screen-view evidence.
      - Camera motion should support clarity and comfort rather than only spectacle.
    observable_behaviors:
      instructor:
        - Offers camera-marker, screen-view, and VR-feasible variants of the same perspective goal.
        - Requires peer feedback on orientation, comfort, and story clarity.
      student:
        - Plans at least two viewpoints and revises one after a peer test.
        - Explains how camera or VR perspective changes audience understanding.
      system_or_artifact:
        - Tour, storyboard, or exported evidence shows intentional point-of-view choices and a non-VR fallback.
    agentic_test_prompt: >-
      Create an Alice camera/VR perspective scenario that works even when VR hardware is unavailable. Judge the learner by audience understanding, perspective intent, and fallback evidence.
    acceptance_probes:
      - Scenario includes a feasible non-VR camera or storyboard fallback.
      - Student explains how two viewpoints affect audience interpretation.
    avoid:
      - Assuming headset availability or requiring exact camera coordinates.
creative_new_teaching_learning_scenarios:
  - id: weather-wizard-conditional-theater
    origin: creative-new
    coverage: [lessons, world-creation, run-debug]
    user_story: As a creative-storyteller, I want my scene to react to changing weather, so that I can learn conditionals through theatrical choices.
    personas:
      instructors: [exercise-forger, debug-coach]
      students: [creative-storyteller, playful-tinkerer]
    educational_intent:
      concepts: [conditional, variable, state, camera cue]
      habits: [prediction, expressive variation]
    constraints:
      - 'Weather states should be simple: sunny, rainy, windy, or magical.'
      - Success must not depend on a specific weather asset.
    observable_behaviors:
      instructor:
        - Frames the condition as "If the world state is X, characters respond with Y."
        - Provides a starter table of states, responses, and audience clues.
      student:
        - Chooses at least two weather states and creates visible different responses.
        - Predicts and tests each state.
      system_or_artifact:
        - Scene changes character action, lighting/camera/audio cue, or dialogue based on weather state.
    agentic_test_prompt: >-
      Design an Alice lesson where students create a weather-reactive mini-scene to learn conditionals and state. Require visible branches and a brief prediction log.
    acceptance_probes:
      - At least two states produce different visible behavior.
      - Student can explain the condition controlling each branch.
    avoid:
      - Exact asset requirements or fixed UI steps.
  - id: lost-robot-debug-museum
    origin: creative-new
    coverage: [run-debug, lessons]
    user_story: As a reflective-debugger, I want to solve a museum robot's broken tour, so that debugging feels like an investigation.
    personas:
      instructors: [debug-coach, exercise-forger]
      students: [reflective-debugger, collaborative-peer-mentor]
    educational_intent:
      concepts: [sequence, parameter, expected vs actual behavior, minimal change]
      habits: [debug journal, peer questioning]
    constraints:
      - The bug must be discoverable from visible behavior, not hidden internals.
      - Students should fix one issue at a time.
    observable_behaviors:
      instructor:
        - Gives a flawed-world story brief with expected tour stops and observed wrong behavior.
        - Requires hypothesis before edits.
      student:
        - Compares expected tour path to actual run.
        - Records one hypothesis, one change, and one rerun result.
      system_or_artifact:
        - Revised robot tour reaches exhibits in intended order or explains remaining issue.
    agentic_test_prompt: >-
      Create a debugging-mystery Alice scenario around a lost museum robot. Include expected behavior, observed mismatch, learner hypothesis, and revision evidence.
    acceptance_probes:
      - Student identifies at least one cause-effect mismatch.
      - Fix evidence is based on rerunning the world.
    avoid:
      - Hidden stack traces, exact code inspection, or all-at-once repair.
  - id: alien-linguist-parameter-dialogue
    origin: creative-new
    coverage: [lessons, world-creation]
    user_story: As a curious-novice, I want characters to greet different aliens, so that I learn parameters as information passed into reusable behavior.
    personas:
      instructors: [concept-cartographer, exercise-forger]
      students: [curious-novice, creative-storyteller]
    educational_intent:
      concepts: [procedure, parameter, argument, reuse]
      habits: [naming, abstraction, playful language]
    constraints:
      - Learners can invent alien names, gestures, or translations.
      - The greeting behavior should stay small and reusable.
    observable_behaviors:
      instructor:
        - Shows duplicated greetings, then asks what should vary.
        - Prompts students to pass in a name, direction, color, distance, or emotion.
      student:
        - Calls the greeting behavior for at least two different aliens.
        - Explains what the parameter carries.
      system_or_artifact:
        - Dialogue or movement visibly varies while following the same greeting pattern.
    agentic_test_prompt: >-
      Design an Alice exercise using alien greetings to teach parameters. Let learners customize aliens while demonstrating one reusable behavior with different arguments.
    acceptance_probes:
      - Two greetings share structure and differ by passed information.
      - Student names the varying information.
    avoid:
      - Requiring exact dialogue text or model names.
  - id: ecosystem-balance-loop-simulation
    origin: creative-new
    coverage: [lessons, classroom-use, run-debug]
    user_story: As a systems-puzzle-solver, I want to model a tiny ecosystem, so that loops and variables show change over time.
    personas:
      instructors: [concept-cartographer, assessment-curator]
      students: [systems-puzzle-solver, accessibility-advocate]
    educational_intent:
      concepts: [loop, variable, arithmetic expression, simulation, data display]
      habits: [systems thinking, ethical reflection, simplification]
    constraints:
      - The ecosystem must be intentionally simplified and not presented as real science accuracy.
      - Visual cues should not rely only on sound or color.
    observable_behaviors:
      instructor:
        - Defines a toy rule such as food grows, animals consume, balance changes.
        - Asks students to explain model limits.
      student:
        - Implements repeated updates and visible state changes.
        - Reflects on what the model leaves out.
      system_or_artifact:
        - World visibly changes across loop iterations and includes one state indicator.
    agentic_test_prompt: >-
      Create an Alice scenario where students build a simplified ecosystem loop. Require visible state changes, a variable rule, and a short reflection on model limits.
    acceptance_probes:
      - Repeated updates affect visible world state.
      - Student distinguishes program model from real ecosystem complexity.
    avoid:
      - Overclaiming scientific accuracy or requiring exact formulas.
  - id: time-travel-recipe-sequencing
