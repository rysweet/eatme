  - id: game-score-timer-win-lose-loop
    origin: creative-new
    coverage: [lessons, run-debug, classroom-use]
    user_story: As a systems-puzzle-solver, I want my Alice game to keep score, count down time, and end with a win or lose state, so that interaction has a clear playable goal.
    personas:
      instructors: [concept-cartographer, assessment-curator, debug-coach]
      students: [systems-puzzle-solver, reflective-debugger, collaborative-peer-mentor]
    educational_intent:
      concepts: [collision, proximity event, variable, arithmetic expression, timer, comparison, end state]
      habits: [state tracking, edge-case testing, peer playtesting, reflection]
    constraints:
      - The game loop must stay small enough to test in a short classroom turn.
      - Win and lose evidence must be visible without inspecting hidden implementation details.
      - Timer feedback should be understandable without relying only on sound or color.
    observable_behaviors:
      instructor:
        - Frames score and time as variables whose values change through simple rules.
        - Separates collision or proximity trigger, arithmetic update, timer check, and end-state feedback.
        - Requires students to test both win and lose outcomes before polish.
      student:
        - Creates a collision or proximity event that updates a visible score.
        - Uses a timer or countdown to change play state and stop or conclude the game.
        - Reflects on initial values, update rules, and evidence from win and lose playtests.
      system_or_artifact:
        - Playable world displays changing score/time and a visible win or lose state.
        - Peer can trigger the scoring interaction and recognize when the game is over.
    agentic_test_prompt: >-
      Design an outside-in Alice mini-game lane where learners add a visible score,
      timer, and win/lose end state to a collision or proximity game. Use agentic
      classroom evidence: instructor scaffold, student playtest notes, artifact
      behavior, and reflection. Do not require exact Alice UI selectors, asset names,
      variable names, or hidden code inspection.
    acceptance_probes:
      - A collision or proximity event changes score through an arithmetic rule visible to a player.
      - A timer or countdown visibly changes over time and contributes to a win or lose end state.
      - Student reflection names starting values, update rule, timer behavior, and evidence from both win and lose tests.
    avoid:
      - Exact UI coordinates, specific object models, fixed variable names, or brittle timing assertions.
      - Treating a screenshot alone as proof that score, timer, and end-state logic work.
  - id: creature-choreography-loop-lab
    origin: creative-new
    coverage: [lessons, world-creation, export-share]
    user_story: As a playful-tinkerer, I want creatures to perform a dance pattern, so that loops, procedures, and arrays can become embodied and shareable.
    personas:
      instructors: [exercise-forger, assessment-curator]
      students: [playful-tinkerer, creative-storyteller, accessibility-advocate]
    educational_intent:
      concepts: [loop, custom procedure, array or collection, synchronization]
      habits: [pattern recognition, creative iteration, audience awareness]
    constraints:
      - Must remain optional whether students use arrays; a simpler loop/procedure version should still teach.
      - Motion intensity and audio should be adjustable for accessibility.
    observable_behaviors:
      instructor:
        - 'Offers levels: solo loop, group repeated procedure, optional collection-driven choreography.'
        - Requires a shareable explanation of the pattern.
      student:
        - Creates a repeated movement pattern and modifies it intentionally.
        - Shares the dance and explains the repeated unit.
      system_or_artifact:
        - Choreography visibly repeats, varies, or synchronizes across one or more creatures.
    agentic_test_prompt: >-
      Design an Alice choreography lab that teaches loops and reusable procedures, with optional arrays for advanced learners. Include sharing and accessibility choices.
    acceptance_probes:
