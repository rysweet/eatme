name: Quality Gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_real_alice:
        description: Run the real Alice launch smoke on a self-hosted runner
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changed files
    runs-on: ubuntu-latest
    outputs:
      run_rust: ${{ steps.docs_only.outputs.run_rust }}
    steps:
      - name: Decide whether Rust checks are needed
        id: docs_only
        uses: actions/github-script@v7
        with:
          script: |
            const docsOnly = (path) =>
              path === "README.md" ||
              path.startsWith("docs/") ||
              path === "mkdocs.yml" ||
              path === "requirements-docs.txt" ||
              path === ".github/workflows/pages.yml";

            if (context.eventName === "workflow_dispatch") {
              core.setOutput("run_rust", "true");
              return;
            }

            const { owner, repo } = context.repo;
            let files = [];

            if (context.eventName === "pull_request") {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              files = files.map((file) => file.filename);
            } else if (context.eventName === "push") {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) {
                core.setOutput("run_rust", "true");
                return;
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${before}...${context.sha}`,
              });
              files = (comparison.data.files || []).map((file) => file.filename);
            } else {
              core.setOutput("run_rust", "true");
              return;
            }

            core.info(`Changed files: ${files.length ? files.join(", ") : "(none)"}`);
            core.setOutput("run_rust", String(files.some((path) => !docsOnly(path))));

  # Keep these parallel jobs in sync with scripts/quality-gates.sh:
  # fmt, clippy, tests, module size, and coverage are split to reduce wall-clock time.
  rust-static:
    name: fmt, clippy, module size
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-static-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check module size
        run: |
          MODULE_MAX_LINES="${MODULE_MAX_LINES:-500}"
          find crates -name '*.rs' -not -path '*/target/*' -exec wc -l {} + \
            | awk -v max="$MODULE_MAX_LINES" '$2 != "total" && $1 > max { print; bad=1 } END { exit bad }'

  rust-tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --all-features

  rust-coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: |
          if ! cargo llvm-cov --version >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi

      - name: Check coverage
        run: cargo llvm-cov --workspace --all-features --fail-under-lines "${COVERAGE_FAIL_UNDER:-70}" --summary-only

  rust-quality:
    name: fmt, clippy, tests, module size, coverage
    needs: [changes, rust-static, rust-tests, rust-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check quality results
        run: |
          set -euo pipefail

          test "${{ needs.changes.result }}" = "success"

          if [ "${{ needs.changes.outputs.run_rust }}" != "true" ]; then
            echo "Docs-only change; Rust quality checks were not needed."
            exit 0
          fi

          test "${{ needs.rust-static.result }}" = "success"
          test "${{ needs.rust-tests.result }}" = "success"
          test "${{ needs.rust-coverage.result }}" = "success"
          echo "parallel quality gates passed"

  real-alice-launch-smoke:
    name: manual real Alice launch smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_alice
    needs: rust-quality
    runs-on: [self-hosted, linux, x64, alice]
    env:
      EATME_REAL_ALICE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run explicit real Alice smoke
        run: |
          test -n "${ALICE_HOME:-}"
          cargo run -p eatme-cli -- alice launch-smoke \
            --alice-home "$ALICE_HOME" \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --json
