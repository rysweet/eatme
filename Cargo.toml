[workspace]
members = [
  "crates/eatme-core",
  "crates/eatme-alice",
  "crates/eatme-assets",
  "crates/eatme-cli",
  "crates/eatme-test-support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rysweet/eatme"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
zip = "2.2"
